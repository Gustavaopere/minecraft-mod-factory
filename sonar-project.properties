# SonarQube Cloud CI-based analysis configuration.
# Canonical non-test exclusions mirror .sonarcloud.properties. Test files share
# the repository root with production authorities, so they are explicitly
# classified as tests and excluded from source scope instead of from coverage.
sonar.organization=gustavaopere
sonar.projectKey=Gustavaopere_minecraft-mod-factory
# Stable migration baseline for Previous version new-code mode. Bump only at a
# deliberate release/baseline, never per build.
sonar.projectVersion=ci-baseline-v1
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests/**/*,**/test_*.py,**/*_test.py,**/src/test/**/*,**/*.test.js,**/*.test.mjs,**/*.test.cjs,**/*.test.ts,**/*.spec.js,**/*.spec.mjs,**/*.spec.cjs,**/*.spec.ts
sonar.exclusions=art/tooling/blockbench/asset-toolkit/asset_toolkit.js,construction/upstream/references/minebench,construction/upstream/snapshots/schematica,migration/provenance/historical-skills/library/minecraft-commands-scripting/scripts/examples/rcon-backup-warning.sh,migration/provenance/historical-skills/library/minecraft-datapack/scripts/jq-shim.mjs,migration/provenance/historical-skills/library/minecraft-datapack/scripts/validate-datapack.sh,migration/provenance/historical-skills/library/minecraft-imagegen/scripts/scaffold-asset-brief.sh,migration/provenance/historical-skills/library/minecraft-modding/scripts/check-build.sh,migration/provenance/historical-skills/library/minecraft-multiloader/scripts/check-version-sanity.sh,migration/provenance/historical-skills/library/minecraft-plugin-dev/scripts/validate-plugin-layout.sh,migration/provenance/historical-skills/library/minecraft-plugin-dev/scripts/vendor/js-yaml.min.cjs,migration/provenance/historical-skills/library/minecraft-resource-pack/scripts/jq-shim.mjs,migration/provenance/historical-skills/library/minecraft-resource-pack/scripts/validate-resource-pack.sh,migration/provenance/historical-skills/library/minecraft-world-generation/scripts/jq-shim.mjs,migration/provenance/historical-skills/library/minecraft-world-generation/scripts/validate-worldgen-json.sh,migration/provenance/historical-skills/tools/blockbench/minecraft_asset_validator.js,skills/library/minecraft-ci-release/scripts/vendor/js-yaml.min.cjs,skills/library/minecraft-neoforge-engineering/scripts/verify_project.py,**/tests/**/*,**/test_*.py,**/*_test.py,**/src/test/**/*,**/*.test.js,**/*.test.mjs,**/*.test.cjs,**/*.test.ts,**/*.spec.js,**/*.spec.mjs,**/*.spec.cjs,**/*.spec.ts
