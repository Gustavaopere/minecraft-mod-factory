interface:
  display_name: minecraft imagegen
  short_description: Generate or edit Minecraft raster assets such as pack icons,
    promo art, concept textures, thumbnails, banners, and UI mockups. Use when the
    deliverable is a bitmap image rather than JSON, SVG, or code-native assets.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
