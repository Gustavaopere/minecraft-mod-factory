name: PR7 Source Only Transient

on:
  push:
    branches:
      - feat/art-pr7-azurelib-adapter

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GeckoLib provider source regressions
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.geckolib4_adapter.test.js asset_toolkit.geckolib4_blockbench_adapter.test.js
      - name: AzureLib provider source regressions
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.azurelib_adapter.test.js asset_toolkit.azurelib_blockbench_adapter.test.js
      - name: Whitespace
        run: git diff --check HEAD^
