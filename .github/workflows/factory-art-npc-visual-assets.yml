name: Factory Art NPC Visual Assets

on:
  push:
    branches:
      - main
    paths:
      - 'art/README.md'
      - 'art/standards/NPC-VISUAL-ASSET-CONTRACT.md'
      - 'art/tooling/validate_npc_visual_assets.py'
      - 'art/tests/test_npc_visual_asset_manifest.py'
      - 'art/skills/minecraft-asset-art-direction/SKILL.md'
      - 'narrative/skills/minecraft-narrative-authoring/SKILL.md'
      - 'migration/provenance/NPC-VISUAL-ASSET-MIGRATION.md'
      - '.github/workflows/factory-art-npc-visual-assets.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'art/README.md'
      - 'art/standards/NPC-VISUAL-ASSET-CONTRACT.md'
      - 'art/tooling/validate_npc_visual_assets.py'
      - 'art/tests/test_npc_visual_asset_manifest.py'
      - 'art/skills/minecraft-asset-art-direction/SKILL.md'
      - 'narrative/skills/minecraft-narrative-authoring/SKILL.md'
      - 'migration/provenance/NPC-VISUAL-ASSET-MIGRATION.md'
      - '.github/workflows/factory-art-npc-visual-assets.yml'

permissions:
  contents: read

jobs:
  npc-visual-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run NPC visual asset validator tests
        run: python3 -m unittest art/tests/test_npc_visual_asset_manifest.py

      - name: Check whitespace
        run: >-
          git diff --check HEAD^ --
          art/README.md
          art/standards/NPC-VISUAL-ASSET-CONTRACT.md
          art/tooling/validate_npc_visual_assets.py
          art/tests/test_npc_visual_asset_manifest.py
          art/skills/minecraft-asset-art-direction/SKILL.md
          narrative/skills/minecraft-narrative-authoring/SKILL.md
          migration/provenance/NPC-VISUAL-ASSET-MIGRATION.md
          .github/workflows/factory-art-npc-visual-assets.yml
