name: Materialize I3 Wrapper Authority

on:
  push:
    branches:
      - feat/f3-e3-i2-i3-migration

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/f3-e3-i2-i3-migration
          fetch-depth: 0

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.14'

      - name: Generate repository-owned wrapper authority
        shell: bash
        run: |
          set -euo pipefail
          authority='engineering/tooling/scaffolder/wrapper-authority'
          mkdir -p "$authority"
          cd "$authority"
          printf "rootProject.name = 'i3-wrapper-authority'\n" > settings.gradle
          gradle wrapper --gradle-version 8.14 --distribution-type bin --no-daemon
          rm settings.gradle
          rm -rf .gradle
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Commit generated authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A engineering/tooling/scaffolder/wrapper-authority
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore(engineering): normalize Gradle 8.14 wrapper authority'
          git push origin HEAD:feat/f3-e3-i2-i3-migration
