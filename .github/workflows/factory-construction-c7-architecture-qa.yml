name: Factory Construction C7 Architecture QA

on:
  push:
    branches:
      - main
      - feat/construction-c7-architecture-qa
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/factory-construction-c7-architecture-qa.yml'
      - 'engineering/tooling/import-physical-modlist.py'
      - 'engineering/tests/test_i2_modlist_catalog.py'
      - 'engineering/tests/test_i2_security_review.py'
      - 'engineering/tooling/scaffolder/**'
      - 'engineering/templates/neoforge-mod/**'
      - 'construction/STATUS.md'
      - 'construction/README.md'
      - 'construction/docs/ARCHITECTURE.md'
      - 'construction/core/structural_qa.py'
      - 'construction/core/build_ir.py'
      - 'construction/core/modpack_registry.py'
      - 'construction/schemas/structural-qa-report.schema.json'
      - 'construction/schemas/build-spec.schema.json'
      - 'construction/schemas/build-ir.schema.json'
      - 'construction/schemas/modpack-registry.schema.json'
      - 'construction/runtime/neoforge-registry-probe/**'
      - 'construction/scripts/prepare_neoforge_registry_probe.py'
      - 'construction/tests/test_c7_architecture_qa.py'
      - 'construction/tests/test_c6_sponge_v3.py'
      - 'construction/tests/test_c5_modded_palette.py'
      - 'construction/tests/test_c4_modpack_registry.py'
      - 'construction/tests/test_c4_runtime_registry_probe.py'
      - 'construction/tests/test_c3_vanilla_golden.py'
      - 'construction/tests/test_c2_build_ir.py'
      - 'construction/tests/test_c0_foundation.py'
      - 'docs/superpowers/specs/2026-09-11-construction-c7-architecture-qa-design.md'
      - 'docs/superpowers/plans/2026-09-11-construction-c7-architecture-qa.md'

permissions:
  contents: read

jobs:
  c7-architecture-qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with preserved upstreams
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Install hashed Construction test environment
        run: python3 -m pip install --require-hashes --no-deps -r construction/upstream/harness/schematica-test-lock.txt

      - name: Run shared Engineering I2 regression
        run: >-
          python3 -m unittest
          engineering/tests/test_i2_modlist_catalog.py
          engineering/tests/test_i2_security_review.py
          -v

      - name: Run C7 architecture QA contract tests
        run: python3 -m unittest construction/tests/test_c7_architecture_qa.py -v

      - name: Run C6 regression
        run: python3 -m unittest construction/tests/test_c6_sponge_v3.py -v

      - name: Run C5 regression
        run: python3 -m unittest construction/tests/test_c5_modded_palette.py -v

      - name: Run C4 regression
        run: >-
          python3 -m unittest
          construction/tests/test_c4_modpack_registry.py
          construction/tests/test_c4_runtime_registry_probe.py
          -v

      - name: Materialize C4 NeoForge runtime registry probe for C7 regression
        run: >-
          python3 construction/scripts/prepare_neoforge_registry_probe.py
          --output .factory-ci/c7/runtime-probe

      - name: Build C4 NeoForge runtime registry probe for C7 regression
        run: |
          chmod +x ".factory-ci/c7/runtime-probe/gradlew"
          cd ".factory-ci/c7/runtime-probe"
          GRADLE_USER_HOME="$GITHUB_WORKSPACE/.factory-ci/c7/gradle-home" ./gradlew test build --no-daemon

      - name: Run C3 regression
        run: python3 -m unittest construction/tests/test_c3_vanilla_golden.py -v

      - name: Run C2 regression
        run: python3 -m unittest construction/tests/test_c2_build_ir.py -v

      - name: Run C0 regression
        run: |
          python3 -m unittest construction/tests/test_c0_foundation.py -v
          python3 construction/scripts/validate_c0.py

      - name: Check C7 whitespace
        run: >-
          git diff --check HEAD^ --
          .github/workflows/factory-construction-c7-architecture-qa.yml
          construction/core/structural_qa.py
          construction/schemas/structural-qa-report.schema.json
          construction/tests/test_c7_architecture_qa.py
          docs/superpowers/specs/2026-09-11-construction-c7-architecture-qa-design.md
          docs/superpowers/plans/2026-09-11-construction-c7-architecture-qa.md
          construction/README.md
          construction/docs/ARCHITECTURE.md
          construction/STATUS.md
