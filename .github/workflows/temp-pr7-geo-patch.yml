name: Temporary PR7 AzureLib Geo Patch

on:
  push:
    branches:
      - feat/art-pr7-azurelib3-adapter
    paths:
      - '.github/workflows/temp-pr7-geo-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact AzureLib 3 geo validator patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('art/tooling/blockbench/asset-toolkit/core/provider-adapter/azurelib3_adapter.js')
          text = path.read_text()

          anchor = """const AZURELIB3_PROFILE_IDS = new Set([\n  'azurelib_entity',\n  'azurelib_item',\n  'azurelib_block',\n  'azurelib_armor',\n]);\n\nconst LOOP_VALUES = new Set(["""
          replacement = """const AZURELIB3_PROFILE_IDS = new Set([\n  'azurelib_entity',\n  'azurelib_item',\n  'azurelib_block',\n  'azurelib_armor',\n]);\n\nconst GEO_FORMAT_VERSIONS = new Set(['1.12.0', '1.14.0', '1.21.0']);\n\nconst LOOP_VALUES = new Set(["""
          assert text.count(anchor) == 1, 'profile/version anchor mismatch'
          text = text.replace(anchor, replacement, 1)

          anchor = """function validateMathScalar(value, field) {\n"""
          insertion = """function validateAzureLib3GeoDocument(value) {\n  if (!isPlainObject(value)) {\n    fail('INVALID_AZURELIB3_GEO_DOCUMENT', 'Geo document must be an object.');\n  }\n\n  const formatVersion = value.format_version;\n  if (!GEO_FORMAT_VERSIONS.has(formatVersion)) {\n    fail('UNSUPPORTED_AZURELIB3_GEO_FORMAT', `format_version ${JSON.stringify(formatVersion)} is not supported by AzureLib 3.1.11.`);\n  }\n\n  const geometries = value['minecraft:geometry'];\n  if (!Array.isArray(geometries) || geometries.length === 0) {\n    fail('INVALID_AZURELIB3_GEO_DOCUMENT', 'minecraft:geometry must contain at least one geometry entry.');\n  }\n\n  let boneCount = 0;\n  geometries.forEach((geometry, geometryIndex) => {\n    if (!isPlainObject(geometry)) {\n      fail('INVALID_AZURELIB3_GEO_DOCUMENT', `minecraft:geometry[${geometryIndex}] must be an object.`);\n    }\n    const bones = geometry.bones === undefined ? [] : geometry.bones;\n    if (!Array.isArray(bones)) {\n      fail('INVALID_AZURELIB3_GEO_DOCUMENT', `minecraft:geometry[${geometryIndex}].bones must be an array.`);\n    }\n    bones.forEach((bone, boneIndex) => {\n      if (!isPlainObject(bone)) {\n        fail('INVALID_AZURELIB3_GEO_DOCUMENT', `minecraft:geometry[${geometryIndex}].bones[${boneIndex}] must be an object.`);\n      }\n      boneCount += 1;\n    });\n  });\n\n  return Object.freeze({\n    ok: true,\n    formatVersion,\n    geometryCount: geometries.length,\n    boneCount,\n  });\n}\n\nfunction validateMathScalar(value, field) {\n"""
          assert text.count(anchor) == 1, 'validator insertion anchor mismatch'
          text = text.replace(anchor, insertion, 1)

          anchor = """  AzureLib3ContractError,\n  validateAzureLib3AnimationDocument,\n"""
          replacement = """  AzureLib3ContractError,\n  validateAzureLib3GeoDocument,\n  validateAzureLib3AnimationDocument,\n"""
          assert text.count(anchor) == 1, 'module export anchor mismatch'
          text = text.replace(anchor, replacement, 1)

          path.write_text(text)
          PY
      - name: Verify PR7 geo GREEN and existing core contract
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.azurelib3_geo.test.js asset_toolkit.azurelib3_adapter.test.js asset_toolkit.azurelib3_presence.test.js
      - name: Verify patch whitespace
        run: git diff --check
      - name: Commit verified geo validator
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/tooling/blockbench/asset-toolkit/core/provider-adapter/azurelib3_adapter.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat(art): validate AzureLib 3 geometry documents'
          git push
