name: Temporary PR7 AzureLib Public Bundle Patch

on:
  push:
    branches:
      - feat/art-pr7-azurelib3-adapter
    paths:
      - '.github/workflows/temp-pr7-public-bundle-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate AzureLib Blockbench public surface and bundle recipe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          plugin = Path('art/tooling/blockbench/asset-toolkit/blockbench-plugin/plugin_adapter.js')
          text = plugin.read_text()
          anchor = "const geckolib4 = require('./geckolib4_adapter.js');\n"
          replacement = anchor + "const azurelib3 = require('./azurelib3_adapter.js');\n"
          assert text.count(anchor) == 1, 'plugin require anchor mismatch'
          text = text.replace(anchor, replacement, 1)
          anchor = "  createBlockbenchGeckoLib4Adapter: geckolib4.createBlockbenchGeckoLib4Adapter,\n};"
          replacement = "  createBlockbenchGeckoLib4Adapter: geckolib4.createBlockbenchGeckoLib4Adapter,\n  createBlockbenchAzureLib3Adapter: azurelib3.createBlockbenchAzureLib3Adapter,\n};"
          assert text.count(anchor) == 1, 'plugin export anchor mismatch'
          plugin.write_text(text.replace(anchor, replacement, 1))

          recipe = Path('art/tooling/blockbench/asset-toolkit/build_toolkit_bundle.js')
          text = recipe.read_text()
          anchor = "  'blockbench-plugin/geckolib4_adapter.js',\n  'blockbench-plugin/plugin_adapter.js',"
          replacement = "  'blockbench-plugin/geckolib4_adapter.js',\n  'blockbench-plugin/azurelib3_adapter.js',\n  'blockbench-plugin/plugin_adapter.js',"
          assert text.count(anchor) == 1, 'bundle source anchor mismatch'
          recipe.write_text(text.replace(anchor, replacement, 1))
          PY
      - name: Regenerate deterministic standalone
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --write
      - name: Verify PR7 public and provider contracts
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.azurelib3_adapter.test.js asset_toolkit.azurelib3_geo.test.js asset_toolkit.azurelib3_blockbench_adapter.test.js asset_toolkit.azurelib3_public_api.test.js asset_toolkit.geckolib4_blockbench_adapter.test.js
      - name: Verify deterministic bundle
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --check
      - name: Verify whitespace
        run: git diff --check
      - name: Commit verified public integration and bundle
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            art/tooling/blockbench/asset-toolkit/blockbench-plugin/plugin_adapter.js \
            art/tooling/blockbench/asset-toolkit/build_toolkit_bundle.js \
            art/tooling/blockbench/asset-toolkit/asset_toolkit.js
          git diff --cached --quiet && exit 0
          git commit -m 'feat(art): expose AzureLib Blockbench adapter'
          git push
