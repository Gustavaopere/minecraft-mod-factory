name: Factory Construction C12 Runtime Acceptance

on:
  push:
    branches:
      - feat/construction-c12-runtime-acceptance-preflight
    paths:
      - '.github/workflows/factory-construction-c12-runtime-acceptance.yml'
      - 'construction/runtime/c12_*.py'
      - 'construction/tests/test_c12_*.py'
      - 'construction/schemas/runtime-acceptance-report.schema.json'
      - 'construction/tests/fixtures/c12-preflight/**'
      - 'construction/fixtures/complex-modded-golden/capture-state.json'
  pull_request:
    branches:
      - feat/construction-c11-complex-modded-golden
    paths:
      - '.github/workflows/factory-construction-c12-runtime-acceptance.yml'
      - 'construction/runtime/c12_*.py'
      - 'construction/tests/test_c12_*.py'
      - 'construction/schemas/runtime-acceptance-report.schema.json'
      - 'construction/tests/fixtures/c12-preflight/**'
      - 'construction/fixtures/complex-modded-golden/capture-state.json'

permissions:
  contents: read

jobs:
  c12-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with preserved upstreams
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Run C12 RED runtime acceptance contracts
        run: |
          python3 -m unittest construction/tests/test_c12_runtime_acceptance.py -v
          python3 -m unittest construction/tests/test_c12_runtime_acceptance_security.py -v
