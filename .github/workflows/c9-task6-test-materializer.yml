name: C9 Task 6 Test Materializer

on:
  push:
    branches:
      - feat/construction-c9-agent-mcp

permissions:
  contents: write

jobs:
  materialize-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/construction-c9-agent-mcp
      - name: Insert Task 6 RED tests
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          path = Path("construction/tests/test_c9_agent_mcp.py")
          text = path.read_text(encoding="utf-8")
          marker = '\n\nif __name__ == "__main__":\n    unittest.main()\n'
          if text.count(marker) != 1:
              raise SystemExit(f"expected one unittest main marker, found {text.count(marker)}")
          if "class C9QaPreviewContractTests" in text:
              raise SystemExit("Task 6 tests already present")
          insert = base64.b64decode("").decode("utf-8")
          path.write_text(text.replace(marker, insert + marker), encoding="utf-8")
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add construction/tests/test_c9_agent_mcp.py
          git commit -m 'test(construction): add C9 QA preview RED contract'
          git push origin HEAD:feat/construction-c9-agent-mcp
