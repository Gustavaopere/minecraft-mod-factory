name: C9 C4 Validator RED

on:
  push:
    branches:
      - feat/construction-c9-agent-mcp

permissions:
  contents: write

jobs:
  red:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/construction-c9-agent-mcp
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install hashed Construction environment
        run: python3 -m pip install --require-hashes --no-deps -r construction/upstream/harness/schematica-test-lock.txt

      - name: Run focused C4 C7 RED
        id: focused
        continue-on-error: true
        run: >-
          python3 -m unittest
          construction/tests/test_c4_modpack_registry.py
          construction/tests/test_c7_registry_authority.py
          -v

      - name: Remove temporary RED workflow
        if: always()
        run: |
          rm .github/workflows/c9-c4-validator-red.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/c9-c4-validator-red.yml
          git commit -m "chore: remove isolated C9 C4 RED workflow"
          git push origin HEAD:feat/construction-c9-agent-mcp

      - name: Enforce expected RED
        if: always()
        run: test "${{ steps.focused.outcome }}" = "success"
