name: PR9 Finalize Metadata

on:
  push:
    branches:
      - feat/art-pr9-easy-model-entities

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/art-pr9-easy-model-entities
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh physical snapshot and extension policy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          snapshot = Path('art/tooling/blockbench/asset-toolkit/core/provider-profile/physical_provider_snapshot.js')
          text = snapshot.read_text()
          old_comment = '// Physical modlist authority snapshot checked 2026-09-10 (595 top-level mods).'
          new_comment = '// Physical modlist authority snapshot checked 2026-09-11 (595 top-level mods).'
          if old_comment not in text:
              raise SystemExit('Expected physical snapshot comment not found')
          text = text.replace(old_comment, new_comment, 1)
          old_date = "checkedDate: '2026-09-10'"
          new_date = "checkedDate: '2026-09-11'"
          if old_date not in text:
              raise SystemExit('Expected physical snapshot checkedDate not found')
          snapshot.write_text(text.replace(old_date, new_date, 1))

          policy = Path('art/standards/BLOCKBENCH-EXTENSION-POLICY.md')
          text = policy.read_text()
          eme_row = '| `easy_model_entities` | Easy Model Entities | 1.0.0 | REQUIRED_PROFILE | EME 2.3.0 entity/block-entity authoring and export |'
          if eme_row not in text:
              anchor = '| `azurelib_utils` | AzureLib Animator | 2.1.5 | REQUIRED_PROFILE | AzureLib |'
              if anchor not in text:
                  raise SystemExit('Extension policy table anchor not found')
              text = text.replace(anchor, anchor + '\n' + eme_row, 1)
          eme_note = ('Easy Model Entities was re-audited on 2026-09-11 against the official Blockbench catalog release 1.0.0. '
                      'It requires Blockbench >=4.9.0. Installation remains human-only; MCP use still requires the exact plugin version, '
                      'a compatible editor, the selected EME profile and explicit allowlist authorization.')
          if eme_note not in text:
              anchor = 'The AzureLib plugin officially advertises Blockbench 4.8.0–15.0.0, but this repository keeps MCP enablement fail-closed to the audited project baseline 5.1.6 until another editor version is tested.'
              if anchor not in text:
                  raise SystemExit('Extension policy prose anchor not found')
              text = text.replace(anchor, eme_note + '\n\n' + anchor, 1)
          policy.write_text(text)
          PY
      - name: Regenerate standalone bundle
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --write
      - name: Validate final metadata contract
        working-directory: art/tooling/blockbench/asset-toolkit
        run: |
          node --test \
            asset_toolkit.easy_model_entities_pr9.test.js \
            asset_toolkit.easy_model_entities_api_version.test.js \
            asset_toolkit.provider_expansion.test.js
          node build_toolkit_bundle.js --check
      - name: Remove transient finalizer and commit
        run: |
          git rm .github/workflows/pr9-finalize-metadata.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/tooling/blockbench/asset-toolkit/core/provider-profile/physical_provider_snapshot.js
          git add art/tooling/blockbench/asset-toolkit/asset_toolkit.js
          git add art/standards/BLOCKBENCH-EXTENSION-POLICY.md
          git commit -m 'docs(art): finalize PR9 EME provider metadata'
          git push origin HEAD:feat/art-pr9-easy-model-entities
