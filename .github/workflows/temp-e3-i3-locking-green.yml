name: TEMP E3 I3 Dependency Locking Green

on:
  push:
    branches:
      - feat/f3-e3-i2-i3-migration
    paths:
      - '.github/workflows/temp-e3-i3-locking-green.yml'

permissions:
  contents: write

jobs:
  apply-generate-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/f3-e3-i2-i3-migration
          fetch-depth: 2

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable dependency locking in canonical build sources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              Path('engineering/templates/neoforge-mod/build.gradle.tmpl'),
              Path('engineering/tests/golden/i3-golden-mod/build.gradle'),
          ]
          marker = '''dependencies {\n    implementation "net.neoforged:neoforge:${neo_version}"\n    testImplementation platform("org.junit:junit-bom:${junit_version}")\n    testImplementation 'org.junit.jupiter:junit-jupiter'\n    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'\n}\n\n'''
          locking = marker + '''dependencyLocking {\n    lockAllConfigurations()\n}\n\n'''
          for path in targets:
              text = path.read_text(encoding='utf-8')
              if 'dependencyLocking {' in text:
                  continue
              if marker not in text:
                  raise SystemExit(f'expected dependency block not found: {path}')
              path.write_text(text.replace(marker, locking, 1), encoding='utf-8')

          scaffolder = Path('engineering/tooling/scaffolder/scaffold_mod.py')
          text = scaffolder.read_text(encoding='utf-8')
          marker = '    "build.gradle.tmpl": "build.gradle",\n'
          addition = marker + '    "gradle.lockfile.tmpl": "gradle.lockfile",\n'
          if '"gradle.lockfile.tmpl": "gradle.lockfile"' not in text:
              if marker not in text:
                  raise SystemExit('expected build.gradle template mapping not found')
              text = text.replace(marker, addition, 1)
          scaffolder.write_text(text, encoding='utf-8')
          PY

      - name: Generate canonical Gradle lock state
        run: |
          rm -rf "$RUNNER_TEMP/i3-lockgen"
          cp -R engineering/tests/golden/i3-golden-mod "$RUNNER_TEMP/i3-lockgen"
          cp engineering/tooling/scaffolder/wrapper-authority/gradlew "$RUNNER_TEMP/i3-lockgen/gradlew"
          cp engineering/tooling/scaffolder/wrapper-authority/gradlew.bat "$RUNNER_TEMP/i3-lockgen/gradlew.bat"
          mkdir -p "$RUNNER_TEMP/i3-lockgen/gradle/wrapper"
          cp engineering/tooling/scaffolder/wrapper-authority/gradle/wrapper/gradle-wrapper.properties "$RUNNER_TEMP/i3-lockgen/gradle/wrapper/gradle-wrapper.properties"
          cp engineering/tooling/scaffolder/wrapper-authority/gradle/wrapper/gradle-wrapper.jar "$RUNNER_TEMP/i3-lockgen/gradle/wrapper/gradle-wrapper.jar"
          chmod +x "$RUNNER_TEMP/i3-lockgen/gradlew"
          (
            cd "$RUNNER_TEMP/i3-lockgen"
            GRADLE_USER_HOME="$RUNNER_TEMP/i3-lockgen-gradle-home" ./gradlew dependencies --write-locks --no-daemon
          )
          test -s "$RUNNER_TEMP/i3-lockgen/gradle.lockfile"
          cp "$RUNNER_TEMP/i3-lockgen/gradle.lockfile" engineering/templates/neoforge-mod/gradle.lockfile.tmpl
          cp "$RUNNER_TEMP/i3-lockgen/gradle.lockfile" engineering/tests/golden/i3-golden-mod/gradle.lockfile

      - name: Run I3 tests
        run: >-
          python3 -m unittest
          engineering/tests/test_i3_mod_scaffolder.py
          engineering/tests/test_i3_security_review.py

      - name: Generate project with canonical lock state
        run: >-
          python3 engineering/tooling/scaffolder/scaffold_mod.py
          --mod-spec engineering/tests/fixtures/i3-golden-mod-spec.json
          --config engineering/tests/fixtures/i3-golden-scaffold-config.json
          --output .factory-ci/i3/generated

      - name: Build generated NeoForge project with locked dependencies
        run: |
          cd .factory-ci/i3/generated
          chmod +x gradlew
          GRADLE_USER_HOME="$RUNNER_TEMP/i3-green-gradle-home" ./gradlew test build --no-daemon

      - name: Check whitespace
        run: git diff --check

      - name: Commit permanent I3 locking artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            engineering/templates/neoforge-mod/build.gradle.tmpl \
            engineering/templates/neoforge-mod/gradle.lockfile.tmpl \
            engineering/tests/golden/i3-golden-mod/build.gradle \
            engineering/tests/golden/i3-golden-mod/gradle.lockfile \
            engineering/tooling/scaffolder/scaffold_mod.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(engineering): lock canonical scaffold dependencies"
          git push origin HEAD:feat/f3-e3-i2-i3-migration
