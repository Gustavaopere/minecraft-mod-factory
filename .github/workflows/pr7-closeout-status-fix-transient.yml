name: PR7 Closeout Status Fix Transient

on:
  push:
    branches:
      - docs/art-pr7-closeout-status

permissions:
  contents: write

jobs:
  patch-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/art-pr7-closeout-status
          fetch-depth: 2
      - name: Patch canonical PR7 closeout facts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('STATUS.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'FACTORY_PHASE=ART_PR7_AZURELIB_ADAPTER_MERGED_TARGETED_AND_ACTIONS_GREEN_REFERENCE_ONLY_RUNTIME_UNPROVEN_STATUS_CLOSEOUT':
                  'FACTORY_PHASE=ART_PR7_AZURELIB_ADAPTER_MERGED_ACTIONS_GREEN_SONAR_NOT_GREEN_REFERENCE_ONLY_RUNTIME_UNPROVEN_STATUS_CLOSEOUT',
              'PR7_STATE=MERGED_TARGETED_AND_ACTIONS_GREEN_REFERENCE_ONLY_RUNTIME_UNPROVEN; GLOBAL_SONAR_NOT_PASS_PREEXISTING':
                  'PR7_STATE=MERGED_ACTIONS_GREEN_PR_SONAR_FAILED_REFERENCE_ONLY_RUNTIME_UNPROVEN; GLOBAL_SONAR_NOT_PASS',
              'PR8_PHYSICAL_PROVIDER_TARGET=EPIC_FIGHT_21.17.3.1; JAR=epic-fight-21.17.3.1-mc1.21.1-neoforge.jar':
                  'PR8_PLAN_TARGET=NEOFORGE_NATIVE_ANIMATION; TARGET=MINECRAFT_1.21.1_NEOFORGE_21.1.248_JAVA_21; TECHNICAL_PROOF_REQUIRED; UNAVAILABLE_OR_DEFERRED_IF_UNPROVEN',
              'ART_FRONTIER=M4_M5_M6_M8_M3_I1_BASELINE_GREEN; PR5_GENERIC_ANIMATION_MERGED; PR6_GECKOLIB_ADAPTER_MERGED_REFERENCE_ONLY_RUNTIME_UNPROVEN; PR7_AZURELIB_ADAPTER_MERGED_TARGETED_AND_ACTIONS_GREEN_REFERENCE_ONLY_RUNTIME_UNPROVEN; NEXT=PR8_EPIC_FIGHT_RIG_ANIMATION_AUDIT':
                  'ART_FRONTIER=M4_M5_M6_M8_M3_I1_BASELINE_GREEN; PR5_GENERIC_ANIMATION_MERGED; PR6_GECKOLIB_ADAPTER_MERGED_REFERENCE_ONLY_RUNTIME_UNPROVEN; PR7_AZURELIB_ADAPTER_MERGED_ACTIONS_GREEN_SONAR_NOT_GREEN_REFERENCE_ONLY_RUNTIME_UNPROVEN; NEXT=PR8_NEOFORGE_NATIVE_ANIMATION_TECHNICAL_AUDIT',
              'FACTORY_GLOBAL_SONAR_BLOCKER=MAIN_BRANCH_ANALYSIS_FAILED_ON_CURRENT_MAIN; PR7_ACTIONS_SUCCESS_DOES_NOT_CLEAR_GLOBAL_SONAR_STATE':
                  'FACTORY_GLOBAL_SONAR_BLOCKER=PR7_PR_QUALITY_GATE_FAILED_3.7_PERCENT_DUPLICATION; MAIN_BRANCH_ANALYSIS_FAILED_ON_CURRENT_MAIN; ACTIONS_SUCCESS_DOES_NOT_CLEAR_SONAR_STATE',
              'NEXT_ACTION=BEGIN_PR8_EPIC_FIGHT_RIG_ANIMATION_AUDIT_AGAINST_PHYSICAL_EPIC_FIGHT_21.17.3.1; FIRST_RECHECK_PHYSICAL_MODLIST_CURRENT_REPO_BRANCHES_PRS_STATUS_AND_PROVIDER_API; DO_NOT_CLAIM_REAL_HANDOFF; F4/I6_REMAINS_NOT_COMPLETE; I7_REMAINS_BLOCKED':
                  'NEXT_ACTION=BEGIN_PR8_NEOFORGE_NATIVE_ANIMATION_TECHNICAL_AUDIT_FOR_MINECRAFT_1.21.1_NEOFORGE_21.1.248_JAVA_21; FIRST_RECHECK_PHYSICAL_MODLIST_CURRENT_REPO_BRANCHES_PRS_STATUS_AND_EXACT_NEOFORGE_API; IF_RUNTIME_API_NOT_PROVEN_MARK_UNAVAILABLE_OR_DEFERRED; DO_NOT_INVENT_INTEGRATION; DO_NOT_CLAIM_REAL_HANDOFF; F4/I6_REMAINS_NOT_COMPLETE; I7_REMAINS_BLOCKED',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}, found {count}')
              text = text.replace(old, new)

          anchor = 'PR7_AZURELIB_PREMERGE_FULL_SKILL_RUN=34559199870; SUCCESS\n'
          addition = 'PR7_AZURELIB_PREMERGE_SONAR=CHECK_103138571959; QUALITY_GATE_FAILED; DUPLICATION_ON_NEW_CODE=3.7_PERCENT; REQUIRED_LE_3_PERCENT; NOT_COUNTED_AS_PASS\n'
          if addition not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('PR7 premerge Full Skill anchor missing or duplicated')
              text = text.replace(anchor, anchor + addition)

          pr8_anchor = 'PR8_PLAN_TARGET=NEOFORGE_NATIVE_ANIMATION; TARGET=MINECRAFT_1.21.1_NEOFORGE_21.1.248_JAVA_21; TECHNICAL_PROOF_REQUIRED; UNAVAILABLE_OR_DEFERRED_IF_UNPROVEN\n'
          pr13_note = 'PR13_EPIC_FIGHT_PLAN_BOUNDARY=EXTERNAL_DCC_BLENDER_EPIC_FIGHT; NOT_PART_OF_PR8\n'
          if pr13_note not in text:
              if text.count(pr8_anchor) != 1:
                  raise SystemExit('PR8 plan anchor missing or duplicated')
              text = text.replace(pr8_anchor, pr8_anchor + pr13_note)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check -- STATUS.md
      - name: Guard STATUS-only diff
        id: guard
        run: |
          changed="$(git diff --name-only)"
          if [ "$changed" != "STATUS.md" ]; then
            printf 'Unexpected changed files:\n%s\n' "$changed" >&2
            exit 1
          fi
      - name: Commit reconciled closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATUS.md
          git commit -m 'docs(status): reconcile PR7 Sonar and PR8 frontier'
          git push origin HEAD:docs/art-pr7-closeout-status
