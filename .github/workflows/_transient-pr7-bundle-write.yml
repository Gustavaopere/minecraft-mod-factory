name: Transient PR7 Bundle Regeneration

on:
  push:
    branches:
      - feat/art-pr7-azurelib3-adapter
    paths:
      - '.github/workflows/_transient-pr7-bundle-write.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/art-pr7-azurelib3-adapter
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate deterministic standalone bundle
        working-directory: art/tooling/blockbench/asset-toolkit
        run: |
          node build_toolkit_bundle.js --write
          node build_toolkit_bundle.js --check
      - name: Commit generated bundle and remove transient workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/tooling/blockbench/asset-toolkit/asset_toolkit.js
          git rm .github/workflows/_transient-pr7-bundle-write.yml
          git diff --cached --check
          git commit -m 'build(art): regenerate PR7 standalone bundle'
          git push origin HEAD:feat/art-pr7-azurelib3-adapter
