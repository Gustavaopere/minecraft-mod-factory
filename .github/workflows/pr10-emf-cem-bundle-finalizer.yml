name: PR10 EMF CEM Bundle Finalizer

on:
  push:
    branches:
      - feat/art-pr10-emf-cem

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/art-pr10-emf-cem
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate standalone bundle
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --write
      - name: PR10 audited EMF CEM contract
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.emf_cem_pr10.test.js
      - name: Existing provider regressions
        working-directory: art/tooling/blockbench/asset-toolkit
        run: |
          node --test \
            asset_toolkit.provider_expansion.test.js \
            asset_toolkit.geckolib4_adapter.test.js \
            asset_toolkit.azurelib3_adapter.test.js \
            asset_toolkit.neoforge_native_animation_adapter.test.js \
            asset_toolkit.easy_model_entities_pr9.test.js
      - name: Bundle reproducibility
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --check
      - name: Whitespace
        run: git diff --check
      - name: Commit deterministic bundle and remove transient workflow
        run: |
          git rm .github/workflows/pr10-emf-cem-bundle-finalizer.yml
          git add art/tooling/blockbench/asset-toolkit/asset_toolkit.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "build(art): regenerate PR10 standalone bundle"
          git push origin HEAD:feat/art-pr10-emf-cem
