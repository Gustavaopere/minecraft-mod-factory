name: Factory Construction C13 Skill Router

on:
  push:
    branches:
      - feat/construction-c13-skill-router-preflight
    paths:
      - '.github/workflows/factory-construction-c13-skill-router.yml'
      - 'construction/tests/test_c13_*.py'
      - 'skills/capabilities/**'
      - 'skills/scripts/capability_router.py'
      - 'skills/scripts/validate_skill_repository.py'
      - 'skills/ROUTER.md'
      - 'skills/README.md'
      - 'skills/VERSION-AUTHORITY.md'
      - 'skills/USER-GUIDED-WORKFLOW.md'
      - 'engineering/REPO-ROUTING.md'
  pull_request:
    branches:
      - feat/construction-c12-runtime-acceptance-preflight
    paths:
      - '.github/workflows/factory-construction-c13-skill-router.yml'
      - 'construction/tests/test_c13_*.py'
      - 'skills/capabilities/**'
      - 'skills/scripts/capability_router.py'
      - 'skills/scripts/validate_skill_repository.py'
      - 'skills/ROUTER.md'
      - 'skills/README.md'
      - 'skills/VERSION-AUTHORITY.md'
      - 'skills/USER-GUIDED-WORKFLOW.md'
      - 'engineering/REPO-ROUTING.md'

permissions:
  contents: read

jobs:
  c13-router-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with preserved upstreams
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Set up Node 20 for existing skill and art validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.2'

      - name: Run C13 router integration contracts
        run: |
          python3 -m unittest construction/tests/test_c13_skill_router_integration.py -v
          python3 -m unittest construction/tests/test_c13_workflow_contract.py -v

      - name: Run existing Factory skill repository validator
        run: python3 skills/scripts/validate_skill_repository.py

      - name: Check C13 authority integration whitespace
        run: git diff --check
