name: Factory Construction C13 Skill Router

on:
  push:
    branches:
      - feat/construction-c13-skill-router-preflight
    paths:
      - '.github/workflows/factory-construction-c13-skill-router.yml'
      - 'construction/tests/test_c13_*.py'
      - 'skills/capabilities/**'
      - 'skills/scripts/capability_router.py'
  pull_request:
    branches:
      - feat/construction-c12-runtime-acceptance-preflight
    paths:
      - '.github/workflows/factory-construction-c13-skill-router.yml'
      - 'construction/tests/test_c13_*.py'
      - 'skills/capabilities/**'
      - 'skills/scripts/capability_router.py'

permissions:
  contents: read

jobs:
  c13-router-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with preserved upstreams
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Run C13 RED router integration contracts
        run: python3 -m unittest construction/tests/test_c13_skill_router_integration.py -v
