name: C9 Task 3 ArtifactStore RED

on:
  push:
    branches:
      - feat/construction-c9-agent-mcp

jobs:
  task3-red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run isolated Task 3 RED
        run: python3 -m unittest construction.tests.test_c9_agent_mcp.C9ArtifactStoreContractTests -v
