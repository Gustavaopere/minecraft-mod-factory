name: Factory Engineering I10 Multiblock Foundation

on:
  push:
    branches:
      - main
      - engineering/i10-multiblock-foundation-reference
  pull_request:
    branches:
      - main
    paths:
      - 'engineering/tests/fixtures/i10-multiblock-*.json'
      - 'engineering/tests/test_i10_multiblock_foundation*.py'
      - 'engineering/tests/test_i10_chunk_acceptance.py'
      - 'engineering/tests/test_i10_multiplayer_acceptance.py'
      - 'engineering/tests/i10-multiplayer-acceptance.md'
      - 'engineering/tooling/multiblock-foundation/**'
      - 'engineering/tests/golden/i10-multiblock-foundation/**'
      - 'art/golden-samples/i10-multiblock-visual/**'
      - 'engineering/templates/neoforge-mod/**'
      - 'engineering/tooling/scaffolder/**'
      - 'engineering/tooling/test-harness/**'
      - 'engineering/tooling/asset-handoff/**'
      - 'engineering/schemas/asset-handoff.schema.json'
      - 'engineering/schemas/mod-spec.schema.json'
      - 'engineering/tooling/feature-generator/**'
      - 'engineering/tooling/machine-foundation/**'
      - 'engineering/tests/test_i3_*.py'
      - 'engineering/tests/test_i4_*.py'
      - 'engineering/tests/test_i5_*.py'
      - 'engineering/tests/test_i6_*.py'
      - 'engineering/tests/test_i8_*.py'
      - 'engineering/tests/test_i9_*.py'
      - '.github/workflows/factory-engineering-i10-multiblock-foundation.yml'

permissions:
  contents: read

jobs:
  multiblock-structural-build:
    runs-on: ubuntu-24.04
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.factory-ci/i10/gradle-home
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Run I10 and relevant engineering regressions
        run: >-
          python3 -m unittest
          engineering/tests/test_i3_mod_scaffolder.py
          engineering/tests/test_i3_security_review.py
          engineering/tests/test_i4_engineering_validators.py
          engineering/tests/test_i5_test_harness.py
          engineering/tests/test_i6_asset_handoff.py
          engineering/tests/test_i8_feature_generator.py
          engineering/tests/test_i8_feature_generator_neoforge.py
          engineering/tests/test_i9_machine_foundation.py
          engineering/tests/test_i9_machine_foundation_composition.py
          engineering/tests/test_i10_multiblock_foundation.py
          engineering/tests/test_i10_multiblock_foundation_task5.py
          engineering/tests/test_i10_multiblock_foundation_handoff.py
          engineering/tests/test_i10_multiblock_foundation_client_resources.py
          engineering/tests/test_i10_multiblock_foundation_gametest.py
          engineering/tests/test_i10_multiblock_foundation_provider.py
          engineering/tests/test_i10_chunk_acceptance.py
          engineering/tests/test_i10_multiplayer_acceptance.py
          engineering/tests/test_i10_multiblock_foundation_composition.py
          engineering/tests/test_i10_multiblock_foundation_ci.py

      - name: Materialize I10 Golden
        run: |
          rm -rf .factory-ci/i10/generated
          mkdir -p .factory-ci/i10
          python3 engineering/tooling/multiblock-foundation/materialize_i10.py .factory-ci/i10/generated

      - name: Validate multiplayer launcher and run tasks
        run: |
          python3 .factory-ci/i10/generated/run-i10-multiplayer-acceptance.py --help
          chmod +x .factory-ci/i10/generated/gradlew
          cd .factory-ci/i10/generated
          ./gradlew help --task runClientA --no-daemon
          ./gradlew help --task runClientB --no-daemon

      - name: Build materialized NeoForge project
        run: |
          chmod +x .factory-ci/i10/generated/gradlew
          cd .factory-ci/i10/generated
          ./gradlew test build --no-daemon

      - name: Run I10 GameTest server
        run: |
          cd .factory-ci/i10/generated
          ./gradlew runGameTestServer --no-daemon

      - name: Accept EULA in generated fixture only
        run: |
          mkdir -p .factory-ci/i10/generated/run/server
          printf 'eula=true\n' > .factory-ci/i10/generated/run/server/eula.txt

      - name: Run canonical I5 harness
        run: >-
          python3 engineering/tooling/test-harness/run_test_harness.py
          --project .factory-ci/i10/generated

      - name: Verify I5 manifest
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('.factory-ci/i10/generated/build/i5-test-harness/test-manifest.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          assert manifest['overall_state'] == 'PASS', manifest
          suites = {suite['suite_id']: suite['state'] for suite in manifest['suites']}
          assert suites == {
              'unit': 'PASS',
              'gametest': 'PASS',
              'dedicated_server': 'PASS',
          }, suites
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Run I10 real chunk acceptance
        run: python3 engineering/tooling/multiblock-foundation/run_i10_chunk_acceptance.py --project .factory-ci/i10/generated

      - name: Check whitespace
        if: always()
        run: git diff --check HEAD^
