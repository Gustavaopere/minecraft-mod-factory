name: Factory Engineering I10 Multiblock Foundation

on:
  push:
    branches:
      - engineering/i10-multiblock-foundation-reference
  pull_request:
    branches:
      - main
    paths:
      - 'engineering/tests/fixtures/i10-multiblock-*.json'
      - 'engineering/tests/test_i10_multiblock_foundation*.py'
      - 'engineering/tooling/multiblock-foundation/**'
      - 'engineering/tests/golden/i10-multiblock-foundation/**'
      - 'art/golden-samples/i10-multiblock-visual/**'
      - '.github/workflows/factory-engineering-i10-multiblock-foundation.yml'

permissions:
  contents: read

jobs:
  multiblock-structural-build:
    runs-on: ubuntu-24.04
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.factory-ci/i10/gradle-home
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Run I10 composition and runtime contracts
        run: >-
          python3 -m unittest
          engineering/tests/test_i10_multiblock_foundation.py
          engineering/tests/test_i10_multiblock_foundation_task5.py
          engineering/tests/test_i10_multiblock_foundation_composition.py

      - name: Materialize I10 Golden
        run: |
          rm -rf .factory-ci/i10/generated
          mkdir -p .factory-ci/i10
          python3 engineering/tooling/multiblock-foundation/materialize_i10.py .factory-ci/i10/generated

      - name: Build materialized NeoForge project
        run: |
          chmod +x .factory-ci/i10/generated/gradlew
          cd .factory-ci/i10/generated
          ./gradlew test build --no-daemon

      - name: Check whitespace
        if: always()
        run: git diff --check HEAD^
