name: PR10 Closeout Status Finalizer

on:
  push:
    branches:
      - docs/art-pr10-closeout-status
    paths:
      - .github/workflows/pr10-closeout-status-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/art-pr10-closeout-status
          fetch-depth: 0
      - name: Update PR10 closeout status
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('STATUS.md')
          text = path.read_text()

          def replace_exact(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match for {old!r}, found {count}')
              text = text.replace(old, new, 1)

          replace_exact(
              'FACTORY_PHASE=ART_PR9_EASY_MODEL_ENTITIES_MERGED_POSTMERGE_ACTIONS_GREEN_TARGET_EXACT_SOURCE_GAMETEST_PASS_MAIN_SONAR_ANALYSIS_CANCELLED_STATUS_CLOSEOUT',
              'FACTORY_PHASE=ART_PR10_EMF_CEM_MERGED_POSTMERGE_ACTIONS_GREEN_UPSTREAM_SOURCE_BUILD_PASS_TARGET_OVERRIDE_BLOCKED_PLATFORM_VERSION_MISMATCH_PHYSICAL_RUNTIME_UNPROVEN_MAIN_SONAR_ANALYSIS_CANCELLED_STATUS_CLOSEOUT',
          )
          replace_exact('CURRENT_BRANCH=docs/art-pr9-closeout-status', 'CURRENT_BRANCH=docs/art-pr10-closeout-status')
          replace_exact('CURRENT_MAIN_BEFORE_STATUS_UPDATE=3eae9d1f8b74a720109b33ef6956ef4add515388', 'CURRENT_MAIN_BEFORE_STATUS_UPDATE=d1cc1e144c48d9071a61a67c3f09b569ec4e1354')
          replace_exact('HEAD_AT_LAST_GREEN_VERIFICATION=99252c6739d4a84e2412f189700d6418e8627468', 'HEAD_AT_LAST_GREEN_VERIFICATION=d1cc1e144c48d9071a61a67c3f09b569ec4e1354')
          replace_exact(
              'OPEN_PRS_AT_STATUS_WRITE=PR51_MERGED; PR50_MERGED; PR9_STATUS_CLOSEOUT_PR_PENDING; NO_OTHER_OPEN_PRS',
              'OPEN_PRS_AT_STATUS_WRITE=PR53_MERGED; PR10_STATUS_CLOSEOUT_PR_PENDING; NO_OTHER_OPEN_PRS',
          )

          pr9_state = 'PR9_STATE=MERGED_POSTMERGE_ACTIONS_GREEN_TARGET_EXACT_SOURCE_GAMETEST_PASS_PHYSICAL_JAR_FULL_MODPACK_RUNTIME_UNPROVEN; GLOBAL_MAIN_SONAR_NOT_PASS'
          pr10_block = '''PR10_EMF_CEM_PR=53
          PR10_EMF_CEM_PR_HEAD=1b82cd2a3e493af04c1d85e3ebb0ae01d766719d
          PR10_EMF_CEM_MERGE_COMMIT=d1cc1e144c48d9071a61a67c3f09b569ec4e1354
          PR10_EMF_CEM_PHYSICAL_PROVIDER=ENTITY_MODEL_FEATURES_3.3.5; ENTITY_TEXTURE_FEATURES_7.2.1; PHYSICAL_PROVIDER_HEALTH_UNPROVEN
          PR10_EMF_CEM_RUNTIME_SOURCE=Traben-0/Entity_Model_Features@02034eb0f102040b16900be7c900eff88da89e9e
          PR10_EMF_CEM_BLOCKBENCH_SOURCE=JannisX11/blockbench@794e964e966b6783b4e9b98ecbdda5152c0620cc; VERSION=5.1.6
          PR10_EMF_CEM_CEM_TEMPLATE_LOADER=9.2.0; SOURCE=ewanhowell5195/blockbenchPlugins@bdea1d6c5e8f9fca3dbbeb446e568adb025b5ef2
          PR10_EMF_CEM_ANIMATION_ADDON=1.0.5; PREFERRED; EMF_ONLY_DIALECT_EXPLICIT
          PR10_RED1_RUN=34627729637; EXPECTED_MISSING_PR10_APIS
          PR10_RED2_RUN=34628295685; FACTUAL_CONTRACT_FAIL_EXPECTED; EXISTING_REGRESSIONS_PASS; BUNDLE_PASS; WHITESPACE_PASS
          PR10_PREMERGE_PR_RUN=34633047184; SUCCESS
          PR10_PREMERGE_SONAR=CHECK_103374717003; QUALITY_GATE_PASS; 0_NEW_ISSUES; 0_ACCEPTED_ISSUES; 0_SECURITY_HOTSPOTS; 0.0_PERCENT_DUPLICATION_ON_NEW_CODE
          PR10_SOURCE_DIAGNOSTIC_RUN=34629620625
          PR10_UPSTREAM_SOURCE_BUILD=JOB_103362965564; PASS; SOURCE_1.21_NEOFORGE; NEOFORGE_21.0.167; JAVA_25
          PR10_TARGET_21_1_248_OVERRIDE=JOB_103362965505; BLOCKED_BY_PLATFORM_VERSION_MISMATCH; SOURCE_MC_1.21_VS_NEOFORGE_MC_1.21.1; NOT_CODE_FAILURE; NOT_TARGET_EXACT_EVIDENCE
          PR10_POSTMERGE_PR10_RUN=34633683294; SUCCESS
          PR10_POSTMERGE_PR8_RUN=34633683188; SUCCESS
          PR10_POSTMERGE_PR9_RUN=34633683320; SUCCESS
          PR10_POSTMERGE_ACTIONS=23_WORKFLOWS_TERMINAL; NO_FAILURE_CANCELLED_SKIPPED_PENDING_OBSERVED
          PR10_POSTMERGE_SONAR=CHECK_103377105982; ANALYSIS_FAILED; CONCLUSION_CANCELLED; NOT_COUNTED_AS_PASS
          PR10_RUNTIME_EVIDENCE=UNPROVEN
          PR10_RUNTIME_VALIDATED=false
          PR10_F4_I6_EVIDENCE=false
          PR10_STATE=MERGED_POSTMERGE_ACTIONS_GREEN_UPSTREAM_SOURCE_BUILD_PASS_TARGET_OVERRIDE_BLOCKED_PLATFORM_VERSION_MISMATCH_PHYSICAL_JAR_FULL_MODPACK_CLIENT_RESOURCEPACK_MODEL_ANIMATION_RUNTIME_UNPROVEN; GLOBAL_MAIN_SONAR_NOT_PASS'''.replace('          ', '')
          replace_exact(pr9_state, pr9_state + '\n' + pr10_block)

          lines = text.splitlines()
          art_indices = [i for i, line in enumerate(lines) if line.startswith('ART_FRONTIER=')]
          if len(art_indices) != 1:
              raise SystemExit(f'expected one ART_FRONTIER line, found {len(art_indices)}')
          lines[art_indices[0]] = lines[art_indices[0]].replace(
              '; NEXT=PR10_EMF_CEM_AUDIT',
              '; PR10_EMF_CEM_MERGED_POSTMERGE_ACTIONS_GREEN_UPSTREAM_SOURCE_BUILD_PASS_TARGET_OVERRIDE_BLOCKED_PLATFORM_VERSION_MISMATCH_PHYSICAL_RUNTIME_UNPROVEN; NEXT=PR11_ANIMATED_JAVA_AUDIT',
          )
          if 'NEXT=PR11_ANIMATED_JAVA_AUDIT' not in lines[art_indices[0]]:
              raise SystemExit('failed to update ART_FRONTIER next target')
          text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')

          replace_exact(
              'FACTORY_GLOBAL_SONAR_AT_CURRENT_MAIN=ANALYSIS_FAILED; CHECK=103348235909; CONCLUSION=CANCELLED; DO_NOT_LABEL_FACTORY_GLOBALLY_GREEN',
              'FACTORY_GLOBAL_SONAR_AT_CURRENT_MAIN=ANALYSIS_FAILED; CHECK=103377105982; CONCLUSION=CANCELLED; DO_NOT_LABEL_FACTORY_GLOBALLY_GREEN',
          )
          replace_exact(
              'FACTORY_GLOBAL_SONAR_BLOCKER=MAIN_BRANCH_ANALYSIS_FAILED_ON_PR9_MERGE_COMMIT; PREMERGE_PR9_QUALITY_GATE_PASS_DOES_NOT_CLEAR_GLOBAL_MAIN_SONAR_STATE',
              'FACTORY_GLOBAL_SONAR_BLOCKER=MAIN_BRANCH_ANALYSIS_FAILED_ON_PR10_MERGE_COMMIT; PREMERGE_PR10_QUALITY_GATE_PASS_DOES_NOT_CLEAR_GLOBAL_MAIN_SONAR_STATE',
          )
          replace_exact(
              'NEXT_ACTION=BEGIN_PR10_EMF_CEM_AUDIT; FIRST_RECHECK_PHYSICAL_MODLIST_CURRENT_REPO_BRANCHES_PRS_STATUS_AND_EXACT_EMF_CEM_PHYSICAL_VERSION_SOURCE_RUNTIME_CONTRACT; PRESERVE_SOURCE_FORMATS; NO_SILENT_CONVERSION; DO_NOT_CLAIM_REAL_HANDOFF; F4/I6_REMAINS_NOT_COMPLETE; I7_REMAINS_BLOCKED',
              'NEXT_ACTION=BEGIN_PR11_ANIMATED_JAVA_AUDIT; FIRST_RECHECK_PHYSICAL_MODLIST_CURRENT_REPO_BRANCHES_PRS_STATUS_AND_EXACT_ANIMATED_JAVA_PHYSICAL_VERSION_SOURCE_RUNTIME_CONTRACT; PRESERVE_SOURCE_FORMATS; NO_SILENT_CONVERSION; DO_NOT_CLAIM_REAL_HANDOFF; F4/I6_REMAINS_NOT_COMPLETE; I7_REMAINS_BLOCKED',
          )

          if text.count('I6_REAL_HANDOFF=NOT_COMPLETE') != 1:
              raise SystemExit('I6_REAL_HANDOFF invariant missing or duplicated')
          if text.count('I7_STATE=BLOCKED_BY_F4_REAL_I6_HANDOFF') != 1:
              raise SystemExit('I7_STATE invariant missing or duplicated')
          if 'NEXT=PR11_ANIMATED_JAVA_AUDIT' not in text:
              raise SystemExit('PR11 frontier missing')
          if 'PR10_RUNTIME_EVIDENCE=UNPROVEN' not in text or 'PR10_RUNTIME_VALIDATED=false' not in text:
              raise SystemExit('PR10 evidence boundary missing')

          path.write_text(text)
          PY
          git diff --check
      - name: Commit STATUS closeout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add STATUS.md
          git diff --cached --exit-code && { echo 'STATUS.md was not changed'; exit 1; } || true
          git commit -m 'docs(art): close PR10 EMF CEM status'
          git push origin HEAD:docs/art-pr10-closeout-status
