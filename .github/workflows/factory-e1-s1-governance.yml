name: Factory E1 S1 Governance

on:
  push:
    branches:
      - main
      - feat/f1-e1-s1-governance-migration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate governance contract
        run: python3 engineering/tooling/validate-e1-s1-governance.py

      - name: Run E1 S1 regression tests
        run: python3 -m unittest engineering/tests/test_e1_s1_governance.py

      - name: Check governance whitespace
        run: >-
          git diff --check HEAD^ --
          .github/workflows/factory-e1-s1-governance.yml
          STATUS.md
          engineering/AGENT-WORKFLOW.md
          engineering/DIAGNOSTICS.md
          engineering/README.md
          engineering/REPO-ROUTING.md
          engineering/TESTING.md
          engineering/catalog/sources/SOURCE-REGISTRY.json
          engineering/tests/test_e1_s1_governance.py
          engineering/tooling/validate-e1-s1-governance.py
          skills/README.md
          skills/ROUTER.md
          skills/VERSION-AUTHORITY.md
