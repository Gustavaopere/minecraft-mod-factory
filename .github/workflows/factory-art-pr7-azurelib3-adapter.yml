name: Factory Art PR7 AzureLib 3 Adapter

on:
  push:
    branches:
      - main
      - feat/art-pr7-azurelib3-adapter
  pull_request:
    paths:
      - 'art/tooling/blockbench/asset-toolkit/**'
      - 'art/golden-samples/**'
      - '.github/workflows/factory-art-pr7-azurelib3-adapter.yml'

permissions:
  contents: read

jobs:
  azurelib3-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PR7 AzureLib 3 adapter presence contract
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.azurelib3_presence.test.js
      - name: PR7 AzureLib 3 core provider contract
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.azurelib3_adapter.test.js
      - name: PR7 AzureLib 3 geometry runtime contract
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.azurelib3_geo.test.js
      - name: PR7 AzureLib 3 Blockbench provider contract
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.azurelib3_blockbench_adapter.test.js
      - name: PR7 AzureLib 3 public API and standalone surface
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.azurelib3_public_api.test.js
      - name: PR7 AzureLib 3 Golden reference regression
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.azurelib3_golden_reference.test.js
      - name: Existing Golden Samples evidence gates
        run: |
          node art/golden-samples/validate_reference_evidence.js
          node art/golden-samples/validate_golden_samples.js
      - name: Existing GeckoLib shared-surface and generic animation regressions
        working-directory: art/tooling/blockbench/asset-toolkit
        run: |
          node --test \
            asset_toolkit.geckolib4_adapter.test.js \
            asset_toolkit.geckolib4_blockbench_adapter.test.js \
            asset_toolkit.geckolib4_public_api.test.js \
            asset_toolkit.geckolib4_golden_reference.test.js \
            asset_toolkit.animation_core.test.js \
            asset_toolkit.animation_adapter.test.js
      - name: Standalone bundle reproducibility
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --check
      - name: Whitespace
        run: git diff --check HEAD^ -- art/tooling/blockbench/asset-toolkit art/golden-samples .github/workflows/factory-art-pr7-azurelib3-adapter.yml
