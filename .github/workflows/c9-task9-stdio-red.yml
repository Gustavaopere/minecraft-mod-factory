name: C9 Task 9 Stdio RED

on:
  push:
    branches:
      - feat/construction-c9-agent-mcp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task9-stdio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install hashed Construction environment
        run: |
          python3 -m pip install --require-hashes --no-deps -r construction/upstream/harness/schematica-test-lock.txt
          python3 -m pip install --require-hashes --no-deps -r construction/upstream/harness/c9-mcp-lock.txt
          python3 -m pip check
          python3 -c 'from importlib.metadata import version; assert version("mcp") == "2.2.0"'
      - name: Run C9 Task 9 stdio contract
        run: python3 -m unittest construction/tests/test_c9_mcp_stdio.py -v
