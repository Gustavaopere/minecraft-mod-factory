name: PR9 Bundle Materialize

on:
  push:
    branches:
      - feat/art-pr9-easy-model-entities

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/art-pr9-easy-model-entities
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate deterministic bundle
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --write
      - name: Commit generated bundle if changed
        run: |
          if git diff --quiet -- art/tooling/blockbench/asset-toolkit/asset_toolkit.js; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/tooling/blockbench/asset-toolkit/asset_toolkit.js
          git commit -m 'build(art): regenerate PR9 standalone bundle'
          git push origin HEAD:feat/art-pr9-easy-model-entities
