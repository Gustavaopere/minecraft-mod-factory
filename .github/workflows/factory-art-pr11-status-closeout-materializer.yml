name: Factory Art PR11 Status Closeout Reconciler

on:
  push:
    branches:
      - docs/art-pr11-closeout-status
    paths:
      - .github/workflows/factory-art-pr11-status-closeout-materializer.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/art-pr11-closeout-status
          fetch-depth: 2
      - name: Reconcile post-PR60 STATUS fields
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('STATUS.md')
          text = path.read_text()

          replacements = {
              'CURRENT_MAIN_BEFORE_STATUS_UPDATE=a4d9a715f8e9213d458df625336c1ef8a096fbf9':
                  'CURRENT_MAIN_BEFORE_STATUS_UPDATE=aa4904d186f482a80358df56a3b426be24bfa215',
              'HEAD_AT_LAST_GREEN_VERIFICATION=a4d9a715f8e9213d458df625336c1ef8a096fbf9':
                  'HEAD_AT_LAST_GREEN_VERIFICATION=aa4904d186f482a80358df56a3b426be24bfa215',
              'OPEN_PRS_AT_STATUS_WRITE=PR59_MERGED; PR60_CONSTRUCTION_C7_OPEN_NON_OVERLAPPING; PR11_STATUS_CLOSEOUT_PR_PENDING':
                  'OPEN_PRS_AT_STATUS_WRITE=PR59_MERGED; PR60_MERGED; PR11_STATUS_CLOSEOUT_PR_PENDING; NO_OTHER_OPEN_PRS',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old}')
              text = text.replace(old, new, 1)

          required = [
              'FACTORY_GLOBAL_SONAR_AT_CURRENT_MAIN=ANALYSIS_FAILED; CHECK=103416946036; CONCLUSION=CANCELLED; DO_NOT_LABEL_FACTORY_GLOBALLY_GREEN',
              'PR11_POSTMERGE_ACTIONS=24_OF_24_WORKFLOWS_SUCCESS',
              'I6_REAL_HANDOFF=NOT_COMPLETE',
              'I7_STATE=BLOCKED_BY_F4_REAL_I6_HANDOFF',
              'NEXT_ACTION=BEGIN_PR12_PLAYER_PROFILES_AUDIT;',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'Missing required marker: {marker}')

          path.write_text(text)
          PY
          git diff --check -- STATUS.md
          git diff -- STATUS.md
      - name: Commit reconciled STATUS
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATUS.md
          git commit -m 'docs(art): reconcile PR11 closeout after PR60'
          git push origin HEAD:docs/art-pr11-closeout-status
