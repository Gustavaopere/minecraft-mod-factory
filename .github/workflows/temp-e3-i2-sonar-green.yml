name: TEMP E3 I2 Sonar Green

on:
  push:
    branches:
      - feat/f3-e3-i2-i3-migration
    paths:
      - '.github/workflows/temp-e3-i2-sonar-green.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/f3-e3-i2-i3-migration
          fetch-depth: 2

      - name: Apply inline constructed-path validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engineering/tooling/import-physical-modlist.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if emit_providers:\n        provider_path = _workspace_path(\n            output_path.with_name(f"{output_path.stem}.providers.json"),\n            label="provider catalog output",\n            must_exist=False,\n        )\n        provider_catalog = build_persisted_provider_catalog(snapshot)\n        provider_path.write_bytes(_json_bytes(provider_catalog))\n'''
          new = '''    if emit_providers:\n        workspace = Path.cwd().resolve()\n        provider_path = output_path.with_name(f"{output_path.stem}.providers.json").resolve(strict=False)\n        if provider_path == workspace or not provider_path.is_relative_to(workspace):\n            raise ValueError(f"provider catalog output must stay inside workspace: {workspace}")\n        provider_catalog = build_persisted_provider_catalog(snapshot)\n        provider_path.write_bytes(_json_bytes(provider_catalog))\n'''
          if old not in text:
              raise SystemExit('expected provider path block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run I2 tests
        run: >-
          python3 -m unittest
          engineering/tests/test_i2_modlist_catalog.py
          engineering/tests/test_i2_security_review.py

      - name: Check whitespace
        run: git diff --check

      - name: Commit production GREEN only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engineering/tooling/import-physical-modlist.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(engineering): validate constructed provider path inline"
          git push origin HEAD:feat/f3-e3-i2-i3-migration
