name: Factory Construction C2 Canonical Build IR

on:
  push:
    branches:
      - main
      - feat/construction-c2-canonical-build-ir
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/factory-construction-c2-build-ir.yml'
      - 'construction/**'

permissions:
  contents: read

jobs:
  c2-build-ir:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with upstream references
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          submodules: recursive
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run C2 Build IR contract tests
        run: python3 -m unittest construction/tests/test_c2_build_ir.py -v
      - name: Run C0 regression
        run: |
          python3 -m unittest construction/tests/test_c0_foundation.py -v
          python3 construction/scripts/validate_c0.py
      - name: Check C2 whitespace
        run: git diff --check HEAD^ -- .github/workflows/factory-construction-c2-build-ir.yml construction/core/build_ir.py construction/schemas/build-ir.schema.json construction/tests/test_c2_build_ir.py construction/docs/ARCHITECTURE.md construction/README.md construction/STATUS.md
