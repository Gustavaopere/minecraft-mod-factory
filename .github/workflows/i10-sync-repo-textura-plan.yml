name: I10 Sync Canonical Repo Textura Plan

on:
  push:
    branches:
      - engineering/i10-multiblock-foundation-reference
    paths:
      - '.github/workflows/i10-sync-repo-textura-plan.yml'

permissions:
  contents: write

jobs:
  sync-plan:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: engineering/i10-multiblock-foundation-reference
          fetch-depth: 2

      - name: Apply approved NeoForge policy patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('plans/PLANO-MESTRE-UNIFICADO-MINECRAFT-MOD-FACTORY-REPO-TEXTURA-BLOCKBENCH-ASSET-MCP-V5.1.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '**Alvo do modpack:** Minecraft 1.21.1 / NeoForge 1.21.1 / Java 21  ',
                  '**Alvo do modpack:** Minecraft 1.21.1 / NeoForge 21.1.x mais recente compatível / Java 21  ',
                  2,
              ),
              (
                  'Só iniciar após prova técnica para o target exato NeoForge 1.21.1.',
                  'Só iniciar após prova técnica para Minecraft `1.21.1` usando a versão NeoForge `21.1.x` estável mais recente resolvida para o ciclo.',
                  1,
              ),
              (
                  '- “apareceu no catálogo” ≠ “serve para NeoForge 1.21.1”;',
                  '- “apareceu no catálogo” ≠ “serve para a versão NeoForge `21.1.x` resolvida para Minecraft `1.21.1`”;',
                  1,
              ),
              (
                  '- confirmar que a versão exata NeoForge 1.21.1 usada pelo projeto possui o runtime/API correspondente;',
                  '- confirmar que a versão exata NeoForge `21.1.x` resolvida para Minecraft `1.21.1` possui o runtime/API correspondente;',
                  1,
              ),
              (
                  '| Multi-Layer | 1.0 | `AUDIT_REQUIRED_LEGACY_FORGE` | Exporta formato multi-layer Forge; não assumir equivalência NeoForge 1.21.1 |',
                  '| Multi-Layer | 1.0 | `AUDIT_REQUIRED_LEGACY_FORGE` | Exporta formato multi-layer Forge; não assumir equivalência com a versão NeoForge `21.1.x` resolvida para Minecraft `1.21.1` |',
                  1,
              ),
          ]

          for old, new, expected_count in replacements:
              actual = text.count(old)
              if actual != expected_count:
                  raise SystemExit(f'fail-closed replacement count mismatch: {old!r}: expected={expected_count} actual={actual}')
              text = text.replace(old, new)

          objective = '**Objetivo ampliado de produção:** o Repo Textura deve conseguir produzir o **pacote artístico completo** necessário para mods simples ou extremamente complexos — inclusive máquinas animadas, multiblocos, redes visuais, equipamentos, drones, lasers, portas, estruturas, UI visual, VFX e famílias inteiras de assets no nível de apresentação de grandes tech mods — sem assumir a lógica funcional do mod.'
          decision = '## DECISÃO ARQUITETURAL CANÔNICA — V5.1'
          anchor = objective + '\n\n' + decision
          if text.count(anchor) != 1:
              raise SystemExit(f'fail-closed policy anchor mismatch: count={text.count(anchor)}')

          policy = '''## POLÍTICA CANÔNICA DE VERSÃO DO NEOFORGE

O domínio Repo Textura acompanha o mesmo target de loader do domínio Mod Engineering:

- Minecraft permanece fixo em `1.21.1`;
- Java permanece fixo em `21`;
- NeoForge deve ser **a versão estável mais recente da linha `21.1.x` compatível com Minecraft `1.21.1`**, resolvida no início de cada ciclo relevante;
- nenhum número de build NeoForge é permanente neste plano;
- uma versão exata pode ser registrada em fingerprint, STATUS, manifest ou evidência de QA apenas para reproduzir o ciclo em que foi validada;
- se uma versão estável mais nova surgir antes do próximo ciclo relevante, resolver novamente o target e revalidar qualquer API, exporter, provider profile, runtime handoff ou Golden Sample sensível à versão;
- o snapshot físico/modlist registra o que está instalado naquele momento, mas não congela versões futuras;
- nunca interpretar a expressão “NeoForge para Minecraft 1.21.1” como uma build fixa do loader.'''

          text = text.replace(anchor, objective + '\n\n\n' + policy + '\n\n\n' + decision, 1)
          payload = text.encode('utf-8')
          digest = hashlib.sha256(payload).hexdigest()
          expected = 'a612670d114b7deb3c2e0bf2fbd6c00ca43d1f52819d7866a1f898ef8f7a96eb'
          if digest != expected:
              raise SystemExit(f'fail-closed corrected-plan SHA mismatch: expected={expected} actual={digest}')
          path.write_bytes(payload)
          print(f'corrected Repo Textura plan SHA256={digest}')
          PY

      - name: Commit canonical plan and remove temporary helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/i10-sync-repo-textura-plan.yml
          git add plans/PLANO-MESTRE-UNIFICADO-MINECRAFT-MOD-FACTORY-REPO-TEXTURA-BLOCKBENCH-ASSET-MCP-V5.1.md
          git diff --cached --check
          git commit -m 'docs(plans): make NeoForge target dynamic in Repo Textura authority'
          git push origin HEAD:engineering/i10-multiblock-foundation-reference
