name: PR7 Regenerate Bundle Transient

on:
  push:
    branches:
      - feat/art-pr7-azurelib-adapter

permissions:
  contents: write

jobs:
  regenerate-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/art-pr7-azurelib-adapter
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate deterministic bundle
        working-directory: art/tooling/blockbench/asset-toolkit
        run: |
          node build_toolkit_bundle.js --write
          node build_toolkit_bundle.js --check
      - name: Guard bundle-only diff
        id: guard
        run: |
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$changed" != "art/tooling/blockbench/asset-toolkit/asset_toolkit.js" ]; then
            printf 'Unexpected regenerated files:\n%s\n' "$changed" >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Commit regenerated bundle
        if: steps.guard.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/tooling/blockbench/asset-toolkit/asset_toolkit.js
          git commit -m 'build(art): regenerate PR7 bundle after provider facade dedup'
          git push origin HEAD:feat/art-pr7-azurelib-adapter
