name: Factory I10 Current-HEAD Physical 21.1.248 Proof
on:
  push:
    branches:
      - engineering/i10-multiblock-foundation-reference
    paths:
      - 'engineering/tests/test_i10_current_physical248.py'
      - 'engineering/tests/experiments/i10_current_physical248.py'
      - '.github/workflows/factory-engineering-i10-current-physical248.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'engineering/tests/test_i10_current_physical248.py'
      - 'engineering/tests/experiments/i10_current_physical248.py'
      - '.github/workflows/factory-engineering-i10-current-physical248.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-head-physical-248:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve exact PR branch source (never validate synthetic merge commit)
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            I10_SOURCE_SHA="$(git rev-parse 'HEAD^2')"
            git checkout --detach "$I10_SOURCE_SHA"
          else
            I10_SOURCE_SHA="$(git rev-parse HEAD)"
          fi
          test "$I10_SOURCE_SHA" = "$(git rev-parse HEAD)"
          printf 'I10_SOURCE_SHA=%s\n' "$I10_SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Test exact derivation and fail-closed guards
        run: python3 -m unittest engineering/tests/test_i10_current_physical248.py

      - name: Materialize HEAD and derive explicit physical profile
        run: |
          mkdir -p .factory-ci/i10/current248
          python3 engineering/tooling/multiblock-foundation/materialize_i10.py .factory-ci/i10/current248/source250
          printf '%s\n' "$I10_SOURCE_SHA" > .factory-ci/i10/current248/source250/I10-SOURCE-COMMIT.txt
          python3 engineering/tests/experiments/i10_current_physical248.py \
            --source .factory-ci/i10/current248/source250 \
            --output .factory-ci/i10/current248/derived248 \
            --archive .factory-ci/i10/current248/i10-current-head-physical248.zip \
            --source-sha "$I10_SOURCE_SHA"
          chmod +x .factory-ci/i10/current248/derived248/gradlew
          printf 'GRADLE_USER_HOME=%s/.factory-ci/i10/current248/gradle-home\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Build Java 21 and NeoForge 21.1.248
        run: |
          cd .factory-ci/i10/current248/derived248
          ./gradlew --no-daemon test build

      - name: Run NeoForge 21.1.248 GameTests
        run: |
          cd .factory-ci/i10/current248/derived248
          ./gradlew --no-daemon runGameTestServer

      - name: Run canonical I5 three suites on explicit physical target
        run: |
          mkdir -p .factory-ci/i10/current248/derived248/run/server
          printf 'eula=true\n' > .factory-ci/i10/current248/derived248/run/server/eula.txt
          python3 engineering/tooling/test-harness/run_test_harness.py \
            --project .factory-ci/i10/current248/derived248 \
            --target-neoforge 21.1.248

      - name: Run real four-chunk I10 dedicated-server acceptance
        run: >-
          python3 engineering/tooling/multiblock-foundation/run_i10_chunk_acceptance.py
          --project .factory-ci/i10/current248/derived248

      - name: Verify provenance, I5/I10 manifests, mandatory phase logs and evidence
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path('.factory-ci/i10/current248')
          project=root/'derived248'
          profile=json.loads((project/'I10-PROFILE-RECONCILIATION.json').read_text())
          i5_file=project/'build/i5-test-harness/test-manifest.json'
          i10_file=project/'build/i10-acceptance/summary.json'
          i5=json.loads(i5_file.read_text())
          i10=json.loads(i10_file.read_text())
          assert profile['source_commit']==os.environ['I10_SOURCE_SHA'],profile
          assert profile['target_neoforge']=='21.1.248' and profile['target_fml']=='4.0.43'
          assert profile['java_sources_preserved']==15
          assert profile['modified_paths']==['gradle.lockfile','gradle.properties','run-i10-manual-process.py']
          assert i5['target']=={'minecraft':'1.21.1','loader':'neoforge','neoforge':'21.1.248','java':21}
          assert i5['overall_state']=='PASS'
          assert {s['suite_id']:s['state'] for s in i5['suites']}=={
              'unit':'PASS','gametest':'PASS','dedicated_server':'PASS'}
          assert i10['state']=='PASS'
          assert [p['phase'] for p in i10['phases']]==[
              'unload_reload','restart_break','broken_restart','manual_baseline']
          for suite in i5['suites']:
              for relative in suite['evidence']:
                  item=project/relative
                  assert item.is_file(),relative
                  if relative.endswith(('.log','.xml')):
                      assert item.stat().st_size>0,relative
          for phase in ['phase1-unload-reload','phase2-restart-break',
                        'phase3-broken-restart','phase4-manual-baseline']:
              item=project/'build/i10-acceptance'/f'{phase}.log'
              assert item.is_file() and item.stat().st_size>0,phase
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          report={
              'source_commit':os.environ['I10_SOURCE_SHA'],
              'target':'Minecraft 1.21.1 / NeoForge 21.1.248 / Java 21',
              'handoff_zip_sha256':sha(root/'i10-current-head-physical248.zip'),
              'profile_manifest_sha256':sha(project/'I10-PROFILE-RECONCILIATION.json'),
              'i5_manifest_sha256':sha(i5_file),'i10_summary_sha256':sha(i10_file),
              'i5':'PASS','i10_four_chunk':'PASS',
              'physical_missing_neighbor':'UNPROVEN','two_real_clients':'PENDING',
              'full_modpack':'UNPROVEN','p2_review_threads':'OPEN','merge':'BLOCKED'
          }
          (root/'verified-evidence.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Retain source-pinned handoff and failure/success evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i10-current-head-physical248
          path: |
            .factory-ci/i10/current248/i10-current-head-physical248.zip
            .factory-ci/i10/current248/verified-evidence.json
            .factory-ci/i10/current248/derived248/I10-PROFILE-RECONCILIATION.json
            .factory-ci/i10/current248/derived248/build/i5-test-harness/
            .factory-ci/i10/current248/derived248/build/i10-acceptance/
            .factory-ci/i10/current248/derived248/build/test-results/
            .factory-ci/i10/current248/derived248/run/server/logs/latest.log
          if-no-files-found: warn
          retention-days: 7
