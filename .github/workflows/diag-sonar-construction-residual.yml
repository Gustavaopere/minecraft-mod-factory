name: Diagnostic Sonar Construction Residual

on:
  push:
    branches:
      - diag/sonar-construction-residual

permissions:
  contents: write

jobs:
  materialize-diagnostic-copies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact Factory-owned Construction Python copies
        run: |
          set -euo pipefail
          mkdir -p diagnostics/sonar/construction/scripts diagnostics/sonar/construction/tests
          cp construction/scripts/validate_c0.py diagnostics/sonar/construction/scripts/validate_c0.py
          cp construction/tests/test_c0_foundation.py diagnostics/sonar/construction/tests/test_c0_foundation.py
          cp construction/tests/test_c1_schematica_preservation.py diagnostics/sonar/construction/tests/test_c1_schematica_preservation.py
          rm .github/workflows/diag-sonar-construction-residual.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/sonar/construction .github/workflows/diag-sonar-construction-residual.yml
          git diff --cached --check
          git commit -m "chore(diag): expose Construction Python surface to Sonar"
          git push origin HEAD:diag/sonar-construction-residual
