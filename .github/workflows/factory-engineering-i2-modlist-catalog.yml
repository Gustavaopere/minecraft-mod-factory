name: Factory Engineering I2 Modlist Catalog

on:
  push:
    branches:
      - main
      - feat/f3-e3-i2-i3-migration
  pull_request:
    branches:
      - main
    paths:
      - 'engineering/tooling/import-physical-modlist.py'
      - 'engineering/tests/test_i2_modlist_catalog.py'
      - 'engineering/tests/test_i2_security_review.py'
      - 'engineering/tests/fixtures/modlist-i2-sample.txt'
      - '.github/workflows/factory-engineering-i2-modlist-catalog.yml'

permissions:
  contents: read

jobs:
  modlist-catalog-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run I2 contract tests
        run: >-
          python3 -m unittest
          engineering/tests/test_i2_modlist_catalog.py
          engineering/tests/test_i2_security_review.py

      - name: Import synthetic physical fixture
        run: >-
          python3 engineering/tooling/import-physical-modlist.py
          engineering/tests/fixtures/modlist-i2-sample.txt
          --captured-at 2026-09-09
          --output ".factory-ci/i2/snapshot.json"
          --providers-output ".factory-ci/i2/providers.json"
          --shard-size 2

      - name: Validate generated normalized snapshot and provider catalog
        run: >-
          python3 engineering/tooling/import-physical-modlist.py
          --check ".factory-ci/i2/snapshot.json"
          --providers ".factory-ci/i2/providers.json"

      - name: Check whitespace
        run: git diff --check HEAD^
