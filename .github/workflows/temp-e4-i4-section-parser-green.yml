name: TEMP E4 I4 Section Parser Green

on:
  push:
    branches:
      - feat/f4-e4-i4-validators-migration
    paths:
      - '.github/workflows/temp-e4-i4-section-parser-green.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/f4-e4-i4-validators-migration
          fetch-depth: 2

      - name: Apply alternation-free section parser
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engineering/tooling/validators/validate_mod_project.py')
          text = path.read_text(encoding='utf-8')
          old_constant = '''DEPENDENCY_BLOCK_RE = re.compile(\n    r"(?ms)^\\s*\\[\\[dependencies\\.[^\\]]+\\]\\]\\s*(.*?)(?=(?:^\\s*\\[\\[|\\Z))"\n)\n'''
          new_constant = '''SECTION_HEADER_RE = re.compile(r"(?m)^\\s*\\[\\[([^\\]]+)\\]\\]\\s*")\n'''
          old_function = '''def _metadata_dependencies(metadata_text: str) -> tuple[list[tuple[str, str]], list[str]]:\n    entries: list[tuple[str, str]] = []\n    errors: list[str] = []\n    for index, match in enumerate(DEPENDENCY_BLOCK_RE.finditer(metadata_text)):\n        body = match.group(1)\n        mod_match = re.search(r'(?m)^\\s*modId\\s*=\\s*"([^\"]+)"\\s*$', body)\n        type_match = re.search(r'(?m)^\\s*type\\s*=\\s*"([^\"]+)"\\s*$', body)\n        if mod_match is None:\n            errors.append(f"dependency block {index}: missing modId")\n            continue\n        dep_type = type_match.group(1) if type_match is not None else "required"\n        entries.append((mod_match.group(1), dep_type))\n    return entries, errors\n'''
          new_function = '''def _metadata_dependencies(metadata_text: str) -> tuple[list[tuple[str, str]], list[str]]:\n    entries: list[tuple[str, str]] = []\n    errors: list[str] = []\n    headers = list(SECTION_HEADER_RE.finditer(metadata_text))\n    dependency_index = 0\n    for header_index, match in enumerate(headers):\n        if not match.group(1).startswith("dependencies."):\n            continue\n        body_end = headers[header_index + 1].start() if header_index + 1 < len(headers) else len(metadata_text)\n        body = metadata_text[match.end():body_end]\n        mod_match = re.search(r'(?m)^\\s*modId\\s*=\\s*"([^\"]+)"\\s*$', body)\n        type_match = re.search(r'(?m)^\\s*type\\s*=\\s*"([^\"]+)"\\s*$', body)\n        if mod_match is None:\n            errors.append(f"dependency block {dependency_index}: missing modId")\n            dependency_index += 1\n            continue\n        dep_type = type_match.group(1) if type_match is not None else "required"\n        entries.append((mod_match.group(1), dep_type))\n        dependency_index += 1\n    return entries, errors\n'''
          if old_constant not in text:
              raise SystemExit('expected DEPENDENCY_BLOCK_RE block not found')
          if old_function not in text:
              raise SystemExit('expected _metadata_dependencies function not found')
          text = text.replace(old_constant, new_constant, 1)
          text = text.replace(old_function, new_function, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run I4 tests
        run: python3 -m unittest engineering/tests/test_i4_engineering_validators.py

      - name: Check whitespace
        run: git diff --check

      - name: Commit production GREEN only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engineering/tooling/validators/validate_mod_project.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(engineering): parse dependency sections without anchor alternation"
          git push origin HEAD:feat/f4-e4-i4-validators-migration
