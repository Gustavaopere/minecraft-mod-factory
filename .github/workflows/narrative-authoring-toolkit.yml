name: Narrative Authoring Toolkit

on:
  pull_request:
    paths:
      - 'narrative/**'
      - 'skills/README.md'
      - 'skills/ROUTER.md'
      - '.github/workflows/narrative-authoring-toolkit.yml'
  push:
    branches: [main]
    paths:
      - 'narrative/**'
      - 'skills/README.md'
      - 'skills/ROUTER.md'
      - '.github/workflows/narrative-authoring-toolkit.yml'

permissions:
  contents: read

jobs:
  narrative-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: python3 -m unittest discover -s narrative/tests -p 'test_*.py' -v
      - name: Example profile smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .factory-ci/narrative-smoke
          mkdir -p .factory-ci/narrative-smoke
          cat > .factory-ci/narrative-smoke/HIST-0001-example.md <<'EOF'
          # HIST-0001 — Example

          ## Editorial state
          DRAFT
          EOF
          python3 narrative/tooling/validate_story.py --profile narrative/profiles/example.json --root .factory-ci/narrative-smoke --strict-references
          python3 narrative/tooling/story_inventory.py --profile narrative/profiles/example.json --root .factory-ci/narrative-smoke --format json > .factory-ci/narrative-inventory.json
