name: Factory Art PR11 Bundle Sync

permissions:
  contents: write

on:
  push:
    branches:
      - feat/art-pr11-animated-java
    paths:
      - '.github/workflows/factory-art-pr11-bundle-sync.yml'

jobs:
  bundle-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/art-pr11-animated-java
          fetch-depth: 2
      - name: Provision Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate deterministic standalone bundle
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --write
      - name: Verify PR11 GREEN before commit
        working-directory: art/tooling/blockbench/asset-toolkit
        run: >-
          node --test
          asset_toolkit.animated_java_pr11.test.js
          asset_toolkit.provider_expansion.test.js
          asset_toolkit.geckolib4_adapter.test.js
          asset_toolkit.azurelib3_adapter.test.js
          asset_toolkit.neoforge_native_animation_adapter.test.js
          asset_toolkit.easy_model_entities_pr9.test.js
          asset_toolkit.emf_cem_pr10.test.js
      - name: Verify bundle reproducibility
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --check
      - name: Verify whitespace
        run: git diff --check
      - name: Commit generated bundle
        run: |
          if git diff --quiet -- art/tooling/blockbench/asset-toolkit/asset_toolkit.js; then
            echo 'Bundle already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/tooling/blockbench/asset-toolkit/asset_toolkit.js
          git commit -m 'build(art): regenerate PR11 standalone bundle [skip pr11-bundle-sync]'
          git push origin HEAD:feat/art-pr11-animated-java
