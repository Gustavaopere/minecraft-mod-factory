name: Factory Sonar CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  sonar-ci:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history without upstream gitlinks
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Node 20 for JavaScript coverage
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.2'

      - name: Generate fail-closed JavaScript coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .factory-ci/sonar
          node --test \
            --experimental-test-coverage \
            --test-reporter=spec \
            --test-reporter=lcov \
            --test-reporter-destination=stdout \
            --test-reporter-destination=.factory-ci/sonar/lcov.info \
            art/native-golden-samples/geckolib4-simple-mob/real_handoff_evidence.test.js
          test -s .factory-ci/sonar/lcov.info
          grep -F 'validate_real_handoff_evidence.js' .factory-ci/sonar/lcov.info >/dev/null

      - name: Set up Python 3.11 for Python coverage
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install hash-pinned Python coverage tool
        run: >-
          python3 -m pip install --require-hashes --no-deps
          -r .github/sonar/python-coverage-lock.txt

      - name: Generate fail-closed Python coverage
        shell: bash
        run: |
          set -euo pipefail
          coverage_started=0

          if [[ -f engineering/tooling/provider-catalog/validate_provider_catalog.py && -f engineering/tests/test_i7_provider_catalog.py ]]; then
            python3 -m coverage run \
              --branch \
              --source=engineering/tooling/provider-catalog \
              -m unittest engineering/tests/test_i7_provider_catalog.py
            coverage_started=1
          fi

          if [[ -f engineering/tooling/feature-generator/generate_feature.py && -f engineering/tests/test_i8_feature_generator.py && -f engineering/tests/test_i8_feature_generator_neoforge.py ]]; then
            if [[ "$coverage_started" -eq 0 ]]; then
              python3 -m coverage run \
                --branch \
                --source=engineering/tooling/feature-generator \
                -m unittest \
                engineering/tests/test_i8_feature_generator.py \
                engineering/tests/test_i8_feature_generator_neoforge.py
            else
              python3 -m coverage run \
                --append \
                --branch \
                --source=engineering/tooling/feature-generator \
                -m unittest \
                engineering/tests/test_i8_feature_generator.py \
                engineering/tests/test_i8_feature_generator_neoforge.py
            fi
            coverage_started=1
          fi

          if [[ -f engineering/tooling/machine-foundation/materialize_i9.py && -f engineering/tests/test_i9_machine_foundation.py && -f engineering/tests/test_i9_machine_foundation_composition.py ]]; then
            if [[ "$coverage_started" -eq 0 ]]; then
              python3 -m coverage run \
                --branch \
                --source=engineering/tooling/machine-foundation \
                -m unittest \
                engineering/tests/test_i9_machine_foundation.py \
                engineering/tests/test_i9_machine_foundation_composition.py
            else
              python3 -m coverage run \
                --append \
                --branch \
                --source=engineering/tooling/machine-foundation \
                -m unittest \
                engineering/tests/test_i9_machine_foundation.py \
                engineering/tests/test_i9_machine_foundation_composition.py
            fi
            coverage_started=1
          fi

          if compgen -G 'construction/tests/test_c10_*.py' >/dev/null && [[ -d construction/providers && -d construction/scripts ]]; then
            if [[ "$coverage_started" -eq 0 ]]; then
              python3 -m coverage run \
                --branch \
                --source=construction/providers,construction/scripts \
                -m unittest discover -s construction/tests -p 'test_c10_*.py' -v
            else
              python3 -m coverage run \
                --append \
                --branch \
                --source=construction/providers,construction/scripts \
                -m unittest discover -s construction/tests -p 'test_c10_*.py' -v
            fi
            coverage_started=1
          fi

          if [[ "$coverage_started" -eq 1 ]]; then
            python3 -m coverage xml -o coverage.xml
            test -s coverage.xml
          else
            echo 'No registered Python coverage targets are present on this revision.'
          fi

      - name: Verify Sonar credential
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "::error title=Missing SONAR_TOKEN::Repository secret SONAR_TOKEN is required for Factory Sonar CI."
            exit 1
          fi

      - name: Run SonarQube Cloud scan and wait for Quality Gate
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}