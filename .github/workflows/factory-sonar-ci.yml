name: Factory Sonar CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  sonar-ci:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history without upstream gitlinks
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Node 20 for JavaScript coverage
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.2'

      - name: Generate fail-closed JavaScript coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .factory-ci/sonar
          node --test \
            --experimental-test-coverage \
            --test-reporter=spec \
            --test-reporter=lcov \
            --test-reporter-destination=stdout \
            --test-reporter-destination=.factory-ci/sonar/lcov.info \
            art/native-golden-samples/geckolib4-simple-mob/real_handoff_evidence.test.js
          test -s .factory-ci/sonar/lcov.info
          grep -F 'validate_real_handoff_evidence.js' .factory-ci/sonar/lcov.info >/dev/null

      - name: Verify Sonar credential
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "::error title=Missing SONAR_TOKEN::Repository secret SONAR_TOKEN is required for Factory Sonar CI."
            exit 1
          fi

      - name: Run SonarQube Cloud scan and wait for Quality Gate
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
