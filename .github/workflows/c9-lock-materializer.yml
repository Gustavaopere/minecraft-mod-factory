name: C9 MCP Lock Materializer

on:
  push:
    branches:
      - feat/construction-c9-agent-mcp

permissions:
  contents: write

jobs:
  resolve-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/construction-c9-agent-mcp
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Resolve MCP additions against existing Construction pins
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .factory-ci/c9-lock/resolve
          RESOLVE="$GITHUB_WORKSPACE/.factory-ci/c9-lock/resolve/bin/python"
          "$RESOLVE" -m pip install --upgrade pip
          "$RESOLVE" -m pip install --require-hashes --no-deps -r construction/upstream/harness/schematica-test-lock.txt

          "$RESOLVE" - <<'PY'
          from pathlib import Path
          import re
          src = Path('construction/upstream/harness/schematica-test-lock.txt').read_text(encoding='utf-8').splitlines()
          out = []
          for raw in src:
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              requirement = line.split(' --hash=', 1)[0]
              out.append(requirement)
          Path('.factory-ci/c9-lock/base-constraints.txt').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

          "$RESOLVE" -m pip install \
            --constraint .factory-ci/c9-lock/base-constraints.txt \
            --report .factory-ci/c9-lock/mcp-report.json \
            'mcp==2.2.0'
          "$RESOLVE" -m pip check

          "$RESOLVE" - <<'PY'
          from pathlib import Path
          import importlib.metadata as md
          import json
          import re

          def norm(name: str) -> str:
              return re.sub(r'[-_.]+', '-', name).lower()

          base = {}
          for raw in Path('construction/upstream/harness/schematica-test-lock.txt').read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              req = line.split(' --hash=', 1)[0]
              name, version = req.split('==', 1)
              base[norm(name)] = version

          installed = {norm(dist.metadata['Name']): dist.version for dist in md.distributions() if dist.metadata.get('Name')}
          drift = {name: (version, installed.get(name)) for name, version in base.items() if installed.get(name) != version}
          if drift:
              raise SystemExit(f'existing Construction pins drifted: {drift}')
          if installed.get('mcp') != '2.2.0':
              raise SystemExit(f"resolved mcp version is {installed.get('mcp')!r}, expected 2.2.0")

          report = json.loads(Path('.factory-ci/c9-lock/mcp-report.json').read_text(encoding='utf-8'))
          rows = []
          seen = set()
          for item in report.get('install', []):
              meta = item.get('metadata', {})
              name = norm(meta.get('name', ''))
              version = meta.get('version')
              if not name or not version or name in base:
                  continue
              archive = item.get('download_info', {}).get('archive_info', {})
              hashes = archive.get('hashes', {})
              sha = hashes.get('sha256')
              if not sha:
                  legacy = archive.get('hash', '')
                  if legacy.startswith('sha256='):
                      sha = legacy.split('=', 1)[1]
              if not sha or not re.fullmatch(r'[0-9a-f]{64}', sha):
                  raise SystemExit(f'missing SHA-256 for {name}=={version}')
              if name in seen:
                  raise SystemExit(f'duplicate resolved package in pip report: {name}')
              seen.add(name)
              rows.append((name, version, sha))

          required = {name for name in installed if name not in base and name not in {'pip', 'setuptools'}}
          reported = {name for name, _, _ in rows}
          unexpected = sorted(required - reported)
          if unexpected:
              raise SystemExit(f'installed additions absent from pip report: {unexpected}')

          rows.sort()
          header = [
              '# Factory-owned hash-pinned additions lock for Construction C9 MCP.',
              '# Target: CPython 3.11 on ubuntu-24.04.',
              '# Resolved against construction/upstream/harness/schematica-test-lock.txt',
              '# with the existing Construction pins held as constraints.',
              '# Install after the base lock with --require-hashes --no-deps.',
          ]
          body = [f'{name}=={version} --hash=sha256:{sha}' for name, version, sha in rows]
          Path('construction/upstream/harness/c9-mcp-lock.txt').write_text('\n'.join(header + body) + '\n', encoding='utf-8')
          print(f'wrote {len(rows)} C9 MCP additions')
          for row in body:
              print(row)
          PY

      - name: Verify the two-lock environment from scratch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .factory-ci/c9-lock/verify
          VERIFY="$GITHUB_WORKSPACE/.factory-ci/c9-lock/verify/bin/python"
          "$VERIFY" -m pip install --upgrade pip
          "$VERIFY" -m pip install --require-hashes --no-deps -r construction/upstream/harness/schematica-test-lock.txt
          "$VERIFY" -m pip install --require-hashes --no-deps -r construction/upstream/harness/c9-mcp-lock.txt
          "$VERIFY" -m pip check
          "$VERIFY" - <<'PY'
          from importlib.metadata import version
          import mcp
          assert version('mcp') == '2.2.0'
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client
          from mcp.server import MCPServer
          print('mcp', version('mcp'), 'imports PASS')
          PY

      - name: Commit verified lock and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/c9-lock-materializer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add construction/upstream/harness/c9-mcp-lock.txt .github/workflows/c9-lock-materializer.yml
          git diff --cached --check
          git commit -m "build(construction): pin C9 MCP dependencies"
          git push origin HEAD:feat/construction-c9-agent-mcp
