name: Factory Art PR12 Status Closeout

on:
  push:
    branches:
      - docs/art-pr12-closeout-status
    paths:
      - .github/workflows/factory-art-pr12-status-closeout.yml

permissions:
  contents: write

jobs:
  materialize-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@v4
        with:
          ref: docs/art-pr12-closeout-status
          fetch-depth: 0
      - name: Apply fail-closed PR12 STATUS patch
        run: python .github/pr12-closeout-materialize.py
      - name: Verify STATUS-only working-tree delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "STATUS.md"
          grep -Fx 'I6_REAL_HANDOFF=NOT_COMPLETE' STATUS.md
          grep -Fx 'I7_STATE=BLOCKED_BY_F4_REAL_I6_HANDOFF' STATUS.md
          grep -F 'NEXT=PR13_EXTERNAL_DCC_BLENDER_EPIC_FIGHT_AUDIT' STATUS.md
          grep -Fx 'PR12_POSTMERGE_ACTIONS=26_OF_26_WORKFLOWS_SUCCESS; MERGE_COMMIT=d3deb0497c0f9f1577824d9b737157b450b16e38' STATUS.md
          grep -Fx 'PR12_POSTMERGE_SONAR=CHECK_103437143765; ANALYSIS_FAILED; CONCLUSION_CANCELLED; NOT_COUNTED_AS_PASS' STATUS.md
      - name: Commit STATUS closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATUS.md
          git commit -m 'docs(status): record PR12 closeout evidence'
          git push origin HEAD:docs/art-pr12-closeout-status
