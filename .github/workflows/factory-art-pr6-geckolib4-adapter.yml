name: Factory Art PR6 GeckoLib 4 Adapter

on:
  push:
    branches:
      - feat/art-pr6-geckolib4-adapter
  pull_request:
    paths:
      - 'art/tooling/blockbench/asset-toolkit/**'
      - '.github/workflows/factory-art-pr6-geckolib4-adapter.yml'

permissions:
  contents: write

jobs:
  geckolib4-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PR6 GeckoLib 4 provider contract
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.geckolib4_adapter.test.js
      - name: PR6 GeckoLib 4 Blockbench integration
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.geckolib4_blockbench_adapter.test.js
      - name: Regenerate standalone bundle on PR6 branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/art-pr6-geckolib4-adapter'
        run: |
          node art/tooling/blockbench/asset-toolkit/build_toolkit_bundle.js --write
          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != "art/tooling/blockbench/asset-toolkit/asset_toolkit.js" ]; then
            echo "Unexpected generated changes:"
            printf '%s\n' "$changed"
            exit 1
          fi
          if [ -n "$changed" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add art/tooling/blockbench/asset-toolkit/asset_toolkit.js
            git commit -m "build(art): regenerate PR6 standalone bundle"
            git push origin HEAD:feat/art-pr6-geckolib4-adapter
          fi
      - name: PR6 public API and standalone surface
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.geckolib4_public_api.test.js
      - name: Existing generic animation regressions
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.animation_core.test.js asset_toolkit.animation_adapter.test.js
      - name: Standalone bundle reproducibility
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --check
      - name: Whitespace
        run: git diff --check HEAD^ -- art/tooling/blockbench/asset-toolkit .github/workflows/factory-art-pr6-geckolib4-adapter.yml
