name: Factory Art PR6 GeckoLib 4 Adapter

on:
  push:
    branches:
      - feat/art-pr6-geckolib4-adapter
  pull_request:
    paths:
      - 'art/tooling/blockbench/asset-toolkit/**'
      - 'art/golden-samples/**'
      - '.github/workflows/factory-art-pr6-geckolib4-adapter.yml'

permissions:
  contents: write

jobs:
  geckolib4-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix absolute Blockbench source authority and regenerate standalone
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('art/tooling/blockbench/asset-toolkit/core/provider-adapter/geckolib4_adapter.js')
          text = path.read_text(encoding='utf-8')
          anchor = "function normalizedRelativePath(value, field) {\n"
          helper = """function normalizedSourceAuthorityPath(value) {
            const output = nonEmptyString(value, 'sourcePath').replace(/\\\\/g, '/').replace(/\\/$/, '');
            if (output.split('/').includes('..')) fail('INVALID_GECKOLIB4_SOURCE_PATH', 'sourcePath must not contain traversal segments.');
            return output;
          }

          """
          old_call = "  const sourcePath = normalizedRelativePath(input.sourcePath, 'sourcePath');\n"
          new_call = "  const sourcePath = normalizedSourceAuthorityPath(input.sourcePath);\n"
          if 'function normalizedSourceAuthorityPath(value)' not in text:
              if anchor not in text:
                  raise SystemExit('source path helper anchor not found')
              text = text.replace(anchor, helper + anchor, 1)
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif new_call not in text:
              raise SystemExit('source path call anchor not found')
          path.write_text(text, encoding='utf-8')
          PY
          node art/tooling/blockbench/asset-toolkit/build_toolkit_bundle.js
          git diff --check -- art/tooling/blockbench/asset-toolkit
          if git diff --quiet -- art/tooling/blockbench/asset-toolkit/core/provider-adapter/geckolib4_adapter.js art/tooling/blockbench/asset-toolkit/asset_toolkit.js; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add art/tooling/blockbench/asset-toolkit/core/provider-adapter/geckolib4_adapter.js art/tooling/blockbench/asset-toolkit/asset_toolkit.js
          git commit -m "fix(art): preserve absolute Blockbench bbmodel authority"
          git push origin HEAD:feat/art-pr6-geckolib4-adapter
      - name: PR6 GeckoLib 4 provider contract
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.geckolib4_adapter.test.js
      - name: PR6 GeckoLib 4 Blockbench integration
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.geckolib4_blockbench_adapter.test.js
      - name: PR6 public API and standalone surface
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.geckolib4_public_api.test.js
      - name: PR6 GeckoLib 4 Golden reference regression
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.geckolib4_golden_reference.test.js
      - name: Existing Golden Samples evidence gates
        run: |
          node art/golden-samples/validate_reference_evidence.js
          node art/golden-samples/validate_golden_samples.js
      - name: Existing generic animation regressions
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.animation_core.test.js asset_toolkit.animation_adapter.test.js
      - name: Standalone bundle reproducibility
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --check
      - name: Whitespace
        run: git diff --check HEAD^ -- art/tooling/blockbench/asset-toolkit art/golden-samples .github/workflows/factory-art-pr6-geckolib4-adapter.yml
