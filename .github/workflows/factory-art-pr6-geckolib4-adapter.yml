name: Factory Art PR6 GeckoLib 4 Adapter

on:
  push:
    branches:
      - feat/art-pr6-geckolib4-adapter
  pull_request:
    paths:
      - 'art/tooling/blockbench/asset-toolkit/**'
      - 'art/golden-samples/**'
      - '.github/workflows/factory-art-pr6-geckolib4-adapter.yml'

permissions:
  contents: write

jobs:
  geckolib4-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Admit PR6 GeckoLib reference fixtures to Golden allowlist
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('art/golden-samples/validate_reference_evidence.js')
          text = path.read_text(encoding='utf-8')
          anchor = "  'model-asset/validator-project-fixture.json',\n"
          additions = (
              "  'model-asset/provider-regression/geckolib4/REFERENCE-EVIDENCE.json',\n"
              "  'model-asset/provider-regression/geckolib4/factory-test.animation.json',\n"
              "  'model-asset/provider-regression/geckolib4/factory-test.geo.json',\n"
          )
          if additions not in text:
              if anchor not in text:
                  raise SystemExit('Golden allowlist anchor not found')
              path.write_text(text.replace(anchor, anchor + additions, 1), encoding='utf-8')
          PY
          if git diff --quiet -- art/golden-samples/validate_reference_evidence.js; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add art/golden-samples/validate_reference_evidence.js
          git commit -m "test(art): allowlist PR6 GeckoLib reference fixtures"
          git push origin HEAD:feat/art-pr6-geckolib4-adapter
      - name: PR6 GeckoLib 4 provider contract
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.geckolib4_adapter.test.js
      - name: PR6 GeckoLib 4 Blockbench integration
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.geckolib4_blockbench_adapter.test.js
      - name: PR6 public API and standalone surface
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.geckolib4_public_api.test.js
      - name: PR6 GeckoLib 4 Golden reference regression
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.geckolib4_golden_reference.test.js
      - name: Existing Golden Samples evidence gates
        run: |
          node art/golden-samples/validate_reference_evidence.js
          node art/golden-samples/validate_golden_samples.js
      - name: Existing generic animation regressions
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.animation_core.test.js asset_toolkit.animation_adapter.test.js
      - name: Standalone bundle reproducibility
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --check
      - name: Whitespace
        run: git diff --check HEAD^ -- art/tooling/blockbench/asset-toolkit art/golden-samples .github/workflows/factory-art-pr6-geckolib4-adapter.yml
