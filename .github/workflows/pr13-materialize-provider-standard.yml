name: PR13 Finalize Generated Surfaces

permissions:
  contents: write

on:
  push:
    branches:
      - feat/art-pr13-epicfight-blender-handoff
    paths:
      - '.github/workflows/pr13-materialize-provider-standard.yml'

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: feat/art-pr13-epicfight-blender-handoff
      - name: Provision Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tighten canonical PR13 provider standard
        shell: python
        run: |
          from pathlib import Path

          path = Path('art/standards/ASSET-PROVIDER-PROFILES.md')
          text = path.read_text()

          old_profile = "- `epicfight_blender_handoff` — Epic Fight `21.17.3.1` external-DCC handoff for custom combat animation. The physical provider is `epicfight`; no Blockbench extension is invented or required. Blockbench remains concept/reference/model authority only, while custom Epic Fight combat animation is Blender-authoritative. The handoff preserves both `.bbmodel` and `.blend` sources, requires the official Epic Fight Blender rig/exporter path, records exporter output as JSON, forbids direct Blockbench Epic Fight animation export, and forbids implicit cross-provider conversion."
          new_profile = old_profile + " It also requires caller-provided explicit Blockbench-reference-to-Blender-rig `boneMapping` plus non-empty `textureReferences`; the Factory validates and preserves those references but does not invent provider bone names, remap textures, or infer semantic equivalence."
          if new_profile not in text:
              if text.count(old_profile) != 1:
                  raise SystemExit('unexpected PR13 profile documentation state')
              text = text.replace(old_profile, new_profile)

          old_evidence = "The Factory preview adapter does not install Blender tooling and exposes no `exportEpicFightAnimation` operation."
          new_evidence = old_evidence + " The handoff manifest requires explicit caller-supplied naming/bone mapping and texture references, copies them into the immutable preview/contract result, and fails closed when either set is absent; these fields are references only and are not evidence that the named rig bones or textures were exercised in Blender or Minecraft."
          if new_evidence not in text:
              if text.count(old_evidence) != 1:
                  raise SystemExit('unexpected PR13 evidence documentation state')
              text = text.replace(old_evidence, new_evidence)

          path.write_text(text)
      - name: Regenerate deterministic standalone bundle
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --write
      - name: Remove transient finalizer
        run: rm .github/workflows/pr13-materialize-provider-standard.yml
      - name: Verify exact materialized paths
        shell: bash
        run: |
          set -euo pipefail
          node art/tooling/blockbench/asset-toolkit/build_toolkit_bundle.js --check
          git diff --check
          mapfile -t paths < <(git diff --name-only | sort)
          expected=(
            .github/workflows/pr13-materialize-provider-standard.yml
            art/standards/ASSET-PROVIDER-PROFILES.md
            art/tooling/blockbench/asset-toolkit/asset_toolkit.js
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${paths[@]}")
          grep -Fq '`boneMapping`' art/standards/ASSET-PROVIDER-PROFILES.md
          grep -Fq '`textureReferences`' art/standards/ASSET-PROVIDER-PROFILES.md
          grep -Fq 'does not invent provider bone names' art/standards/ASSET-PROVIDER-PROFILES.md
      - name: Commit final generated surfaces and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'minecraft-mod-factory-bot'
          git config user.email 'minecraft-mod-factory-bot@users.noreply.github.com'
          git add -A \
            .github/workflows/pr13-materialize-provider-standard.yml \
            art/standards/ASSET-PROVIDER-PROFILES.md \
            art/tooling/blockbench/asset-toolkit/asset_toolkit.js
          git commit -m 'build(art): finalize PR13 handoff surfaces'
          git push origin HEAD:feat/art-pr13-epicfight-blender-handoff
