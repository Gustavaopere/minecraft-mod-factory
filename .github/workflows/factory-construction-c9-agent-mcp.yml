name: Factory Construction C9 Agent MCP

on:
  push:
    branches:
      - main
      - feat/construction-c9-agent-mcp
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/factory-construction-c9-agent-mcp.yml'
      - 'engineering/tooling/import-physical-modlist.py'
      - 'engineering/tests/test_i2_modlist_catalog.py'
      - 'engineering/tests/test_i2_security_review.py'
      - 'engineering/tooling/scaffolder/**'
      - 'engineering/templates/neoforge-mod/**'
      - 'construction/STATUS.md'
      - 'construction/README.md'
      - 'construction/docs/ARCHITECTURE.md'
      - 'construction/core/build_ir.py'
      - 'construction/core/modpack_registry.py'
      - 'construction/core/modded_palette.py'
      - 'construction/core/sponge_v3.py'
      - 'construction/core/structural_qa.py'
      - 'construction/core/visual_qa.py'
      - 'construction/qa/**'
      - 'construction/mcp/**'
      - 'construction/runtime/neoforge-registry-probe/**'
      - 'construction/scripts/prepare_neoforge_registry_probe.py'
      - 'construction/schemas/**'
      - 'construction/fixtures/vanilla-golden/**'
      - 'construction/upstream/harness/c9-mcp-lock.txt'
      - 'construction/tests/test_c9_agent_mcp.py'
      - 'construction/tests/test_c9_mcp_stdio.py'
      - 'construction/tests/test_c8_visual_qa.py'
      - 'construction/tests/test_c8_palette_resolution_contract.py'
      - 'construction/tests/test_c7_architecture_qa.py'
      - 'construction/tests/test_c7_registry_authority.py'
      - 'construction/tests/test_c6_sponge_v3.py'
      - 'construction/tests/test_c5_modded_palette.py'
      - 'construction/tests/test_c4_modpack_registry.py'
      - 'construction/tests/test_c4_runtime_registry_probe.py'
      - 'construction/tests/test_c3_vanilla_golden.py'
      - 'construction/tests/test_c2_build_ir.py'
      - 'construction/tests/test_c0_foundation.py'
      - 'docs/superpowers/specs/2026-09-11-construction-c9-agent-mcp-design.md'
      - 'docs/superpowers/plans/2026-09-11-construction-c9-agent-mcp.md'

permissions:
  contents: read

jobs:
  c9-agent-mcp:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with preserved upstreams
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Install hashed Construction environment
        run: |
          python3 -m pip install --require-hashes --no-deps -r construction/upstream/harness/schematica-test-lock.txt
          python3 -m pip install --require-hashes --no-deps -r construction/upstream/harness/c9-mcp-lock.txt
          python3 -m pip check
          python3 -c 'from importlib.metadata import version; assert version("mcp") == "2.2.0"'

      - name: Run shared Engineering I2 regression
        run: >-
          python3 -m unittest
          engineering/tests/test_i2_modlist_catalog.py
          engineering/tests/test_i2_security_review.py
          -v

      - name: Run C9 agent MCP contract tests
        id: c9
        continue-on-error: true
        run: python3 -m unittest construction/tests/test_c9_agent_mcp.py -v

      - name: Record C9 contract result
        if: always()
        run: |
          if [ "${{ steps.c9.outcome }}" != "success" ]; then
            echo "C9_RESULT=FAIL" >> "$GITHUB_ENV"
          else
            echo "C9_RESULT=PASS" >> "$GITHUB_ENV"
          fi

      - name: Run C7 architecture QA regression
        if: always()
        run: >-
          python3 -m unittest
          construction/tests/test_c7_architecture_qa.py
          construction/tests/test_c7_registry_authority.py
          -v

      - name: Run C8 visual QA regression
        if: always()
        run: >-
          python3 -m unittest
          construction/tests/test_c8_visual_qa.py
          construction/tests/test_c8_palette_resolution_contract.py
          -v

      - name: Run C6 regression
        if: always()
        run: python3 -m unittest construction/tests/test_c6_sponge_v3.py -v

      - name: Run C5 regression
        if: always()
        run: python3 -m unittest construction/tests/test_c5_modded_palette.py -v

      - name: Run C4 regression
        if: always()
        run: >-
          python3 -m unittest
          construction/tests/test_c4_modpack_registry.py
          construction/tests/test_c4_runtime_registry_probe.py
          -v

      - name: Materialize C4 NeoForge runtime registry probe for C9 regression
        if: always()
        run: >-
          python3 construction/scripts/prepare_neoforge_registry_probe.py
          --output .factory-ci/c9/runtime-probe

      - name: Build C4 NeoForge runtime registry probe for C9 regression
        if: always()
        run: |
          chmod +x ".factory-ci/c9/runtime-probe/gradlew"
          cd ".factory-ci/c9/runtime-probe"
          GRADLE_USER_HOME="$GITHUB_WORKSPACE/.factory-ci/c9/gradle-home" ./gradlew test build --no-daemon

      - name: Run C3 regression
        if: always()
        run: python3 -m unittest construction/tests/test_c3_vanilla_golden.py -v

      - name: Run C2 regression
        if: always()
        run: python3 -m unittest construction/tests/test_c2_build_ir.py -v

      - name: Run C0 regression
        if: always()
        run: |
          python3 -m unittest construction/tests/test_c0_foundation.py -v
          python3 construction/scripts/validate_c0.py

      - name: Check C9 whitespace
        if: always()
        run: >-
          git diff --check HEAD^ --
          .github/workflows/factory-construction-c9-agent-mcp.yml
          construction/mcp
          construction/core/modpack_registry.py
          construction/core/structural_qa.py
          construction/tests/test_c9_agent_mcp.py
          construction/tests/test_c9_mcp_stdio.py
          construction/upstream/harness/c9-mcp-lock.txt
          docs/superpowers/specs/2026-09-11-construction-c9-agent-mcp-design.md
          docs/superpowers/plans/2026-09-11-construction-c9-agent-mcp.md
          construction/README.md
          construction/docs/ARCHITECTURE.md
          construction/STATUS.md

      - name: Enforce C9 contract result
        if: always()
        run: |
          test "${C9_RESULT:-FAIL}" = "PASS"
