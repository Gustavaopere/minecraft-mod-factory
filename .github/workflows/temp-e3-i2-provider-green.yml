name: TEMP E3 I2 Provider Green

on:
  push:
    branches:
      - feat/f3-e3-i2-i3-migration
    paths:
      - '.github/workflows/temp-e3-i2-provider-green.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/f3-e3-i2-i3-migration
          fetch-depth: 2

      - name: Apply deterministic provider catalog GREEN
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('engineering/tooling/import-physical-modlist.py')
          text = path.read_text(encoding='utf-8')

          old_writer = '''def write_provider_catalog(catalog, output_path):
              output_path = _workspace_path(output_path, label="provider catalog output", must_exist=False)
              output_path.parent.mkdir(parents=True, exist_ok=True)
              output_path.write_bytes(_json_bytes(catalog))
              return output_path


          '''.replace('          ', '')
          if old_writer not in text:
              raise SystemExit('expected write_provider_catalog block not found')
          text = text.replace(old_writer, '', 1)

          old_signature = 'def write_persisted_snapshot(snapshot, output_path, *, shard_size=100):\n'
          new_signature = 'def write_persisted_snapshot(snapshot, output_path, *, shard_size=100, emit_providers=False):\n'
          if old_signature not in text:
              raise SystemExit('expected write_persisted_snapshot signature not found')
          text = text.replace(old_signature, new_signature, 1)

          old_tail = '''    manifest = {**persisted, "entry_count": len(entries), "entry_shards": shards}
              output_path.write_bytes(_json_bytes(manifest))
              return manifest
          '''.replace('          ', '')
          new_tail = '''    manifest = {**persisted, "entry_count": len(entries), "entry_shards": shards}
              output_path.write_bytes(_json_bytes(manifest))
              if emit_providers:
                  provider_path = output_path.with_name(f"{output_path.stem}.providers.json")
                  provider_catalog = build_persisted_provider_catalog(snapshot)
                  provider_path.write_bytes(_json_bytes(provider_catalog))
              return manifest
          '''.replace('          ', '')
          if old_tail not in text:
              raise SystemExit('expected snapshot writer tail not found')
          text = text.replace(old_tail, new_tail, 1)

          old_arg = '    parser.add_argument("--providers-output")\n'
          new_arg = '    parser.add_argument("--emit-providers", action="store_true")\n'
          if old_arg not in text:
              raise SystemExit('expected --providers-output argument not found')
          text = text.replace(old_arg, new_arg, 1)

          old_main = '''    persisted_snapshot = build_persisted_snapshot(snapshot)
              write_persisted_snapshot(persisted_snapshot, args.output, shard_size=args.shard_size)
              if args.providers_output:
                  provider_catalog = build_persisted_provider_catalog(persisted_snapshot)
                  providers_output = write_provider_catalog(provider_catalog, args.providers_output)
                  print(f"Wrote {providers_output}")
              print(f"Wrote {args.output}")
          '''.replace('          ', '')
          new_main = '''    persisted_snapshot = build_persisted_snapshot(snapshot)
              write_persisted_snapshot(
                  persisted_snapshot,
                  args.output,
                  shard_size=args.shard_size,
                  emit_providers=args.emit_providers,
              )
              if args.emit_providers:
                  output_path = _workspace_path(args.output, label="snapshot output", must_exist=True)
                  print(f"Wrote {output_path.with_name(f'{output_path.stem}.providers.json')}")
              print(f"Wrote {args.output}")
          '''.replace('          ', '')
          if old_main not in text:
              raise SystemExit('expected import-mode provider output block not found')
          text = text.replace(old_main, new_main, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Run I2 tests
        run: >-
          python3 -m unittest
          engineering/tests/test_i2_modlist_catalog.py
          engineering/tests/test_i2_security_review.py

      - name: Check whitespace
        run: git diff --check

      - name: Commit production GREEN only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engineering/tooling/import-physical-modlist.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(engineering): derive provider catalog from snapshot output"
          git push origin HEAD:feat/f3-e3-i2-i3-migration
