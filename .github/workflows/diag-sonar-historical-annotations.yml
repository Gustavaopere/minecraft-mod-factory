name: Diagnostic Sonar Historical Annotations

on:
  push:
    branches:
      - diag/sonar-main-residual

permissions:
  contents: read
  checks: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Read historical Sonar annotations
        env:
          GH_DIAG_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = "Gustavaopere/minecraft-mod-factory"
          check_runs = {
              "PR2_I1_FAIL": 102733249496,
              "PR3_M4_FAIL": 102734644364,
          }
          token = os.environ["GH_DIAG_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "minecraft-mod-factory-sonar-diagnostic",
          }

          for label, check_id in check_runs.items():
              url = f"https://api.github.com/repos/{repo}/check-runs/{check_id}/annotations?per_page=100"
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.loads(response.read().decode("utf-8"))
              print(f"{label}_ANNOTATION_COUNT={len(data)}")
              for item in data:
                  print(label + "_ANNOTATION=" + json.dumps({
                      "path": item.get("path"),
                      "start_line": item.get("start_line"),
                      "end_line": item.get("end_line"),
                      "annotation_level": item.get("annotation_level"),
                      "title": item.get("title"),
                      "message": item.get("message"),
                  }, sort_keys=True))
          PY
