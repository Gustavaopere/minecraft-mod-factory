name: Diagnostic I10 Sonar Issue

on:
  push:
    branches:
      - engineering/i10-multiblock-foundation-reference
    paths:
      - '.github/workflows/diag-i10-sonar-issue.yml'

permissions:
  contents: read

jobs:
  inspect-sonar-issue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Query Sonar issue metadata
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "::error title=Missing SONAR_TOKEN::Repository secret SONAR_TOKEN is required."
            exit 1
          fi
          response="$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" 'https://sonarcloud.io/api/issues/search?componentKeys=Gustavaopere_minecraft-mod-factory&pullRequest=106&issueStatuses=OPEN,CONFIRMED&sinceLeakPeriod=true&ps=100')"
          SONAR_RESPONSE="$response" python3 - <<'PY'
          import json
          import os

          payload = json.loads(os.environ['SONAR_RESPONSE'])
          issues = payload.get('issues', [])
          print(f"SONAR_ISSUE_COUNT={len(issues)}")
          for issue in issues:
              selected = {
                  'key': issue.get('key'),
                  'rule': issue.get('rule'),
                  'severity': issue.get('severity'),
                  'type': issue.get('type'),
                  'component': issue.get('component'),
                  'line': issue.get('line'),
                  'message': issue.get('message'),
                  'impacts': issue.get('impacts'),
                  'status': issue.get('status'),
              }
              print('SONAR_ISSUE=' + json.dumps(selected, sort_keys=True))
          PY
