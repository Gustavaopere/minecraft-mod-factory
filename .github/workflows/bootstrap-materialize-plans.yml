name: Bootstrap Materialize Canonical Plans

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-materialize-plans.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Materialize and verify canonical plans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plans

          cat \
            bootstrap/plans/v1.1.part00.b64 \
            bootstrap/plans/v1.1.part01.b64 \
            bootstrap/plans/v1.1.part02.b64 \
            bootstrap/plans/v1.1.part03.b64 \
            bootstrap/plans/v1.1.part04.b64 \
            | base64 -d | gzip -dc \
            > plans/PLANO-MESTRE-MINECRAFT-MOD-FACTORY-MOD-ENGINEERING-NEOFORGE-1.21.1-V1.1.md

          cat \
            bootstrap/plans/v5.1.part00.b64 \
            bootstrap/plans/v5.1.part01.b64 \
            bootstrap/plans/v5.1.tail00.b64 \
            bootstrap/plans/v5.1.tail01.b64 \
            bootstrap/plans/v5.1.tail02.b64 \
            bootstrap/plans/v5.1.tail03.b64 \
            | base64 -d | gzip -dc \
            > plans/PLANO-MESTRE-UNIFICADO-MINECRAFT-MOD-FACTORY-REPO-TEXTURA-BLOCKBENCH-ASSET-MCP-V5.1.md

          printf '%s  %s\n' \
            '29fc7f4b949b2b8dba327eb3f022f4cd84b11a352430ca821bdaec13072b8744' \
            'plans/PLANO-MESTRE-MINECRAFT-MOD-FACTORY-MOD-ENGINEERING-NEOFORGE-1.21.1-V1.1.md' \
            | sha256sum -c -

          printf '%s  %s\n' \
            '723bb083d5b646812cd44a03a1ef50e8505b366923b64aba5931ee4b7b63befb' \
            'plans/PLANO-MESTRE-UNIFICADO-MINECRAFT-MOD-FACTORY-REPO-TEXTURA-BLOCKBENCH-ASSET-MCP-V5.1.md' \
            | sha256sum -c -

      - name: Commit canonical plans and remove bootstrap scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm -r bootstrap
          git rm .github/workflows/bootstrap-materialize-plans.yml
          git add plans/PLANO-MESTRE-MINECRAFT-MOD-FACTORY-MOD-ENGINEERING-NEOFORGE-1.21.1-V1.1.md
          git add plans/PLANO-MESTRE-UNIFICADO-MINECRAFT-MOD-FACTORY-REPO-TEXTURA-BLOCKBENCH-ASSET-MCP-V5.1.md
          git diff --cached --check

          python3 - <<'PY'
          import subprocess
          expected = sorted([
              '.github/workflows/bootstrap-materialize-plans.yml',
              'bootstrap/plans/v1.1.part00.b64',
              'bootstrap/plans/v1.1.part01.b64',
              'bootstrap/plans/v1.1.part02.b64',
              'bootstrap/plans/v1.1.part03.b64',
              'bootstrap/plans/v1.1.part04.b64',
              'bootstrap/plans/v5.1.part00.b64',
              'bootstrap/plans/v5.1.part01.b64',
              'bootstrap/plans/v5.1.tail00.b64',
              'bootstrap/plans/v5.1.tail01.b64',
              'bootstrap/plans/v5.1.tail02.b64',
              'bootstrap/plans/v5.1.tail03.b64',
              'plans/PLANO-MESTRE-MINECRAFT-MOD-FACTORY-MOD-ENGINEERING-NEOFORGE-1.21.1-V1.1.md',
              'plans/PLANO-MESTRE-UNIFICADO-MINECRAFT-MOD-FACTORY-REPO-TEXTURA-BLOCKBENCH-ASSET-MCP-V5.1.md',
          ])
          actual = sorted(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected staged paths: {actual!r}')
          PY

          git commit -m 'docs: materialize canonical Factory plans'
          git push origin HEAD:main
