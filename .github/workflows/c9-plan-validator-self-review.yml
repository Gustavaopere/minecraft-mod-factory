name: C9 Plan Validator Self Review

on:
  push:
    branches:
      - feat/construction-c9-agent-mcp

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/construction-c9-agent-mcp
          fetch-depth: 0
      - name: Replace generic C4 validator plan text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/superpowers/plans/2026-09-11-construction-c9-agent-mcp.md')
          text = path.read_text(encoding='utf-8')
          old = '''    # The implementation then performs every exact C4 linkage, block/state,\n    # canonical-order, and content_sha256 check enumerated below in this step.\n    return errors'''
          new = '''    if registry.get("schema_version") != 1:\n        errors.append("registry.schema_version must be 1")\n    if isinstance(physical, dict):\n        required_physical = {"captured_at", "source_name", "source_sha256", "loader_version", "top_level_mods", "nested_mods", "total_entries", "provider_count", "unidentified_entries"}\n        if set(physical) != required_physical:\n            errors.append("registry.physical fields do not match the C4 contract")\n    if isinstance(runtime, dict):\n        if set(runtime) != {"captured_at", "physical_snapshot_sha256", "target"}:\n            errors.append("registry.runtime fields do not match the C4 contract")\n        elif isinstance(physical, dict) and runtime.get("physical_snapshot_sha256") != physical.get("source_sha256"):\n            errors.append("registry.runtime must reference the exact physical snapshot SHA-256")\n    if isinstance(static_index, dict) and set(static_index) != {"jar_count", "nested_jar_count", "discovered_block_count"}:\n        errors.append("registry.static_index fields do not match the C4 contract")\n    if isinstance(blocks, list):\n        block_ids = [block.get("id") for block in blocks if isinstance(block, dict)]\n        if block_ids != sorted(block_ids):\n            errors.append("registry.blocks must be in canonical block-id order")\n        if len(block_ids) != len(set(block_ids)):\n            errors.append("registry.blocks contains duplicate block ids")\n    claimed = registry.get("content_sha256")\n    if isinstance(claimed, str):\n        payload = dict(registry)\n        payload.pop("content_sha256", None)\n        if hashlib.sha256(canonical_json_bytes(payload)).hexdigest() != claimed:\n            errors.append("registry.content_sha256 does not match canonical content")\n    return errors'''
          if old not in text:
              raise SystemExit('generic validator text not found')
          text = text.replace(old, new, 1)
          marker = '''Do not change `build_modpack_registry(...)` output shape or schema version.'''
          extra = '''Do not change `build_modpack_registry(...)` output shape or schema version. The production implementation must additionally validate every scalar type, SHA/resource-location format, non-negative counter, runtime target (`1.21.1`/`neoforge`), loader-version linkage, exact block record fields, availability/authority consistency, safety class, state-property string pairs, state uniqueness/canonical ordering, and the existing C4 canonical fingerprint rule; each requirement gets a named C4 unit test before GREEN.'''
          if marker not in text:
              raise SystemExit('validator detail marker not found')
          text = text.replace(marker, extra, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/c9-plan-validator-self-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-11-construction-c9-agent-mcp.md .github/workflows/c9-plan-validator-self-review.yml
          git commit -m "docs(construction): finalize C9 validator plan"
          git push origin HEAD:feat/construction-c9-agent-mcp
