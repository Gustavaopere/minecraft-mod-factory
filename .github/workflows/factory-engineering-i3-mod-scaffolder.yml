name: Factory Engineering I3 Mod Scaffolder

on:
  push:
    branches:
      - main
      - feat/f3-e3-i2-i3-migration
  pull_request:
    branches:
      - main
    paths:
      - 'engineering/templates/neoforge-mod/**'
      - 'engineering/tooling/scaffolder/**'
      - 'engineering/tests/test_i3_mod_scaffolder.py'
      - 'engineering/tests/fixtures/i3-*.json'
      - 'engineering/tests/golden/i3-golden-mod/**'
      - '.github/workflows/factory-engineering-i3-mod-scaffolder.yml'

permissions:
  contents: read

jobs:
  scaffolder-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.14'

      - name: Run I3 scaffolder contract tests
        run: python3 -m unittest engineering/tests/test_i3_mod_scaffolder.py

      - name: Materialize explicit wrapper authority
        run: |
          mkdir -p "$RUNNER_TEMP/i3-wrapper-authority"
          cd "$RUNNER_TEMP/i3-wrapper-authority"
          printf "rootProject.name = 'i3-wrapper-authority'\n" > settings.gradle
          gradle wrapper --gradle-version 8.14 --distribution-type bin --no-daemon

      - name: Generate project from canonical fixtures
        run: >-
          python3 engineering/tooling/scaffolder/scaffold_mod.py
          --mod-spec engineering/tests/fixtures/i3-golden-mod-spec.json
          --config engineering/tests/fixtures/i3-golden-scaffold-config.json
          --wrapper-source "$RUNNER_TEMP/i3-wrapper-authority"
          --output "$RUNNER_TEMP/i3-generated"

      - name: Build generated NeoForge project with copied wrapper
        run: |
          chmod +x "$RUNNER_TEMP/i3-generated/gradlew"
          cd "$RUNNER_TEMP/i3-generated"
          GRADLE_USER_HOME="$RUNNER_TEMP/i3-gradle-home" ./gradlew test build --no-daemon

      - name: Check whitespace
        run: git diff --check HEAD^
