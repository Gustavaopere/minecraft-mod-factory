name: Factory I10 Exact Derived Physical 21.1.248 Validation

on:
  push:
    branches:
      - engineering/i10-multiblock-foundation-reference
    paths:
      - 'engineering/tests/experiments/i10_rebuild_derived_profile248.py'
      - '.github/workflows/factory-engineering-i10-derived-physical248-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-exact-derived-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GRADLE_USER_HOME: ${{ github.workspace }}/.factory-ci/i10/physical248-gradle-home
    steps:
      - name: Checkout Factory source without writing back
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Download exact immutable 21.1.250 handoff artifact for source commit 9403327a
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .factory-ci/i10/physical248-input
          gh run download 38641158897 \
            -R Gustavaopere/minecraft-mod-factory \
            -n i10-physical-acceptance \
            -D .factory-ci/i10/physical248-input
          test -f .factory-ci/i10/physical248-input/I10-SOURCE-COMMIT.txt
          grep -Fx 9403327ad50227251d8fb1f866077d16f1f3cd4b \
            .factory-ci/i10/physical248-input/I10-SOURCE-COMMIT.txt

      - name: Derive and verify byte-identical user 21.1.248 ZIP without mutating Java
        run: |
          python3 engineering/tests/experiments/i10_rebuild_derived_profile248.py \
            --source-dir .factory-ci/i10/physical248-input \
            --project-dir .factory-ci/i10/physical248-project \
            --output-zip .factory-ci/i10/i10-handoff-perfil-fisico-21.1.248-9403327a.zip
          printf '%s  %s\n' \
            b01a2f74218c5a14a502343145ec36380051221f2c482a2c6c29563636b7454a \
            .factory-ci/i10/i10-handoff-perfil-fisico-21.1.248-9403327a.zip | sha256sum -c -
          grep -Fx 'neo_version=21.1.248' .factory-ci/i10/physical248-project/gradle.properties
          grep '^net.neoforged:neoforge:21.1.248=' .factory-ci/i10/physical248-project/gradle.lockfile
          python3 .factory-ci/i10/physical248-project/run-i10-manual-process.py --help
          chmod +x .factory-ci/i10/physical248-project/gradlew

      - name: Unit tests and build for exact derived 21.1.248 project
        run: |
          cd .factory-ci/i10/physical248-project
          ./gradlew --no-daemon test build

      - name: Execute genuine NeoForge 21.1.248 GameTests
        run: |
          cd .factory-ci/i10/physical248-project
          ./gradlew --no-daemon runGameTestServer

      - name: Record I5 canonical target incompatibility without bypassing validator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('engineering/tooling/test-harness/run_test_harness.py').read_text()
          assert 'TARGET_NEOFORGE = "21.1.250"' in text
          assert 'neo_version=21.1.248' in Path(
            '.factory-ci/i10/physical248-project/gradle.properties').read_text()
          print('I5_DERIVED_248=BLOCKED_CANONICAL_I5_TARGET_21_1_250')
          print('Native Gradle test/build and GameTests already passed on the actual 21.1.248 project.')
          PY

      - name: Run genuine dedicated server full-four-chunk I10 acceptance
        run: |
          python3 engineering/tooling/multiblock-foundation/run_i10_chunk_acceptance.py \
            --project .factory-ci/i10/physical248-project

      - name: Record exact-source verdicts without declaring two-client or P2 acceptance
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('.factory-ci/i10/physical248-project')
          manifest=json.loads((p/'I10-PROFILE-RECONCILIATION.json').read_text())
          assert manifest['source_commit']=='9403327ad50227251d8fb1f866077d16f1f3cd4b'
          assert manifest['target_neoforge']=='21.1.248'
          assert manifest['source_code_and_assets_preserved'] is True
          root=Path('.factory-ci/i10')
          zip_path=root/'i10-handoff-perfil-fisico-21.1.248-9403327a.zip'
          sha=hashlib.sha256(zip_path.read_bytes()).hexdigest()
          assert sha=='b01a2f74218c5a14a502343145ec36380051221f2c482a2c6c29563636b7454a'
          evidence={
            'schema_version':1,
            'source_commit':manifest['source_commit'],
            'original_artifact_id':11930861353,
            'source_zip_sha256':manifest['source_archive_sha256'],
            'derived_zip_sha256':sha,
            'exact_zip_identical_to_user_supplied':True,
            'target':'Minecraft 1.21.1 / NeoForge 21.1.248 / Java 21',
            'profile_modifications':manifest['modified_paths'],
            'java_bytes_unchanged':True,
            'gradle_test_build':'PASS',
            'game_test_server':'PASS',
            'i5_harness':'BLOCKED_CANONICAL_TARGET_21_1_250',
            'i10_full_four_chunk':'PASS',
            'physical_missing_neighbor':'UNPROVEN',
            'two_real_clients':'PENDING',
            'p2_review_threads':'OPEN',
            'merge':'BLOCKED'
          }
          (root/'exact-derived-profile248-build-evidence.json').write_text(
            json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print(json.dumps(evidence,indent=2,sort_keys=True))
          PY

      - name: Preserve exact ZIP and all build/acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: i10-exact-derived-physical-248-validation
          path: |
            .factory-ci/i10/i10-handoff-perfil-fisico-21.1.248-9403327a.zip
            .factory-ci/i10/exact-derived-profile248-build-evidence.json
            .factory-ci/i10/physical248-project/build/i10-acceptance/
            .factory-ci/i10/physical248-project/build/test-results/
            .factory-ci/i10/physical248-project/build/reports/tests/
          if-no-files-found: error
          retention-days: 7
