name: Factory Sonar Unicode Ordering Materialize Once

on:
  push:
    branches:
      - fix/full-skill-sonar-hardening
    paths:
      - '.github/workflows/factory-sonar-unicode-order-materialize-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-verify-consume:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact hardening branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-skill-sonar-hardening
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Unicode request hashing regression
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.live_bridge.test.js

      - name: Regenerate standalone Toolkit bundle canonically
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --write

      - name: Verify deterministic bundle
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --check

      - name: Validate Toolkit Golden and skill repository
        run: python skills/scripts/validate_skill_repository.py

      - name: Install MCP sidecar without lifecycle scripts
        working-directory: art/tooling/blockbench/asset-toolkit/mcp-sidecar
        run: npm ci --ignore-scripts

      - name: Check MCP sidecar
        working-directory: art/tooling/blockbench/asset-toolkit/mcp-sidecar
        run: npm run check

      - name: Test MCP sidecar
        working-directory: art/tooling/blockbench/asset-toolkit/mcp-sidecar
        run: npm test

      - name: Persist verified generated delta and consume materializer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/factory-sonar-unicode-order-materialize-once.yml
          rm -rf art/tooling/blockbench/asset-toolkit/mcp-sidecar/node_modules
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check
          git add -A
          python - <<'PY'
          import subprocess
          expected = sorted([
              '.github/workflows/factory-sonar-unicode-order-materialize-once.yml',
              'art/tooling/blockbench/asset-toolkit/asset_toolkit.js',
          ])
          actual = sorted(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected staged paths: {actual!r}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(toolkit): regenerate Unicode-order hardened bundle'
          git push origin HEAD:fix/full-skill-sonar-hardening
