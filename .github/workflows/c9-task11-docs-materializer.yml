name: C9 Task 11 Docs Materializer

on:
  push:
    branches:
      - feat/construction-c9-agent-mcp

permissions:
  contents: write

jobs:
  materialize-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/construction-c9-agent-mcp
      - name: Document implemented C9 boundary
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          payload = base64.b64decode("")
          exec(compile(payload, "<c9-task11-docs>", "exec"))
          PY
          git diff --check
          git diff --exit-code -- construction/STATUS.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/c9-task11-docs-materializer.yml
          git add construction/README.md construction/docs/ARCHITECTURE.md
          git commit -m 'docs(construction): document C9 agent MCP boundary'
          git push origin HEAD:feat/construction-c9-agent-mcp
