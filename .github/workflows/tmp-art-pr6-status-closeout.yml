name: Temporary Art PR6 Status Closeout

on:
  push:
    branches:
      - docs/art-pr6-closeout-status

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Materialize PR6 closeout status
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('STATUS.md')
          text = path.read_text(encoding='utf-8')

          def replace_line(prefix, replacement):
              global text
              lines = text.splitlines()
              matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f'expected exactly one {prefix!r}, found {len(matches)}')
              lines[matches[0]] = replacement
              text = '\n'.join(lines) + '\n'

          replace_line('FACTORY_PHASE=', 'FACTORY_PHASE=ART_PR6_GECKOLIB_ADAPTER_MERGED_GREEN_POSTMERGE_VALIDATED_STATUS_CLOSEOUT')
          replace_line('CURRENT_BRANCH=', 'CURRENT_BRANCH=docs/art-pr6-closeout-status')
          replace_line('CURRENT_MAIN_BEFORE_STATUS_UPDATE=', 'CURRENT_MAIN_BEFORE_STATUS_UPDATE=d9cb5241a40611247933a2557b2811bf970453df')
          replace_line('HEAD_AT_LAST_GREEN_VERIFICATION=', 'HEAD_AT_LAST_GREEN_VERIFICATION=d9cb5241a40611247933a2557b2811bf970453df')
          replace_line('OPEN_PRS_AT_STATUS_WRITE=', 'OPEN_PRS_AT_STATUS_WRITE=PR37_MERGED; PR39_CONSTRUCTION_STATUS_CLOSEOUT_OPEN_NON_OVERLAPPING; PR6_STATUS_CLOSEOUT_PR_PENDING')
          replace_line('FULL_SKILL_CURRENT_MAIN=', 'FULL_SKILL_CURRENT_MAIN=d9cb5241a40611247933a2557b2811bf970453df')
          replace_line('FULL_SKILL_CURRENT_MAIN_RUN=', 'FULL_SKILL_CURRENT_MAIN_RUN=34552823993; FULL_SKILL_COVERAGE_PASS; M5_PASS; M6_PASS; MIGRATED_REGRESSIONS_PASS')
          replace_line('FACTORY_CURRENT_GOVERNANCE_RUN=', 'FACTORY_CURRENT_GOVERNANCE_RUN=34552823941; PASS')
          replace_line('ART_FRONTIER=', 'ART_FRONTIER=M0B bootstrap complete -> M1 audit complete -> M2 inventory complete -> M3 migration matrix frozen -> M4 standards/style/templates merged GREEN -> full IMPLEMENTAR SKILL migration merged and revalidated -> M5/M6/PR4 texture acceptance GREEN -> PR5 Generic Animation Core merged GREEN and post-merge validated -> PR6 GeckoLib adapter merged GREEN and post-merge validated with REFERENCE_ONLY Golden -> PR7 AzureLib adapter audit next')
          replace_line('FACTORY_GLOBAL_SONAR_AT_CURRENT_MAIN=', 'FACTORY_GLOBAL_SONAR_AT_CURRENT_MAIN=ANALYSIS_FAILED; CHECK=103119651060; CONCLUSION=CANCELLED; DO_NOT_LABEL_FACTORY_GLOBALLY_GREEN; PR37_SONAR_PASS_IS_PR_SCOPED_ONLY')
          replace_line('FACTORY_GLOBAL_SONAR_BLOCKER=', 'FACTORY_GLOBAL_SONAR_BLOCKER=MAIN_BRANCH_ANALYSIS_FAILED_ON_CURRENT_MAIN; PR37_NEW_CODE_QUALITY_GATE_PASS_DOES_NOT_CLEAR_GLOBAL_STATE')
          replace_line('USER_STOP_BOUNDARY=', 'USER_STOP_BOUNDARY=HISTORICAL_BOUNDARY_CLEARED_BY_USER_PROSSIGA; PR6_EXECUTION_COMPLETED_AFTER_BOUNDARY')
          replace_line('NEXT_ACTION=', 'NEXT_ACTION=BEGIN_PR7_AZURELIB_ADAPTER_AUDIT_AGAINST_PHYSICAL_AZURELIB_3.1.11; DO_NOT_AUTO_CONVERT_GECKOLIB; DO_NOT_CLAIM_REAL_HANDOFF; F4/I6_REMAINS_NOT_COMPLETE; I7_REMAINS_BLOCKED')

          marker = 'PR6_PHYSICAL_PROVIDER_TARGET=GECKOLIB_4.9.2; JAR=geckolib-neoforge-1.21.1-4.9.2.jar'
          if 'PR6_GECKOLIB_PR=37' not in text:
              block = '\n'.join([
                  marker,
                  'PR6_GECKOLIB_PR=37',
                  'PR6_GECKOLIB_FINAL_HEAD=c08b2cd28f2c280e95365523413d73452c73bf4f',
                  'PR6_GECKOLIB_MERGE_COMMIT=d9cb5241a40611247933a2557b2811bf970453df',
                  'PR6_GECKOLIB_GOLDEN_RED_RUN=34550818414; CORE_8_OF_8_PASS; BLOCKBENCH_6_OF_6_PASS; PUBLIC_API_3_OF_3_PASS; GOLDEN_0_OF_3_EXPECTED_ENOENT',
                  'PR6_GECKOLIB_GOLDEN_GREEN_RUN=34551217910; SUCCESS',
                  'PR6_GECKOLIB_SOURCE_PATH_RED_RUN=34551343767; CORE_8_OF_8_PASS; BLOCKBENCH_6_PASS_1_EXPECTED_FAIL; INVALID_GECKOLIB4_PATH_ON_ABSOLUTE_SOURCE',
                  'PR6_GECKOLIB_REVIEW_RED_RUN=34551881012; 2_EXPECTED_FAIL; WINDOWS_DRIVE_ABSOLUTE_OUTPUT; MUTABLE_VALIDATED_PREVIEW_DOCUMENT',
                  'PR6_GECKOLIB_REVIEW_GREEN_RUN=34552261961; SUCCESS',
                  'PR6_GECKOLIB_REVIEW_FINDINGS=ABSOLUTE_SOURCE_PATH; WINDOWS_DRIVE_ABSOLUTE_OUTPUT; PREVIEW_DOCUMENT_IMMUTABILITY; MAIN_TRIGGER; ALL_FIXED_WITH_REGRESSION_EVIDENCE',
                  'PR6_GECKOLIB_PREMERGE_PR6_RUN=34552464478; SUCCESS',
                  'PR6_GECKOLIB_PREMERGE_GOVERNANCE_RUN=34552464442; SUCCESS',
                  'PR6_GECKOLIB_PREMERGE_FULL_SKILL_RUN=34552464446; SUCCESS',
                  'PR6_GECKOLIB_PREMERGE_PR5_REGRESSION_RUN=34552464418; SUCCESS',
                  'PR6_GECKOLIB_PREMERGE_SONAR=CHECK_103118310385; QUALITY_GATE_PASS; 0_NEW_ISSUES; 0_ACCEPTED_ISSUES; 0_SECURITY_HOTSPOTS; 0.0_PERCENT_DUPLICATION_ON_NEW_CODE',
                  'PR6_GECKOLIB_POSTMERGE_PR6_RUN=34552823940; SUCCESS',
                  'PR6_GECKOLIB_POSTMERGE_GOVERNANCE_RUN=34552823941; SUCCESS',
                  'PR6_GECKOLIB_POSTMERGE_FULL_SKILL_RUN=34552823993; SUCCESS',
                  'PR6_GECKOLIB_POSTMERGE_PR5_REGRESSION_RUN=34552823956; SUCCESS',
                  'PR6_GECKOLIB_POSTMERGE_SONAR=CHECK_103119651060; ANALYSIS_FAILED; CONCLUSION_CANCELLED; NOT_COUNTED_AS_PASS',
                  'PR6_GECKOLIB_GOLDEN_EVIDENCE=REFERENCE_ONLY; runtimeEvidence=UNPROVEN; runtimeValidated=false; f4I6Evidence=false',
                  'PR6_GECKOLIB_PROVIDER_BOUNDARY=GECKOLIB_4_9_2_RUNTIME; BLOCKBENCH_GECKOLIB_4_2_5_AUDITED; NO_GECKOLIB_5_TRANSPLANT; NO_AZURELIB_AUTOCONVERSION; ANIMATION_TIMELINE_NOT_GAMEPLAY_AUTHORITY',
                  'PR6_STATE=MERGED_GREEN_POSTMERGE_VALIDATED_REFERENCE_ONLY_RUNTIME_UNPROVEN',
                  'PR7_PHYSICAL_PROVIDER_TARGET=AZURELIB_3.1.11; JAR=azurelib-neo-1.21.1-3.1.11.jar',
              ])
              if marker not in text:
                  raise SystemExit('PR6 physical target marker not found')
              text = text.replace(marker, block, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check -- STATUS.md
          if git diff --quiet -- STATUS.md; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add STATUS.md
          git commit -m "docs(status): close PR6 GeckoLib adapter"
          git push origin HEAD:docs/art-pr6-closeout-status
