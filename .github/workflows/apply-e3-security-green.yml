name: Apply E3 Security Green

on:
  push:
    branches:
      - feat/f3-e3-i2-i3-migration

permissions:
  contents: write

jobs:
  apply-green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/f3-e3-i2-i3-migration
          fetch-depth: 0

      - name: Apply reviewed security changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {text.count(old)}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          importer = Path('engineering/tooling/import-physical-modlist.py')
          text = importer.read_text(encoding='utf-8')
          marker = 'MODS_COUNT_RE = re.compile(r"^Mods count:\\s*(\\d+)\\s*$")\n\n\n'
          helper = '''MODS_COUNT_RE = re.compile(r"^Mods count:\\s*(\\d+)\\s*$")\n\n\ndef _workspace_path(value, *, label, must_exist=False):\n    workspace = Path.cwd().resolve()\n    raw = Path(value)\n    candidate = raw.resolve(strict=must_exist) if raw.is_absolute() else (workspace / raw).resolve(strict=must_exist)\n    try:\n        candidate.relative_to(workspace)\n    except ValueError as exc:\n        raise ValueError(f"{label} must stay inside workspace: {workspace}") from exc\n    if candidate == workspace:\n        raise ValueError(f"{label} must identify a path inside workspace, not the workspace root")\n    return candidate\n\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('importer: workspace helper insertion marker mismatch')
          text = text.replace(marker, helper)
          old = '        if isinstance(entry.get("mod_id"), str) and entry["mod_id"] and MOD_ID_RE.fullmatch(entry["mod_id"]) is None:\n            errors.append(f"entries[{index}].mod_id has invalid physical identifier syntax")\n'
          new = '        if isinstance(entry.get("mod_id"), str):\n            if not entry["mod_id"]:\n                errors.append(f"entries[{index}].mod_id must be a non-empty physical identifier")\n            elif MOD_ID_RE.fullmatch(entry["mod_id"]) is None:\n                errors.append(f"entries[{index}].mod_id has invalid physical identifier syntax")\n'
          if text.count(old) != 1:
              raise SystemExit('importer: mod_id replacement marker mismatch')
          text = text.replace(old, new)
          old = '    output_path = Path(output_path)\n    output_path.parent.mkdir(parents=True, exist_ok=True)\n'
          new = '    output_path = _workspace_path(output_path, label="snapshot output", must_exist=False)\n    output_path.parent.mkdir(parents=True, exist_ok=True)\n'
          if text.count(old) != 1:
              raise SystemExit('importer: output containment marker mismatch')
          text = text.replace(old, new)
          old = 'def load_persisted_snapshot(path):\n    path = Path(path)\n    manifest = json.loads(path.read_text(encoding="utf-8"))\n'
          new = 'def load_persisted_snapshot(path):\n    path = _workspace_path(path, label="snapshot manifest", must_exist=True)\n    manifest = json.loads(path.read_text(encoding="utf-8"))\n'
          if text.count(old) != 1:
              raise SystemExit('importer: manifest containment marker mismatch')
          text = text.replace(old, new)
          old = '            shard_path = path.parent / shard_name\n            shard_bytes = shard_path.read_bytes()\n'
          new = '            shard_path = _workspace_path(\n                path.parent / shard_name,\n                label=f"snapshot shard {shard_name}",\n                must_exist=True,\n            )\n            shard_bytes = shard_path.read_bytes()\n'
          if text.count(old) != 1:
              raise SystemExit('importer: shard containment marker mismatch')
          text = text.replace(old, new)
          old = '                provider_catalog = json.loads(Path(args.providers).read_text(encoding="utf-8"))\n'
          new = '                providers_path = _workspace_path(args.providers, label="provider catalog", must_exist=True)\n                provider_catalog = json.loads(providers_path.read_text(encoding="utf-8"))\n'
          if text.count(old) != 1:
              raise SystemExit('importer: provider input containment marker mismatch')
          text = text.replace(old, new)
          old = '    input_path = Path(args.input)\n    snapshot = parse_modlist_bytes(\n        input_path.read_bytes(),\n'
          new = '    input_path = _workspace_path(args.input, label="physical modlist input", must_exist=True)\n    snapshot = parse_modlist_bytes(\n        input_path.read_bytes(),\n'
          if text.count(old) != 1:
              raise SystemExit('importer: physical input containment marker mismatch')
          text = text.replace(old, new)
          old = '        Path(args.providers_output).parent.mkdir(parents=True, exist_ok=True)\n        Path(args.providers_output).write_bytes(_json_bytes(provider_catalog))\n        print(f"Wrote {args.providers_output}")\n'
          new = '        providers_output = _workspace_path(args.providers_output, label="provider catalog output", must_exist=False)\n        providers_output.parent.mkdir(parents=True, exist_ok=True)\n        providers_output.write_bytes(_json_bytes(provider_catalog))\n        print(f"Wrote {providers_output}")\n'
          if text.count(old) != 1:
              raise SystemExit('importer: provider output containment marker mismatch')
          text = text.replace(old, new)
          importer.write_text(text, encoding='utf-8', newline='\n')

          scaffolder = Path('engineering/tooling/scaffolder/scaffold_mod.py')
          text = scaffolder.read_text(encoding='utf-8')
          text = text.replace('import argparse\nimport json\n', 'import argparse\nimport importlib.util\nimport json\n', 1)
          old = 'WRAPPER_AUTHORITY = Path(__file__).resolve().parent / "wrapper-authority"\n\n'
          new = 'WRAPPER_AUTHORITY = Path(__file__).resolve().parent / "wrapper-authority"\nI1_VALIDATOR = REPO_ROOT / "engineering" / "tooling" / "validate-i1-foundation.py"\nMOD_SPEC_SCHEMA = REPO_ROOT / "engineering" / "schemas" / "mod-spec.schema.json"\n\n'
          if text.count(old) != 1:
              raise SystemExit('scaffolder: trusted paths marker mismatch')
          text = text.replace(old, new)
          marker = ')\n\n\ndef _load_json(path: Path) -> dict[str, Any]:\n'
          helper = ''')\n\n\ndef _is_within(path: Path, root: Path) -> bool:\n    try:\n        path.relative_to(root)\n    except ValueError:\n        return False\n    return True\n\n\ndef _trusted_input_path(value, *, label):\n    workspace = Path.cwd().resolve()\n    raw = Path(value)\n    candidate = raw.resolve(strict=True) if raw.is_absolute() else (workspace / raw).resolve(strict=True)\n    repo_root = REPO_ROOT.resolve()\n    if not (_is_within(candidate, workspace) or _is_within(candidate, repo_root)):\n        raise ValueError(f"{label} must stay inside the current workspace or Factory repository")\n    return candidate\n\n\ndef _workspace_output_path(value, *, label):\n    workspace = Path.cwd().resolve()\n    raw = Path(value)\n    candidate = raw.resolve(strict=False) if raw.is_absolute() else (workspace / raw).resolve(strict=False)\n    if candidate == workspace or not _is_within(candidate, workspace):\n        raise ValueError(f"{label} must stay inside workspace: {workspace}")\n    return candidate\n\n\ndef _contained_child(root: Path, relative: str, *, label):\n    candidate = (root / relative).resolve(strict=False)\n    if candidate == root or not _is_within(candidate, root):\n        raise ValueError(f"{label} escapes generated project root")\n    return candidate\n\n\ndef _load_json(path: Path) -> dict[str, Any]:\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'scaffolder: helper insertion marker mismatch ({text.count(marker)})')
          text = text.replace(marker, helper, 1)
          marker = 'def _validate_inputs(mod_spec: dict[str, Any], config: dict[str, Any]) -> None:\n'
          schema_validator = '''def _validate_mod_spec_schema(mod_spec: dict[str, Any]) -> None:\n    spec = importlib.util.spec_from_file_location("factory_i1_validator", I1_VALIDATOR)\n    if spec is None or spec.loader is None:\n        raise ValueError("cannot load canonical I1 validator")\n    module = importlib.util.module_from_spec(spec)\n    spec.loader.exec_module(module)\n    schema = json.loads(MOD_SPEC_SCHEMA.read_text(encoding="utf-8"))\n    errors = module.validate_instance(schema, mod_spec)\n    if errors:\n        raise ValueError("mod spec schema validation failed: " + "; ".join(errors))\n\n\ndef _validate_inputs(mod_spec: dict[str, Any], config: dict[str, Any]) -> None:\n'''
          if text.count(marker) != 1:
              raise SystemExit('scaffolder: schema validator marker mismatch')
          text = text.replace(marker, schema_validator, 1)
          old = '    mod_spec_path = Path(mod_spec_path)\n    scaffold_config_path = Path(scaffold_config_path)\n    output = Path(output_dir)\n\n    _validate_wrapper_authority()\n'
          new = '    mod_spec_path = _trusted_input_path(mod_spec_path, label="mod spec")\n    scaffold_config_path = _trusted_input_path(scaffold_config_path, label="scaffold config")\n    output = _workspace_output_path(output_dir, label="scaffold output")\n\n    _validate_wrapper_authority()\n'
          if text.count(old) != 1:
              raise SystemExit('scaffolder: input/output containment marker mismatch')
          text = text.replace(old, new)
          old = '    mod_spec = _load_json(mod_spec_path)\n    config = _load_json(scaffold_config_path)\n    _validate_inputs(mod_spec, config)\n'
          new = '    mod_spec = _load_json(mod_spec_path)\n    config = _load_json(scaffold_config_path)\n    _validate_mod_spec_schema(mod_spec)\n    _validate_inputs(mod_spec, config)\n'
          if text.count(old) != 1:
              raise SystemExit('scaffolder: schema validation call marker mismatch')
          text = text.replace(old, new)
          old = '        destination = output / _output_for_template(template_name, values)\n        destination.parent.mkdir(parents=True, exist_ok=True)\n'
          new = '        output_relative = _output_for_template(template_name, values)\n        destination = _contained_child(output, output_relative, label=f"template output {template_name}")\n        destination.parent.mkdir(parents=True, exist_ok=True)\n'
          if text.count(old) != 1:
              raise SystemExit('scaffolder: template output containment marker mismatch')
          text = text.replace(old, new)
          old = '        destination = output / output_relative\n        destination.parent.mkdir(parents=True, exist_ok=True)\n'
          new = '        destination = _contained_child(output, output_relative, label=f"wrapper output {output_relative}")\n        destination.parent.mkdir(parents=True, exist_ok=True)\n'
          if text.count(old) != 1:
              raise SystemExit('scaffolder: wrapper output containment marker mismatch')
          text = text.replace(old, new)
          scaffolder.write_text(text, encoding='utf-8', newline='\n')

          for path in [
              'engineering/templates/neoforge-mod/build.gradle.tmpl',
              'engineering/tests/golden/i3-golden-mod/build.gradle',
          ]:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              marker = "java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))\n\n"
              block = "java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))\n\nsourceSets {\n    main {\n        resources {\n            srcDir 'src/generated/resources'\n        }\n    }\n}\n\n"
              if text.count(marker) != 1:
                  raise SystemExit(f'{path}: datagen sourceSet marker mismatch')
              p.write_text(text.replace(marker, block), encoding='utf-8', newline='\n')

          action_replacements = {
              'actions/checkout@v4': 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4',
              'actions/setup-java@v4': 'actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4',
              'gradle/actions/setup-gradle@v4': 'gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3',
          }
          for path in [
              'engineering/templates/neoforge-mod/ci.yml.tmpl',
              'engineering/tests/golden/i3-golden-mod/.github/workflows/ci.yml',
          ]:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in action_replacements.items():
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: action pin marker mismatch for {old}')
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8', newline='\n')

          i2_test = Path('engineering/tests/test_i2_modlist_catalog.py')
          text = i2_test.read_text(encoding='utf-8')
          text = text.replace('import importlib.util\n', 'import contextlib\nimport importlib.util\n', 1)
          old = '''        with tempfile.TemporaryDirectory() as tmp:\n            root = Path(tmp)\n            snapshot_path = root / "snapshot.json"\n            provider_path = root / "providers.json"\n            manifest = module.write_persisted_snapshot(snapshot, snapshot_path, shard_size=2)\n            self.assertEqual(len(snapshot["entries"]), manifest["entry_count"])\n            self.assertGreater(len(manifest["entry_shards"]), 1)\n            loaded = module.load_persisted_snapshot(snapshot_path)\n            self.assertEqual(snapshot, loaded)\n            providers = module.build_persisted_provider_catalog(loaded)\n            provider_path.write_text(json.dumps(providers), encoding="utf-8")\n            self.assertEqual([], module.validate_persisted_provider_catalog(loaded, providers))\n            self.assertEqual(len(module.build_provider_catalog(loaded)), providers["provider_count"])\n'''
          new = '''        with tempfile.TemporaryDirectory() as tmp:\n            root = Path(tmp)\n            snapshot_path = root / "snapshot.json"\n            provider_path = root / "providers.json"\n            with contextlib.chdir(root):\n                manifest = module.write_persisted_snapshot(snapshot, snapshot_path, shard_size=2)\n                self.assertEqual(len(snapshot["entries"]), manifest["entry_count"])\n                self.assertGreater(len(manifest["entry_shards"]), 1)\n                loaded = module.load_persisted_snapshot(snapshot_path)\n                self.assertEqual(snapshot, loaded)\n                providers = module.build_persisted_provider_catalog(loaded)\n                provider_path.write_text(json.dumps(providers), encoding="utf-8")\n                self.assertEqual([], module.validate_persisted_provider_catalog(loaded, providers))\n                self.assertEqual(len(module.build_provider_catalog(loaded)), providers["provider_count"])\n'''
          if text.count(old) != 1:
              raise SystemExit('I2 original test adaptation marker mismatch')
          i2_test.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          i3_test = Path('engineering/tests/test_i3_mod_scaffolder.py')
          text = i3_test.read_text(encoding='utf-8')
          text = text.replace('import importlib.util\n', 'import contextlib\nimport importlib.util\n', 1)
          old = '''    def generate(self, output):\n        module = self.require_scaffolder()\n        module.generate_project(MOD_SPEC, SCAFFOLD_CONFIG, output)\n        return output\n'''
          new = '''    def generate(self, output):\n        module = self.require_scaffolder()\n        output = Path(output)\n        output.parent.mkdir(parents=True, exist_ok=True)\n        with contextlib.chdir(output.parent):\n            module.generate_project(MOD_SPEC, SCAFFOLD_CONFIG, Path(output.name))\n        return output\n'''
          if text.count(old) != 1:
              raise SystemExit('I3 generate helper adaptation marker mismatch')
          text = text.replace(old, new)
          old = '''            root = Path(tmp)\n            first = module.generate_project(MOD_SPEC, SCAFFOLD_CONFIG, root / "first")\n            second = module.generate_project(MOD_SPEC, SCAFFOLD_CONFIG, root / "second")\n            self.assertEqual(file_map(first), file_map(second))\n'''
          new = '''            root = Path(tmp)\n            with contextlib.chdir(root):\n                first = module.generate_project(MOD_SPEC, SCAFFOLD_CONFIG, Path("first"))\n                second = module.generate_project(MOD_SPEC, SCAFFOLD_CONFIG, Path("second"))\n            self.assertEqual(file_map(first), file_map(second))\n'''
          if text.count(old) != 1:
              raise SystemExit('I3 deterministic test adaptation marker mismatch')
          text = text.replace(old, new)
          old = '''            with self.assertRaises(FileExistsError):\n                module.generate_project(MOD_SPEC, SCAFFOLD_CONFIG, target)\n            self.assertEqual("preserve", marker.read_text(encoding="utf-8"))\n'''
          new = '''            with contextlib.chdir(Path(tmp)):\n                with self.assertRaises(FileExistsError):\n                    module.generate_project(MOD_SPEC, SCAFFOLD_CONFIG, Path("existing"))\n            self.assertEqual("preserve", marker.read_text(encoding="utf-8"))\n'''
          if text.count(old) != 1:
              raise SystemExit('I3 nonempty test adaptation marker mismatch')
          text = text.replace(old, new)
          old = '''            drifted_path.write_text(json.dumps(drifted), encoding="utf-8")\n            with self.assertRaises(ValueError):\n                module.generate_project(drifted_path, SCAFFOLD_CONFIG, root / "output")\n'''
          new = '''            drifted_path.write_text(json.dumps(drifted), encoding="utf-8")\n            with contextlib.chdir(root):\n                with self.assertRaises(ValueError):\n                    module.generate_project(Path("drifted-mod-spec.json"), SCAFFOLD_CONFIG, Path("output"))\n'''
          if text.count(old) != 1:
              raise SystemExit('I3 target drift adaptation marker mismatch')
          text = text.replace(old, new)
          old = '''            incomplete_path.write_text(json.dumps(incomplete), encoding="utf-8")\n            with self.assertRaises(ValueError):\n                module.generate_project(MOD_SPEC, incomplete_path, root / "output")\n'''
          new = '''            incomplete_path.write_text(json.dumps(incomplete), encoding="utf-8")\n            with contextlib.chdir(root):\n                with self.assertRaises(ValueError):\n                    module.generate_project(MOD_SPEC, Path("incomplete-scaffold-config.json"), Path("output"))\n'''
          if text.count(old) != 1:
              raise SystemExit('I3 incomplete config adaptation marker mismatch')
          text = text.replace(old, new)
          i3_test.write_text(text, encoding='utf-8', newline='\n')

          for path, old, new in [
              ('.github/workflows/factory-engineering-i2-modlist-catalog.yml', '$RUNNER_TEMP/i2-snapshot.json', '.factory-ci/i2/snapshot.json'),
              ('.github/workflows/factory-engineering-i2-modlist-catalog.yml', '$RUNNER_TEMP/i2-providers.json', '.factory-ci/i2/providers.json'),
              ('.github/workflows/factory-engineering-i3-mod-scaffolder.yml', '$RUNNER_TEMP/i3-generated', '.factory-ci/i3/generated'),
              ('.github/workflows/factory-engineering-i3-mod-scaffolder.yml', '$RUNNER_TEMP/i3-gradle-home', '.factory-ci/i3/gradle-home'),
          ]:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path}: workspace CI marker missing: {old}')
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY

      - name: Run focused GREEN tests before commit
        run: |
          python3 -m unittest engineering/tests/test_i2_modlist_catalog.py engineering/tests/test_i2_security_review.py
          python3 -m unittest engineering/tests/test_i3_mod_scaffolder.py engineering/tests/test_i3_security_review.py
          git diff --check

      - name: Commit GREEN
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add engineering .github/workflows/factory-engineering-i2-modlist-catalog.yml .github/workflows/factory-engineering-i3-mod-scaffolder.yml
          git commit -m 'fix(engineering): harden E3 filesystem boundaries'
          git push origin HEAD:feat/f3-e3-i2-i3-migration
