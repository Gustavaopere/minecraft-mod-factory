name: Factory Sonar Annotations Diagnostic Once

on:
  push:
    branches:
      - feat/construction-c1-schematica-upstream
    paths:
      - '.github/workflows/factory-sonar-annotations-diagnostic-once.yml'

permissions:
  contents: read
  checks: read

jobs:
  inspect-sonar-annotations:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch Sonar check annotations
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GH_REPO}/check-runs/103057411907/annotations" \
            --jq '.[] | {path, start_line, end_line, annotation_level, title, message, raw_details}'
