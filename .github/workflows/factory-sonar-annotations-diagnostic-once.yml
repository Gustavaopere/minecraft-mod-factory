name: Factory Schematica Lock Hash Diagnostic Once

on:
  push:
    branches:
      - feat/construction-c1-schematica-upstream
    paths:
      - '.github/workflows/factory-sonar-annotations-diagnostic-once.yml'

permissions:
  contents: read

jobs:
  generate-lock-hashes:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download exact artifacts and print lock entries
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r requirement; do
            [ -n "$requirement" ] || continue
            workdir="$(mktemp -d)"
            python3 -m pip download --disable-pip-version-check --no-deps --dest "$workdir" "$requirement" >/dev/null
            mapfile -t artifacts < <(find "$workdir" -maxdepth 1 -type f -print)
            test "${#artifacts[@]}" -eq 1
            digest="$(sha256sum "${artifacts[0]}" | cut -d' ' -f1)"
            printf '%s --hash=sha256:%s\n' "$requirement" "$digest"
            rm -rf "$workdir"
          done <<'EOF'
          ast-serialize==0.11.1
          contourpy==1.3.3
          coverage==7.16.0
          cycler==0.12.1
          fonttools==4.65.0
          hypothesis==6.168.0
          iniconfig==2.3.0
          kiwisolver==1.5.1
          librt==0.15.0
          matplotlib==3.11.1
          mypy==2.3.1
          mypy-extensions==1.1.0
          nbtlib==2.0.4
          noise==1.2.2
          numpy==2.4.6
          packaging==26.3
          pathspec==1.1.1
          pillow==12.3.0
          pluggy==1.6.0
          prompt-toolkit==3.0.53
          pygments==2.21.0
          pyparsing==3.3.2
          pytest==9.1.1
          pytest-cov==7.1.0
          python-dateutil==2.9.0.post0
          ruff==0.16.7
          scipy==1.17.1
          shapely==2.1.2
          six==1.17.0
          sortedcontainers==2.4.0
          trimesh==5.1.0
          typing-extensions==4.16.0
          wcwidth==0.8.3
          EOF
