name: Factory Construction C10 RED Evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/factory-construction-c10-red-evidence.yml'
      - 'construction/tests/test_c10_workflow_contract.py'

permissions:
  contents: read

jobs:
  c10-workflow-red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Prove C10 workflow contract is RED while target workflow is absent
        run: python3 -m unittest construction/tests/test_c10_workflow_contract.py -v
