name: C9 Task 4 Facade Verification

on:
  push:
    branches:
      - feat/construction-c9-agent-mcp

jobs:
  task4-green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run Task 4 facade parity
        run: python3 -m unittest construction.tests.test_c9_agent_mcp.C9FacadeParityContractTests -v
      - name: Run C5 regression
        run: python3 -m unittest construction/tests/test_c5_modded_palette.py -v
      - name: Run C2 regression
        run: python3 -m unittest construction/tests/test_c2_build_ir.py -v
