name: Factory Construction C3 Vanilla Golden

on:
  push:
    branches:
      - main
      - feat/construction-c3-vanilla-golden
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/factory-construction-c3-vanilla-golden.yml'
      - 'construction/STATUS.md'
      - 'construction/README.md'
      - 'construction/docs/ARCHITECTURE.md'
      - 'construction/core/build_ir.py'
      - 'construction/schemas/build-ir.schema.json'
      - 'construction/schemas/build-spec.schema.json'
      - 'construction/fixtures/vanilla-golden/**'
      - 'construction/tests/test_c3_vanilla_golden.py'

permissions:
  contents: read

jobs:
  c3-vanilla-golden:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with preserved upstreams
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install hashed Schematica test environment
        run: python3 -m pip install --require-hashes --no-deps -r construction/upstream/harness/schematica-test-lock.txt

      - name: Run C3 vanilla golden contract tests
        run: python3 -m unittest construction/tests/test_c3_vanilla_golden.py -v

      - name: Run C2 regression
        run: python3 -m unittest construction/tests/test_c2_build_ir.py -v

      - name: Run C0 regression
        run: |
          python3 -m unittest construction/tests/test_c0_foundation.py -v
          python3 construction/scripts/validate_c0.py

      - name: Check C3 whitespace
        run: git diff --check HEAD^ -- .github/workflows/factory-construction-c3-vanilla-golden.yml construction/fixtures/vanilla-golden construction/tests/test_c3_vanilla_golden.py construction/README.md construction/docs/ARCHITECTURE.md construction/STATUS.md
