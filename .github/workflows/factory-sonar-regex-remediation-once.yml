name: Factory Sonar Regex Remediation Once

on:
  push:
    branches:
      - fix/sonar-superlinear-regex-remediation
    paths:
      - '.github/workflows/factory-sonar-regex-remediation-once.yml'
      - '.github/scripts/apply-sonar-regex-remediation-once.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/sonar-superlinear-regex-remediation
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic linear parser remediation
        run: python .github/scripts/apply-sonar-regex-remediation-once.py

      - name: Regenerate and validate affected authorities
        shell: bash
        run: |
          set -euo pipefail
          node art/tooling/blockbench/asset-toolkit/build_toolkit_bundle.js --write
          python -m unittest \
            migration/full-skill-migration/test_m5_naming.py \
            migration/full-skill-migration/test_sonar_hardening.py \
            migration/full-skill-migration/test_sonar_regex_hardening.py \
            -v
          python skills/scripts/validate_skill_repository.py
          git diff --check

      - name: Persist permanent remediation only
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          git rm \
            .github/workflows/factory-sonar-regex-remediation-once.yml \
            .github/scripts/apply-sonar-regex-remediation-once.py
          python3 - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/factory-full-skill-migration-validation.yml',
              'art/golden-samples/validate_reference_evidence.js',
              'art/tooling/blockbench/asset-toolkit/build_toolkit_bundle.js',
              'art/tooling/validators/rendered_markdown_linear.js',
              'art/tooling/validators/validate_golden_reference_rendered_edges.js',
              'migration/full-skill-migration/test_sonar_regex_hardening.py',
              'skills/scripts/validate_skill_repository.py',
              '.github/workflows/factory-sonar-regex-remediation-once.yml',
              '.github/scripts/apply-sonar-regex-remediation-once.py',
          }
          status = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          changed = {line[3:] for line in status if len(line) >= 4}
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected staged/worktree paths: {sorted(unexpected)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/factory-full-skill-migration-validation.yml \
            art/golden-samples/validate_reference_evidence.js \
            art/tooling/blockbench/asset-toolkit/build_toolkit_bundle.js \
            art/tooling/validators/rendered_markdown_linear.js \
            art/tooling/validators/validate_golden_reference_rendered_edges.js \
            migration/full-skill-migration/test_sonar_regex_hardening.py \
            skills/scripts/validate_skill_repository.py
          git commit -m 'fix(sonar): replace flagged superlinear regexes'
          git push origin HEAD:fix/sonar-superlinear-regex-remediation
