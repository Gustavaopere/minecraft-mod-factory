          paths = set(subprocess.check_output(['git', 'status', '--short'], text=True).splitlines())
          changed = {line[3:] for line in paths if len(line) >= 4}
          unexpected = changed - allowed - {'.github/workflows/factory-sonar-regex-remediation-once.yml'}
