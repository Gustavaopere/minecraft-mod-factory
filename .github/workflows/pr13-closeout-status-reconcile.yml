name: PR13 Closeout Status Reconcile

on:
  push:
    branches:
      - docs/art-pr13-closeout-status
    paths:
      - .github/workflows/pr13-closeout-status-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile current PR13 pointers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('STATUS.md')
          lines = path.read_text(encoding='utf-8').splitlines()
          replacements = {
              'PR13_POSTMERGE_ACTIONS': '27_OF_27_WORKFLOWS_SUCCESS; HEAD=9978bcf44a0a4a091b7d6786b51058c8d770f344',
              'PR13_STATE': 'MERGED_POSTMERGE_ACTIONS_GREEN_PREMERGE_SONAR_GREEN_EXTERNAL_DCC_AUTHORITY_AUDITED_PROVIDER_RUNTIME_UNPROVEN; GLOBAL_MAIN_SONAR_NOT_PASS; NEXT=PR14_UNIFIED_QA_EXPORT_MANIFEST',
              'FACTORY_GLOBAL_SONAR_AT_CURRENT_MAIN': 'ANALYSIS_FAILED; CHECK=103448526392; CONCLUSION=CANCELLED; DO_NOT_LABEL_FACTORY_GLOBALLY_GREEN',
              'FACTORY_GLOBAL_SONAR_BLOCKER': 'MAIN_BRANCH_ANALYSIS_FAILED_ON_PR13_MERGE; CHECK=103448526392; PREMERGE_PR13_QUALITY_GATE_PASS_DOES_NOT_CLEAR_GLOBAL_MAIN_SONAR_STATE',
              'USER_STOP_BOUNDARY': 'HISTORICAL_BOUNDARY_CLEARED_BY_USER_PROSSIGA; PR13_EXECUTION_COMPLETED_AFTER_BOUNDARY',
              'NEXT_ACTION': 'BEGIN_PR14_UNIFIED_QA_EXPORT_MANIFEST; FIRST_RECHECK_PHYSICAL_MODLIST_CURRENT_REPO_BRANCHES_PRS_STATUS_AND_EXISTING_STRUCTURAL_VISUAL_QA_CAPTURE_FINGERPRINT_HASH_EXPORT_STAGING_SEMANTIC_DIFF_RUNTIME_TARGET_HANDOFF_CONTRACTS; NO_ASSET_FINAL_JUST_BECAUSE_EXPORTED; PRESERVE_NATIVE_AUTHORING_SOURCE; NO_SILENT_PROVIDER_CONVERSION; F4/I6_REMAINS_NOT_COMPLETE; I7_REMAINS_BLOCKED',
          }
          for key, value in replacements.items():
              hits = [i for i, line in enumerate(lines) if line.startswith(key + '=')]
              if len(hits) != 1:
                  raise SystemExit(f'{key}: expected exactly one STATUS entry, found {len(hits)}')
              lines[hits[0]] = f'{key}={value}'

          required = [
              'ART_FRONTIER=PR13_EXTERNAL_DCC_BLENDER_EPIC_FIGHT_MERGED_CONTRACT_HANDOFF_PASS_PROVIDER_RUNTIME_UNPROVEN; NEXT=PR14_UNIFIED_QA_EXPORT_MANIFEST',
              'I6_REAL_HANDOFF=NOT_COMPLETE',
              'I7_STATE=BLOCKED_BY_F4_REAL_I6_HANDOFF',
              'PR13_RUNTIME_EVIDENCE=CONTRACT_AND_EXTERNAL_DCC_HANDOFF_PASS; REAL_BLENDER_EXPORT_PLAYBACK_UNPROVEN; TARGET_EXACT_EPIC_FIGHT_RUNTIME_UNPROVEN; MULTIPLAYER_CORRECTNESS_UNPROVEN; FULL_MODPACK_RUNTIME_UNPROVEN; runtimeEvidence=UNPROVEN; runtimeValidated=false; f4I6Evidence=false',
          ]
          for entry in required:
              if entry not in lines:
                  raise SystemExit(f'missing required preserved boundary: {entry}')

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit reconciled STATUS-only closeout and remove materializer
        shell: bash
        env:
          BASE_SHA: 9978bcf44a0a4a091b7d6786b51058c8d770f344
        run: |
          rm .github/workflows/pr13-closeout-status-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md .github/workflows/pr13-closeout-status-reconcile.yml
          git diff --cached --check
          git commit -m "docs(status): reconcile PR13 closeout pointers"
          test "$(git diff --name-only "$BASE_SHA"..HEAD)" = "STATUS.md"
          git diff --check "$BASE_SHA"..HEAD
          git push origin HEAD
