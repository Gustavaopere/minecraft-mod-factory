name: Factory Art PR10 EMF CEM

on:
  push:
    branches:
      - main
      - feat/art-pr10-emf-cem
  pull_request:
    paths:
      - 'art/tooling/blockbench/asset-toolkit/**'
      - 'art/standards/**'
      - '.github/workflows/factory-art-pr10-emf-cem.yml'

permissions:
  contents: read

jobs:
  emf-cem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PR10 audited EMF CEM contract
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.emf_cem_pr10.test.js
      - name: Existing provider profile regressions
        if: always()
        working-directory: art/tooling/blockbench/asset-toolkit
        run: |
          node --test \
            asset_toolkit.provider_expansion.test.js \
            asset_toolkit.geckolib4_adapter.test.js \
            asset_toolkit.azurelib3_adapter.test.js \
            asset_toolkit.neoforge_native_animation_adapter.test.js \
            asset_toolkit.easy_model_entities_pr9.test.js
      - name: Standalone bundle reproducibility
        if: always()
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --check
      - name: Whitespace
        if: always()
        run: git diff --check HEAD^ -- art/tooling/blockbench/asset-toolkit art/standards .github/workflows/factory-art-pr10-emf-cem.yml
