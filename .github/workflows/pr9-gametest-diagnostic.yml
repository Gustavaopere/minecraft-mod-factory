name: PR9 GameTest Diagnostic

on:
  push:
    branches:
      - feat/art-pr9-easy-model-entities

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/art-pr9-easy-model-entities
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Checkout audited Easy Model Entities 2.3.0 runtime source
        uses: actions/checkout@v4
        with:
          repository: MarkusBordihn/BOs-Easy-Model-Entities
          ref: 8c912371838c2a26bbb383008ad3999280f075d1
          path: .factory-ci/pr9/easy-model-entities
          persist-credentials: false
      - name: Capture target-exact NeoForge 21.1.248 GameTest output
        working-directory: .factory-ci/pr9/easy-model-entities
        run: |
          chmod +x gradlew
          set +e
          GRADLE_USER_HOME="$GITHUB_WORKSPACE/.factory-ci/pr9/gradle-home" \
            ./gradlew -Pneoforge_version=21.1.248 -PghostRefIndex= \
            :NeoForge:runGameTestServer --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/.factory-ci/pr9/gametest-diagnostic.log"
          status=${PIPESTATUS[0]}
          set -e
          printf '\nGRADLE_EXIT_STATUS=%s\n' "$status" | tee -a "$GITHUB_WORKSPACE/.factory-ci/pr9/gametest-diagnostic.log"
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr9-gametest-diagnostic
          path: .factory-ci/pr9/gametest-diagnostic.log
          if-no-files-found: error
      - name: Remove transient diagnostic workflow
        run: |
          git rm .github/workflows/pr9-gametest-diagnostic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(art): remove PR9 GameTest diagnostic workflow'
          git push origin HEAD:feat/art-pr9-easy-model-entities
