name: Factory Art PR7 AzureLib Adapter

on:
  push:
    branches:
      - main
      - feat/art-pr7-azurelib-adapter
  pull_request:
    paths:
      - 'art/tooling/blockbench/asset-toolkit/**'
      - 'art/golden-samples/**'
      - '.github/workflows/factory-art-pr7-azurelib-adapter.yml'

permissions:
  contents: read

jobs:
  azurelib-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing provider registry and profile regressions
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.registry.test.js asset_toolkit.provider_expansion.test.js
      - name: Existing generic animation regressions
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.animation_core.test.js asset_toolkit.animation_adapter.test.js
      - name: Existing Golden Samples evidence gates
        run: |
          node art/golden-samples/validate_reference_evidence.js
          node art/golden-samples/validate_golden_samples.js
      - name: Standalone bundle reproducibility before PR7 implementation
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --check
      - name: PR7 AzureLib provider RED GREEN contract
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.azurelib_adapter.test.js asset_toolkit.azurelib_blockbench_adapter.test.js asset_toolkit.azurelib_public_api.test.js
      - name: Whitespace
        run: git diff --check HEAD^ -- art/tooling/blockbench/asset-toolkit art/golden-samples .github/workflows/factory-art-pr7-azurelib-adapter.yml
