name: Factory Construction C9 Closeout Materializer

on:
  push:
    branches:
      - diagnostic/sonar-ci-capability

permissions:
  contents: write

env:
  EVIDENCE_B64: 
  SECTION_B64: 

jobs:
  materialize-c9-closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout status-only branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/construction-c9-closeout-status
          fetch-depth: 0
          submodules: false

      - name: Update only Construction STATUS
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import base64, os; from pathlib import Path; p=Path("construction/STATUS.md"); t=p.read_text(encoding="utf-8"); repl={"UPDATED_AT=2026-09-11":"UPDATED_AT=2026-09-12","PHASE=C8_COMPLETE_POSTMERGE_VALIDATED":"PHASE=C9_COMPLETE_POSTMERGE_VALIDATED","NEXT_ACTION=BEGIN_C9_AGENT_MCP":"NEXT_ACTION=BEGIN_C10_EXTERNAL_PROVIDERS"}; [(None if t.count(k)==1 else (_ for _ in ()).throw(SystemExit(f"bad marker {k!r}"))) for k in repl]; t=t.replace("UPDATED_AT=2026-09-11","UPDATED_AT=2026-09-12",1).replace("PHASE=C8_COMPLETE_POSTMERGE_VALIDATED","PHASE=C9_COMPLETE_POSTMERGE_VALIDATED",1).replace("NEXT_ACTION=BEGIN_C9_AGENT_MCP","NEXT_ACTION=BEGIN_C10_EXTERNAL_PROVIDERS",1); a="C8_CLOSEOUT_BASE_MAIN_SHA=76c2540bbaeed4e76c1d372400bbfadf89c3e3be\n"; assert t.count(a)==1 and "C9_PR=" not in t and "## C9 — Agent/MCP" not in t; e=base64.b64decode(os.environ["EVIDENCE_B64"]).decode(); s=base64.b64decode(os.environ["SECTION_B64"]).decode(); t=t.replace(a,a+e,1); t=t.rstrip()+"\n\n"+s; p.write_text(t,encoding="utf-8")'
          changed="$(git diff --name-only)"
          test "$changed" = "construction/STATUS.md"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add construction/STATUS.md
          git commit -m "docs(construction): close C9 postmerge validation"
          git push origin HEAD:docs/construction-c9-closeout-status
