name: Factory Sonar CI Capability Probe

on:
  push:
    branches:
      - diagnostic/sonar-ci-capability

permissions:
  contents: read

jobs:
  sonar-ci-capability-probe:
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Verify Sonar CI credential and inspect main quality baseline
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "::error title=Missing SONAR_TOKEN::Repository or organization secret SONAR_TOKEN is not configured or not available to this workflow."
            exit 1
          fi

          fetch() {
            local name="$1"
            local url="$2"
            local code
            code="$(curl --silent --show-error --user "${SONAR_TOKEN}:" \
              --output "${RUNNER_TEMP}/${name}.json" --write-out '%{http_code}' "$url")"
            echo "API_STATUS=${name}:${code}"
          }

          fetch component 'https://sonarcloud.io/api/components/show?component=Gustavaopere_minecraft-mod-factory'
          fetch gate 'https://sonarcloud.io/api/qualitygates/project_status?projectKey=Gustavaopere_minecraft-mod-factory&branch=main'
          fetch measures 'https://sonarcloud.io/api/measures/component?component=Gustavaopere_minecraft-mod-factory&branch=main&metricKeys=coverage,new_coverage,lines_to_cover,new_lines_to_cover,uncovered_lines,new_uncovered_lines'
          fetch new_code 'https://sonarcloud.io/api/new_code_periods/show?project=Gustavaopere_minecraft-mod-factory&branch=main'

          RUNNER_TEMP_PATH="$RUNNER_TEMP" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP_PATH"])

          def load(name):
              path = root / f"{name}.json"
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"API_PARSE={name}:unavailable:{type(exc).__name__}")
                  return None

          component_payload = load("component") or {}
          component = component_payload.get("component", {})
          if component.get("key") != "Gustavaopere_minecraft-mod-factory":
              raise SystemExit(f"unexpected Sonar project key: {component.get('key')!r}")
          organization = component.get("organization")
          if not isinstance(organization, str) or not organization:
              raise SystemExit("Sonar organization key missing from component response")
          print(f"SONAR_PROJECT_KEY={component['key']}")
          print(f"SONAR_ORGANIZATION={organization}")

          gate_payload = load("gate") or {}
          gate = gate_payload.get("projectStatus", {})
          print(f"QUALITY_GATE_STATUS={gate.get('status')}")
          for condition in gate.get("conditions", []):
              metric = condition.get("metricKey")
              if metric in {"new_coverage", "new_reliability_rating", "new_security_rating", "new_security_hotspots_reviewed", "new_duplicated_lines_density"}:
                  print(
                      "QUALITY_CONDITION="
                      f"{metric}:{condition.get('status')}:actual={condition.get('actualValue')}:"
                      f"op={condition.get('comparator')}:threshold={condition.get('errorThreshold')}"
                  )

          measures_payload = (load("measures") or {}).get("component", {})
          allowed = {"coverage", "new_coverage", "lines_to_cover", "new_lines_to_cover", "uncovered_lines", "new_uncovered_lines"}
          for measure in measures_payload.get("measures", []):
              metric = measure.get("metric")
              if metric in allowed:
                  print(f"MEASURE={metric}:value={measure.get('value')}:period={measure.get('period')}")

          new_code = load("new_code") or {}
          if new_code:
              print(
                  "NEW_CODE_PERIOD="
                  f"type={new_code.get('type')}:value={new_code.get('value')}:"
                  f"effectiveValue={new_code.get('effectiveValue')}:inherited={new_code.get('inherited')}"
              )
          PY
