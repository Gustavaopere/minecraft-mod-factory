name: Factory Construction C9 Closeout Typo Fix

on:
  push:
    branches:
      - diagnostic/sonar-ci-capability

permissions:
  contents: write

jobs:
  fix-c9-closeout-typo:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout status-only branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/construction-c9-closeout-status
          fetch-depth: 0
          submodules: false

      - name: Fix typo only
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("construction/STATUS.md"); t=p.read_text(encoding="utf-8"); old="final imlementation PR #82"; new="final implementation PR #82"; assert t.count(old)==1; p.write_text(t.replace(old,new,1),encoding="utf-8")'
          test "$(git diff --name-only)" = "construction/STATUS.md"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add construction/STATUS.md
          git commit -m "docs(construction): fix C9 closeout wording"
          git push origin HEAD:docs/construction-c9-closeout-status
