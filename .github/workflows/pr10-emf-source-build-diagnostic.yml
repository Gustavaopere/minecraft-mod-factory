name: PR10 EMF Source Build Diagnostic

on:
  push:
    branches:
      - feat/art-pr10-emf-cem

permissions:
  contents: read

jobs:
  source-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Checkout exact EMF 3.3.5 source for upstream-pin build
        uses: actions/checkout@v4
        with:
          repository: Traben-0/Entity_Model_Features
          ref: 02034eb0f102040b16900be7c900eff88da89e9e
          path: emf-upstream
      - name: Verify exact upstream NeoForge pin
        run: |
          grep -Fx 'essential.defaults.loom.neoForge=net.neoforged:neoforge:21.0.167' emf-upstream/versions/1.21-neoforge/gradle.properties
          grep -F 'mod_version=3.3.5' emf-upstream/gradle.properties
      - name: Build exact upstream 1.21 NeoForge source
        working-directory: emf-upstream
        run: |
          chmod +x ./gradlew
          ./gradlew :1.21-neoforge:build --no-daemon
      - name: Checkout exact EMF 3.3.5 source for Factory-target override
        uses: actions/checkout@v4
        with:
          repository: Traben-0/Entity_Model_Features
          ref: 02034eb0f102040b16900be7c900eff88da89e9e
          path: emf-target
      - name: Apply ephemeral Factory NeoForge target override
        run: |
          sed -i 's/net.neoforged:neoforge:21.0.167/net.neoforged:neoforge:21.1.248/' emf-target/versions/1.21-neoforge/gradle.properties
          grep -Fx 'essential.defaults.loom.neoForge=net.neoforged:neoforge:21.1.248' emf-target/versions/1.21-neoforge/gradle.properties
      - name: Build exact EMF source with Factory NeoForge target override
        working-directory: emf-target
        run: |
          chmod +x ./gradlew
          ./gradlew :1.21-neoforge:build --no-daemon
