name: PR13 Closeout Status Materializer

on:
  push:
    branches:
      - docs/art-pr13-closeout-status
    paths:
      - .github/workflows/pr13-closeout-status-materializer.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize PR13 closeout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('STATUS.md')
          text = path.read_text(encoding='utf-8')
          lines = text.splitlines()

          replacements = {
              'FACTORY_PHASE': 'ART_PR13_EPIC_FIGHT_BLENDER_HANDOFF_MERGED_POSTMERGE_ACTIONS_GREEN_PREMERGE_SONAR_GREEN_PROVIDER_RUNTIME_UNPROVEN_MAIN_SONAR_ANALYSIS_CANCELLED_STATUS_CLOSEOUT',
              'CURRENT_BRANCH': 'docs/art-pr13-closeout-status',
              'CURRENT_MAIN_BEFORE_STATUS_UPDATE': '9978bcf44a0a4a091b7d6786b51058c8d770f344',
              'HEAD_AT_LAST_GREEN_VERIFICATION': '9978bcf44a0a4a091b7d6786b51058c8d770f344',
              'OPEN_PRS_AT_STATUS_WRITE': 'PR66_MERGED; PR13_STATUS_CLOSEOUT_PR_PENDING; NO_OTHER_OPEN_PRS',
              'ART_FRONTIER': 'PR13_EXTERNAL_DCC_BLENDER_EPIC_FIGHT_MERGED_CONTRACT_HANDOFF_PASS_PROVIDER_RUNTIME_UNPROVEN; NEXT=PR14_UNIFIED_QA_EXPORT_MANIFEST',
          }

          for key, value in replacements.items():
              hits = [i for i, line in enumerate(lines) if line.startswith(key + '=')]
              if len(hits) != 1:
                  raise SystemExit(f'{key}: expected exactly one STATUS entry, found {len(hits)}')
              lines[hits[0]] = f'{key}={value}'

          if any(line.startswith('PR13_EPIC_FIGHT_BLENDER_PR=') for line in lines):
              raise SystemExit('PR13 closeout block already exists')

          block = [
              'PR13_PLAN_TARGET=EXTERNAL_DCC_BLENDER_EPIC_FIGHT; TARGET=MINECRAFT_1.21.1_NEOFORGE_21.1.248_JAVA_21',
              'PR13_EPIC_FIGHT_BLENDER_PR=66',
              'PR13_EPIC_FIGHT_BLENDER_FINAL_HEAD=d7a059b97c3ff7fd98b2f09e48f084ceadd26efd',
              'PR13_EPIC_FIGHT_BLENDER_MERGE_COMMIT=9978bcf44a0a4a091b7d6786b51058c8d770f344',
              'PR13_PHYSICAL_PROVIDER_VERSION=EPIC_FIGHT_21.17.3.1_PRESENT_HEALTH_UNPROVEN',
              'PR13_SOURCE_ARTIFACT=epic-fight-21.17.3.1-mc1.21.1-neoforge-sources.jar; CURSEFORGE_FILE=8175610',
              'PR13_SOURCE_AUDIT=Antikythera-Studios/epicfight@a78aa24b72e90a9d09f5fd61925e4369d117abaf; BINARY_TO_GIT_COMMIT_MAPPING=UNPROVEN',
              'PR13_DOCS_AUDIT=Antikythera-Studios/epic-fight.github.io@1c055a4b2500a9a0ba6be04f9b5ec7361bcf84e1',
              'PR13_EXPORTER_AUTHORITY=Antikythera-Studios/blender-json-addon@b9c6844193074f8c21b35513052d61c82cc2c207; OUTPUT=.json',
              'PR13_RIG_AUTHORITY=Antikythera-Studios/atk-resources@1d0455bc3d87b613be77c43250363220facad19f; FILE=EpicFight Animation Rig.blend; BLOB=0f093f8e3f29281a5b8d248d6ce6d5653f7cf22a',
              'PR13_DCC_BOUNDARY=CUSTOM_COMBAT_ANIMATION=BLENDER_AUTHORITY; BLOCKBENCH=CONCEPT_REFERENCE_MODEL_HANDOFF_ONLY; DIRECT_BLOCKBENCH_EPIC_FIGHT_EXPORT=FORBIDDEN',
              'PR13_MAPPING_TEXTURE_POLICY=EXPLICIT_CALLER_PROVIDED_BONE_MAPPING_AND_TEXTURE_REFERENCES; NO_PROVIDER_DATA_INVENTION; FAIL_CLOSED',
              'PR13_TARGET_EXACT_RUNTIME=FACTORY_NEOFORGE_21.1.248; UPSTREAM_RELEASE_TESTED_NEOFORGE_21.1.219; COMPATIBILITY=UNPROVEN',
              'PR13_KNOWN_RUNTIME_RISK=Antikythera-Studios/epicfight#2572; MULTIPLAYER_ANIMATION_HANDLING; OPEN_AT_AUDIT',
              'PR13_FINAL_PR_RUN=34655382770; SUCCESS; CONTRACT=9_OF_9_PASS; REGRESSIONS=60_OF_60_PASS; BUNDLE=PASS; WHITESPACE=PASS',
              'PR13_PREMERGE_SONAR=QUALITY_GATE_PASS; 3_NEW_ISSUES; 0_SECURITY_HOTSPOTS; 0.0_PERCENT_DUPLICATION_ON_NEW_CODE',
              'PR13_POSTMERGE_ACTIONS=27_OF_27_SUCCESS; HEAD=9978bcf44a0a4a091b7d6786b51058c8d770f344',
              'PR13_POSTMERGE_SONAR=CHECK_103448526392; ANALYSIS_FAILED; CONCLUSION_CANCELLED; NOT_PASS',
              'PR13_RUNTIME_EVIDENCE=CONTRACT_AND_EXTERNAL_DCC_HANDOFF_PASS; REAL_BLENDER_EXPORT_PLAYBACK_UNPROVEN; TARGET_EXACT_EPIC_FIGHT_RUNTIME_UNPROVEN; MULTIPLAYER_CORRECTNESS_UNPROVEN; FULL_MODPACK_RUNTIME_UNPROVEN; runtimeEvidence=UNPROVEN; runtimeValidated=false; f4I6Evidence=false',
              'PR13_STATE=MERGED_CONTRACT_HANDOFF_GREEN; EXTERNAL_DCC_AUTHORITY_AUDITED; PROVIDER_RUNTIME_UNPROVEN; NEXT=PR14_UNIFIED_QA_EXPORT_MANIFEST',
              '',
          ]

          frontier_hits = [i for i, line in enumerate(lines) if line.startswith('ENGINEERING_FRONTIER=')]
          if len(frontier_hits) != 1:
              raise SystemExit(f'ENGINEERING_FRONTIER: expected exactly one entry, found {len(frontier_hits)}')
          lines[frontier_hits[0]:frontier_hits[0]] = block

          required_preserved = {
              'I6_REAL_HANDOFF=NOT_COMPLETE',
              'I7_STATE=BLOCKED_BY_F4_REAL_I6_HANDOFF',
          }
          missing = sorted(required_preserved.difference(lines))
          if missing:
              raise SystemExit(f'PR13 closeout would violate blockers: missing {missing}')

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit STATUS-only closeout and remove materializer
        shell: bash
        env:
          BASE_SHA: 9978bcf44a0a4a091b7d6786b51058c8d770f344
        run: |
          rm .github/workflows/pr13-closeout-status-materializer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md .github/workflows/pr13-closeout-status-materializer.yml
          git diff --cached --check
          git commit -m "docs(status): close PR13 and advance art frontier"
          test "$(git diff --name-only "$BASE_SHA"..HEAD)" = "STATUS.md"
          git diff --check "$BASE_SHA"..HEAD
          git push origin HEAD
