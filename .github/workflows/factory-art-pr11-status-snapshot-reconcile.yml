name: Factory Art PR11 Status Snapshot Reconcile

on:
  push:
    branches:
      - docs/art-pr11-closeout-status
    paths:
      - .github/workflows/factory-art-pr11-status-snapshot-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/art-pr11-closeout-status
          fetch-depth: 2
      - name: Reconcile PR11 STATUS snapshot
        run: |
          python3 .github/scripts/pr11-status-snapshot-reconcile.py
          git diff --check -- STATUS.md
      - name: Commit reconciled STATUS
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add STATUS.md
          git commit -m "docs(art): reconcile PR11 status snapshot"
          git push origin HEAD:docs/art-pr11-closeout-status
