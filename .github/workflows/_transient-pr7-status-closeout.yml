name: Transient PR7 STATUS Closeout

on:
  push:
    branches:
      - docs/art-pr7-closeout-status
    paths:
      - '.github/workflows/_transient-pr7-status-closeout.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch STATUS deterministically
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('STATUS.md')
          lines = path.read_text().splitlines()

          def set_value(key, value):
              prefix = key + '='
              matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              if len(matches) != 1:
                  raise SystemExit(f'{key}: expected exactly one line, found {len(matches)}')
              lines[matches[0]] = prefix + value

          set_value('FACTORY_PHASE', 'ART_PR7_AZURELIB_ADAPTER_MERGED_TARGETED_AND_ACTIONS_GREEN_REFERENCE_ONLY_RUNTIME_UNPROVEN_STATUS_CLOSEOUT')
          set_value('CURRENT_BRANCH', 'docs/art-pr7-closeout-status')
          set_value('CURRENT_MAIN_BEFORE_STATUS_UPDATE', 'c77ab427b4b993061002ff5b6f9001a8c772f7c3')
          set_value('HEAD_AT_LAST_GREEN_VERIFICATION', 'c77ab427b4b993061002ff5b6f9001a8c772f7c3')
          set_value('OPEN_PRS_AT_STATUS_WRITE', 'PR43_MERGED; PR7_STATUS_CLOSEOUT_PR_PENDING; NO_OTHER_OPEN_PRS')
          set_value('FULL_SKILL_CURRENT_MAIN', 'c77ab427b4b993061002ff5b6f9001a8c772f7c3')
          set_value('FULL_SKILL_CURRENT_MAIN_RUN', '34559305513; FULL_SKILL_COVERAGE_PASS; M5_PASS; M6_PASS; MIGRATED_REGRESSIONS_PASS')
          set_value('FACTORY_CURRENT_GOVERNANCE_RUN', '34559305595; PASS')
          set_value('ART_FRONTIER', 'M4_M5_M6_M8_M3_I1_BASELINE_GREEN; PR5_GENERIC_ANIMATION_MERGED; PR6_GECKOLIB_ADAPTER_MERGED_REFERENCE_ONLY_RUNTIME_UNPROVEN; PR7_AZURELIB_ADAPTER_MERGED_TARGETED_AND_ACTIONS_GREEN_REFERENCE_ONLY_RUNTIME_UNPROVEN; NEXT=PR8_EPIC_FIGHT_RIG_ANIMATION_AUDIT')
          set_value('FACTORY_GLOBAL_SONAR_AT_CURRENT_MAIN', 'ANALYSIS_FAILED; CHECK=103139013578; CONCLUSION=CANCELLED; DO_NOT_LABEL_FACTORY_GLOBALLY_GREEN; PREEXISTING_ON_PR7_BASE_449785d3_CHECK_103135732426')
          set_value('FACTORY_GLOBAL_SONAR_BLOCKER', 'MAIN_BRANCH_ANALYSIS_FAILED_ON_CURRENT_MAIN; PR7_ACTIONS_SUCCESS_DOES_NOT_CLEAR_GLOBAL_SONAR_STATE')
          set_value('USER_STOP_BOUNDARY', 'HISTORICAL_BOUNDARY_CLEARED_BY_USER_PROSSIGA; PR7_EXECUTION_COMPLETED_AFTER_BOUNDARY')
          set_value('NEXT_ACTION', 'BEGIN_PR8_EPIC_FIGHT_RIG_ANIMATION_AUDIT_AGAINST_PHYSICAL_EPIC_FIGHT_21.17.3.1; FIRST_RECHECK_PHYSICAL_MODLIST_CURRENT_REPO_BRANCHES_PRS_STATUS_AND_PROVIDER_API; DO_NOT_CLAIM_REAL_HANDOFF; F4/I6_REMAINS_NOT_COMPLETE; I7_REMAINS_BLOCKED')

          anchor = 'PR7_PHYSICAL_PROVIDER_TARGET=AZURELIB_3.1.11; JAR=azurelib-neo-1.21.1-3.1.11.jar'
          anchor_matches = [i for i, line in enumerate(lines) if line == anchor]
          if len(anchor_matches) != 1:
              raise SystemExit(f'PR7 physical provider anchor: expected 1, found {len(anchor_matches)}')
          if any(line.startswith('PR7_AZURELIB_PR=') for line in lines):
              raise SystemExit('PR7 closeout block already present; refusing duplicate patch')

          block = [
              'PR7_AZURELIB_PR=43',
              'PR7_AZURELIB_FINAL_HEAD=897c9a3f283489f7ef192767efce0cc7af76b3d4',
              'PR7_AZURELIB_MERGE_COMMIT=c77ab427b4b993061002ff5b6f9001a8c772f7c3',
              'PR7_AZURELIB_RUNTIME_AUTHORITY=AzureDoom/AzureLib@74ca485d43089c6953492ae7a10fc896eda30385; VERSION=3.1.11',
              'PR7_AZURELIB_AUTHORING_AUTHORITY=azurelib_utils_2.1.5; AzureDoom/AzureLib@4aac02dcefff5440874b3ec64871a1cd0feffadf',
              'PR7_AZURELIB_ANIMATION_FORMAT_VERSION=1.8.0',
              'PR7_AZURELIB_GEO_FORMATS=1.12.0;1.14.0;1.21.0',
              'PR7_AZURELIB_IK_BOUNDARY=AUTHORING_ONLY; azureIKChains_REJECTED_FROM_RUNTIME_GEO',
              'PR7_AZURELIB_UNKNOWN_EASING_POLICY=FAIL_CLOSED; NO_SILENT_RUNTIME_LINEAR_FALLBACK',
              'PR7_AZURELIB_MULTI_EFFECT_POLICY=SOUND_AND_PARTICLE_ARRAYS_AT_SINGLE_TIMESTAMP_REJECTED_UNPROVEN',
              'PR7_AZURELIB_GOLDEN_EVIDENCE=REFERENCE_ONLY; runtimeEvidence=UNPROVEN; runtimeValidated=false; f4I6Evidence=false',
              'PR7_AZURELIB_PROVIDER_BOUNDARY=AZURELIB_3_1_11_RUNTIME; BLOCKBENCH_AZURELIB_UTILS_2_1_5_AUDITED; NO_GECKOLIB_AUTOCONVERSION; BBMODEL_SOURCE_AUTHORITY',
              'PR7_AZURELIB_PREMERGE_PR7_RUN=34559199913; SUCCESS',
              'PR7_AZURELIB_PREMERGE_PR6_REGRESSION_RUN=34559199891; SUCCESS',
              'PR7_AZURELIB_PREMERGE_PR5_REGRESSION_RUN=34559199912; SUCCESS',
              'PR7_AZURELIB_PREMERGE_GOVERNANCE_RUN=34559199877; SUCCESS',
              'PR7_AZURELIB_PREMERGE_FULL_SKILL_RUN=34559199870; SUCCESS',
              'PR7_AZURELIB_POSTMERGE_PR7_RUN=34559305586; SUCCESS',
              'PR7_AZURELIB_POSTMERGE_PR6_REGRESSION_RUN=34559305499; SUCCESS',
              'PR7_AZURELIB_POSTMERGE_PR5_REGRESSION_RUN=34559305584; SUCCESS',
              'PR7_AZURELIB_POSTMERGE_GOVERNANCE_RUN=34559305595; SUCCESS',
              'PR7_AZURELIB_POSTMERGE_FULL_SKILL_RUN=34559305513; SUCCESS',
              'PR7_AZURELIB_POSTMERGE_ACTIONS=18_OF_18_SUCCESS',
              'PR7_AZURELIB_POSTMERGE_SONAR=CHECK_103139013578; ANALYSIS_FAILED; CONCLUSION_CANCELLED; NOT_COUNTED_AS_PASS; PREEXISTING_ON_BASE_449785d3_CHECK_103135732426',
              'PR7_STATE=MERGED_TARGETED_AND_ACTIONS_GREEN_REFERENCE_ONLY_RUNTIME_UNPROVEN; GLOBAL_SONAR_NOT_PASS_PREEXISTING',
              'PR8_PHYSICAL_PROVIDER_TARGET=EPIC_FIGHT_21.17.3.1; JAR=epic-fight-21.17.3.1-mc1.21.1-neoforge.jar',
          ]
          idx = anchor_matches[0] + 1
          lines[idx:idx] = block
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Verify STATUS closeout before commit
        run: |
          grep -Fx 'PR7_AZURELIB_POSTMERGE_ACTIONS=18_OF_18_SUCCESS' STATUS.md
          grep -Fx 'PR7_AZURELIB_GOLDEN_EVIDENCE=REFERENCE_ONLY; runtimeEvidence=UNPROVEN; runtimeValidated=false; f4I6Evidence=false' STATUS.md
          grep -Fx 'FACTORY_GLOBAL_SONAR_AT_CURRENT_MAIN=ANALYSIS_FAILED; CHECK=103139013578; CONCLUSION=CANCELLED; DO_NOT_LABEL_FACTORY_GLOBALLY_GREEN; PREEXISTING_ON_PR7_BASE_449785d3_CHECK_103135732426' STATUS.md
          grep -Fx 'I6_REAL_HANDOFF=NOT_COMPLETE' STATUS.md
          grep -Fx 'I7_STATE=BLOCKED_BY_F4_REAL_I6_HANDOFF' STATUS.md
          grep -Fx 'PR8_PHYSICAL_PROVIDER_TARGET=EPIC_FIGHT_21.17.3.1; JAR=epic-fight-21.17.3.1-mc1.21.1-neoforge.jar' STATUS.md
          git diff --check
      - name: Commit STATUS and self-remove
        run: |
          git rm .github/workflows/_transient-pr7-status-closeout.yml
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "STATUS.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STATUS.md
          git commit -m 'docs(status): close out AzureLib PR7'
          git push origin HEAD:docs/art-pr7-closeout-status
