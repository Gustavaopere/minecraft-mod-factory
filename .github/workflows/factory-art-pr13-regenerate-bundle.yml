name: Factory Art PR13 Regenerate Bundle

permissions:
  contents: write

on:
  push:
    branches:
      - feat/art-pr13-external-dcc-epic-fight
    paths:
      - '.github/workflows/factory-art-pr13-regenerate-bundle.yml'

jobs:
  regenerate-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR13 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Provision Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate deterministic standalone bundle
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --write
      - name: Verify deterministic standalone bundle
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --check
      - name: Reject whitespace errors
        run: git diff --check
      - name: Commit regenerated standalone only
        run: |
          if git diff --quiet -- art/tooling/blockbench/asset-toolkit/asset_toolkit.js; then
            echo 'asset_toolkit.js already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/tooling/blockbench/asset-toolkit/asset_toolkit.js
          git diff --cached --name-only
          test "$(git diff --cached --name-only)" = "art/tooling/blockbench/asset-toolkit/asset_toolkit.js"
          git commit -m 'build(art): regenerate PR13 standalone bundle'
          git push origin HEAD:${GITHUB_REF_NAME}
