name: Temporary I2 Provider Transport

on:
  push:
    branches:
      - chore/migrate-i2-modlist-authority
    paths:
      - 'migration/.i2-migration-trigger'

permissions:
  contents: write

jobs:
  transport-provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/migrate-i2-modlist-authority
          fetch-depth: 0

      - name: Fetch pinned historical provider catalog
        env:
          SOURCE_SHA: b4861c6146a95d8f02018d8e46caca543895b0be
        run: |
          set -euo pipefail
          mkdir -p engineering/catalog/physical-modlist
          url="https://raw.githubusercontent.com/Gustavaopere/neoforge-rpg-skilltree/${SOURCE_SHA}/PROJECT-INSTRUCTIONS/engineering/catalog/physical-modlist/providers-2026-09-09.json"
          curl --fail --location --retry 3 --retry-all-errors "$url" -o engineering/catalog/physical-modlist/providers-2026-09-09.json
          test "$(git hash-object engineering/catalog/physical-modlist/providers-2026-09-09.json)" = "f3df6f7e56b7060b0f5c790c27acae7003006139"

      - name: Validate committed physical snapshot with provider catalog
        run: |
          set -euo pipefail
          python3 engineering/tooling/import-physical-modlist.py \
            --check engineering/catalog/physical-modlist/snapshot-2026-09-09.json \
            --providers engineering/catalog/physical-modlist/providers-2026-09-09.json

      - name: Commit provider blob into Factory object database
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engineering/catalog/physical-modlist/providers-2026-09-09.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(engineering): transport historical I2 provider catalog"
          git push origin HEAD:chore/migrate-i2-modlist-authority
