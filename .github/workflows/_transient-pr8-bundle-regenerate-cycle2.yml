name: Transient PR8 Cycle2 Bundle Regenerate

on:
  push:
    branches:
      - feat/art-pr8-neoforge-native-animation

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate deterministic standalone bundle
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --write
      - name: Verify bundle and whitespace
        run: |
          node art/tooling/blockbench/asset-toolkit/build_toolkit_bundle.js --check
          git diff --check
      - name: Commit bundle and remove transient workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/_transient-pr8-bundle-regenerate-cycle2.yml
          git add art/tooling/blockbench/asset-toolkit/asset_toolkit.js
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/_transient-pr8-bundle-regenerate-cycle2.yml' 'art/tooling/blockbench/asset-toolkit/asset_toolkit.js' | sort)"
          test "$changed" = "$expected"
          git commit -m 'build(art): regenerate PR8 cycle2 standalone bundle'
          git push origin HEAD:feat/art-pr8-neoforge-native-animation
