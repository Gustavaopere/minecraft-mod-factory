name: Factory Fix M6 Materializer Once

on:
  push:
    branches:
      - feat/full-skill-migration
    paths:
      - '.github/workflows/factory-fix-m6-materializer-once.yml'

permissions:
  contents: write

jobs:
  patch-materializer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Factory branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch only frozen M6 relocation rules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('migration/full-skill-migration/migrate.py')
          text = path.read_text(encoding='utf-8')
          anchor = '    if relative.endswith("PROJECT-OVERLAY.md"):\n'
          marker_a = '    if relative == "golden-samples/validate_golden_samples.js":\n'
          marker_b = '    if relative == "golden-samples/validate_reference_evidence.js":\n'
          addition = (
              marker_a
              + '        text = text.replace("../art/tooling/blockbench/asset-toolkit/asset_toolkit.js", "../tooling/blockbench/asset-toolkit/asset_toolkit.js")\n'
              + '        if "../art/tooling/blockbench/asset-toolkit/asset_toolkit.js" in text:\n'
              + '            raise RuntimeError("M6 golden validator relocation remained unresolved")\n'
              + marker_b
              + '        text = text.replace("../scripts/validate_golden_reference_rendered_edges.js", "../tooling/validators/validate_golden_reference_rendered_edges.js")\n'
              + '        if "../scripts/validate_golden_reference_rendered_edges.js" in text:\n'
              + '            raise RuntimeError("M6 evidence validator relocation remained unresolved")\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'expected exactly one PROJECT-OVERLAY insertion anchor, found {text.count(anchor)}')
          if marker_a in text or marker_b in text:
              raise SystemExit('M6 relocation rule statements already present; refusing duplicate patch')
          path.write_text(text.replace(anchor, addition + anchor, 1), encoding='utf-8')
          PY
          python -m py_compile migration/full-skill-migration/migrate.py
          git diff --check

      - name: Commit source fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/factory-fix-m6-materializer-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add migration/full-skill-migration/migrate.py .github/workflows/factory-fix-m6-materializer-once.yml
          git commit -m 'fix(migration): relocate M6 Golden Sample imports'
          git push origin HEAD:feat/full-skill-migration
