name: Factory Art PR11 Status Closeout Retry

on:
  push:
    branches:
      - docs/art-pr11-closeout-status
    paths:
      - .github/workflows/factory-art-pr11-status-closeout-retry.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/art-pr11-closeout-status
          fetch-depth: 2
      - name: Apply audited PR11 STATUS patch
        shell: bash
        run: |
          python3 .github/pr11-closeout-materialize.py
          git diff --check -- STATUS.md
      - name: Commit STATUS closeout
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add STATUS.md
          git commit -m "docs(art): close PR11 Animated Java status"
          git push origin HEAD:docs/art-pr11-closeout-status
