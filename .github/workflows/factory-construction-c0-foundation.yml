name: Factory Construction C0 Foundation

on:
  push:
    branches:
      - main
      - feat/construction-c0-foundation
  pull_request:
    branches:
      - main
    paths:
      - '.gitmodules'
      - '.github/workflows/factory-construction-c0-foundation.yml'
      - 'construction/**'

permissions:
  contents: read

jobs:
  c0-foundation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with upstream snapshots
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          submodules: recursive
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install hashed Construction test environment
        run: python3 -m pip install --require-hashes --no-deps -r construction/upstream/harness/schematica-test-lock.txt
      - name: Run construction C0 contract tests
        run: python3 -m unittest discover -s construction/tests -p 'test_*.py' -v
      - name: Run construction C0 validator
        run: python3 construction/scripts/validate_c0.py
      - name: Check construction C0 whitespace
        run: git diff --check HEAD^ -- construction .github/workflows/factory-construction-c0-foundation.yml
