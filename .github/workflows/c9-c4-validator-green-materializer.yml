name: C9 C4 Validator GREEN Materializer

on:
  push:
    branches:
      - feat/construction-c9-agent-mcp

permissions:
  contents: write

jobs:
  materialize-green:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/construction-c9-agent-mcp
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Implement C4 public validator and C7 delegation
        env:
          C4_VALIDATOR_B64: 
          C7_REPLACEMENT_B64: 
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          c4_path = Path("construction/core/modpack_registry.py")
          text = c4_path.read_text(encoding="utf-8")
          if "PROPERTY_NAME_RE = " not in text:
              text = text.replace(
                  'MOD_ID_RE = re.compile(r"^[a-z][a-z0-9_.-]*$")\n',
                  'MOD_ID_RE = re.compile(r"^[a-z][a-z0-9_.-]*$")\nPROPERTY_NAME_RE = re.compile(r"^[a-z0-9_]+$")\nSHA256_RE = re.compile(r"^[0-9a-f]{64}$")\n',
                  1,
              )
          marker = "\ndef build_modpack_registry(physical_snapshot, static_indexes, runtime_snapshot):\n"
          if marker not in text:
              raise SystemExit("C4 build_modpack_registry marker missing")
          if "def validate_modpack_registry(" in text:
              raise SystemExit("C4 public validator already exists")
          validator = base64.b64decode(__import__("os").environ["C4_VALIDATOR_B64"]).decode("utf-8")
          text = text.replace(marker, validator + marker, 1)
          c4_path.write_text(text, encoding="utf-8")

          c7_path = Path("construction/core/structural_qa.py")
          text = c7_path.read_text(encoding="utf-8")
          start = text.index("def _validate_registry(registry: Any) -> dict[str, Any]:\n")
          end = text.index("\ndef _position_key(", start)
          replacement = base64.b64decode(__import__("os").environ["C7_REPLACEMENT_B64"]).decode("utf-8")
          text = text[:start] + replacement + text[end + 1:]
          c7_path.write_text(text, encoding="utf-8")
          PY

      - name: Run focused C4 C7 GREEN
        run: >-
          python3 -m unittest
          construction/tests/test_c4_modpack_registry.py
          construction/tests/test_c7_registry_authority.py
          construction/tests/test_c7_architecture_qa.py
          -v

      - name: Check focused whitespace
        run: >-
          git diff --check --
          construction/core/modpack_registry.py
          construction/core/structural_qa.py
          construction/tests/test_c4_modpack_registry.py
          construction/tests/test_c7_registry_authority.py

      - name: Commit verified GREEN and remove materializer
        run: |
          rm .github/workflows/c9-c4-validator-green-materializer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add construction/core/modpack_registry.py construction/core/structural_qa.py .github/workflows/c9-c4-validator-green-materializer.yml
          git diff --cached --check
          git commit -m "refactor(construction): centralize C4 registry validation"
          git push origin HEAD:feat/construction-c9-agent-mcp
