name: PR9 Compatibility Correction

on:
  push:
    branches:
      - feat/art-pr9-easy-model-entities

permissions:
  contents: write

jobs:
  correct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/art-pr9-easy-model-entities
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Make compatibility expectation authoritative
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('art/tooling/blockbench/asset-toolkit/asset_toolkit.easy_model_entities_pr9.test.js')
          text = path.read_text()
          text = text.replace(
              "test('PR9 registers the official Easy Model Entities 1.0.0 exporter for audited Blockbench 5.1.6', () => {",
              "test('PR9 registers the official Easy Model Entities 1.0.0 exporter with its declared Blockbench minimum', () => {")
          text = text.replace(
              "  assert.deepEqual(definition.blockbenchCompatibility?.auditedExact, ['5.1.6']);",
              "  assert.equal(definition.blockbenchCompatibility?.minInclusive, '4.9.0');")
          text = text.replace(
              "  const wrongEditor = availableContext();\n  wrongEditor.blockbenchVersion = '5.1.5';\n  assert.equal(core.resolveProviderProfile(ENTITY_PROFILE_ID, wrongEditor).status, 'UNAVAILABLE');",
              "  const supportedEarlierEditor = availableContext();\n  supportedEarlierEditor.blockbenchVersion = '5.1.5';\n  assert.equal(core.resolveProviderProfile(ENTITY_PROFILE_ID, supportedEarlierEditor).status, 'AVAILABLE');\n\n  const unsupportedEditor = availableContext();\n  unsupportedEditor.blockbenchVersion = '4.8.9';\n  assert.equal(core.resolveProviderProfile(ENTITY_PROFILE_ID, unsupportedEditor).status, 'UNAVAILABLE');")
          path.write_text(text)
          PY
      - name: Require RED before compatibility implementation
        working-directory: art/tooling/blockbench/asset-toolkit
        run: |
          set +e
          node --test asset_toolkit.easy_model_entities_pr9.test.js
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected PR9 compatibility RED but tests passed.' >&2
            exit 1
          fi
      - name: Implement declared Blockbench minimum and regenerate bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('art/tooling/blockbench/asset-toolkit/core/extension-registry/extension_registry.js')
          text = path.read_text()
          old = "    blockbenchCompatibility: Object.freeze({auditedExact: Object.freeze(['5.1.6'])}),\n    mcpPolicy: 'ALLOWLIST',\n    providerFamily: 'easy_model_entities',"
          new = "    blockbenchCompatibility: Object.freeze({minInclusive: '4.9.0'}),\n    mcpPolicy: 'ALLOWLIST',\n    providerFamily: 'easy_model_entities',"
          if old not in text:
            raise SystemExit('Expected PR9 compatibility block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cd art/tooling/blockbench/asset-toolkit
          node build_toolkit_bundle.js --write
      - name: Require GREEN after compatibility implementation
        working-directory: art/tooling/blockbench/asset-toolkit
        run: |
          node --test asset_toolkit.easy_model_entities_pr9.test.js
          node build_toolkit_bundle.js --check
      - name: Remove transient workflow and commit correction
        run: |
          git rm .github/workflows/pr9-compatibility-correction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/tooling/blockbench/asset-toolkit/asset_toolkit.easy_model_entities_pr9.test.js
          git add art/tooling/blockbench/asset-toolkit/core/extension-registry/extension_registry.js
          git add art/tooling/blockbench/asset-toolkit/asset_toolkit.js
          git commit -m 'fix(art): honor EME Blockbench minimum version'
          git push origin HEAD:feat/art-pr9-easy-model-entities
