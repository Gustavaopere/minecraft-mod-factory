name: C9 Plan Self Review Materializer

on:
  push:
    branches:
      - feat/construction-c9-agent-mcp

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/construction-c9-agent-mcp
          fetch-depth: 0
      - name: Apply plan self-review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/superpowers/plans/2026-09-11-construction-c9-agent-mcp.md')
          text = path.read_text(encoding='utf-8')
          old = '''    # Continue with exact field/type/linkage/order/fingerprint checks from the approved C9 spec.\n    return errors'''
          new = '''    physical = registry.get("physical")\n    runtime = registry.get("runtime")\n    static_index = registry.get("static_index")\n    blocks = registry.get("blocks")\n    if not isinstance(physical, dict):\n        errors.append("registry.physical must be an object")\n    if not isinstance(runtime, dict):\n        errors.append("registry.runtime must be an object")\n    if not isinstance(static_index, dict):\n        errors.append("registry.static_index must be an object")\n    if not isinstance(blocks, list):\n        errors.append("registry.blocks must be an array")\n    # The implementation then performs every exact C4 linkage, block/state,\n    # canonical-order, and content_sha256 check enumerated below in this step.\n    return errors'''
          if old not in text:
              raise SystemExit('expected Task 2 placeholder block not found')
          text = text.replace(old, new, 1)
          old2 = '''Each `@mcp.tool()` function is a thin call into the matching façade method. It returns JSON-serializable dicts only. Convert `C9Error` into the SDK-supported tool error form with the exact stable payload from `C9Error.payload()`; unexpected exceptions return sanitized `INTERNAL_ERROR` and log only a stable message to stderr.'''
          new2 = '''Each `@mcp.tool()` function is a thin call into the matching façade method. It returns JSON-serializable dicts only. For anticipated `C9Error`, serialize `C9Error.payload()` with `json.dumps(payload, sort_keys=True, separators=(",", ":"), ensure_ascii=False)` and raise `ToolError` with that canonical JSON string. MCP SDK v2.2.0 then returns `is_error=true` with textual content and `structured_content=None`; stdio tests must parse only the JSON suffix after the SDK's `Error executing tool <name>:` prefix. For an unexpected exception, log only `C9 internal tool failure` to stderr and raise `ToolError('{"code":"INTERNAL_ERROR","message":"internal C9 failure"}') from None`, never the exception text.'''
          if old2 not in text:
              raise SystemExit('expected Task 8 error paragraph not found')
          text = text.replace(old2, new2, 1)
          marker = '''Because the SDK v2.2.0 resource contract converts `bytes` to `BlobResourceContents`, real client tests must verify exact decoded bytes. The descriptor returned by tools remains authoritative for the artifact's specific media type (`image/svg+xml`, `application/json`, or `application/octet-stream`); the template transport MIME remains generic because one template serves mixed binary kinds.'''
          replacement = marker + '''\n\nThe dynamic artifact endpoint is a resource template and therefore appears in `resources/templates/list`, not as one concrete entry per artifact in `resources/list`. `ArtifactStore.list_descriptors()` is the deterministic current-artifact listing required by the C9 design; concrete resource reads still use the returned content-addressed URIs. Do not dynamically register per-artifact SDK resources merely to populate `resources/list`.'''
          if marker not in text:
              raise SystemExit('expected resource-template paragraph not found')
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/c9-plan-self-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-09-11-construction-c9-agent-mcp.md .github/workflows/c9-plan-self-review.yml
          git commit -m "docs(construction): self-review C9 implementation plan"
          git push origin HEAD:feat/construction-c9-agent-mcp
