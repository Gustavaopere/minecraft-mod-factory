name: Factory Full Skill Materializer

on:
  push:
    branches:
      - feat/full-skill-migration
    paths:
      - 'migration/full-skill-migration/migrate.py'
      - 'migration/full-skill-migration/m5_finalize.py'
      - '.github/workflows/factory-full-skill-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Factory branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout frozen historical skills source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rpg-source
          git init -q /tmp/rpg-source
          git -C /tmp/rpg-source remote add origin https://github.com/Gustavaopere/neoforge-rpg-skilltree.git
          git -C /tmp/rpg-source fetch --depth=1 origin 2ecea4178aa7ac80f99955ab045e296da25376ec
          git -C /tmp/rpg-source checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/rpg-source rev-parse HEAD)" = "2ecea4178aa7ac80f99955ab045e296da25376ec"

      - name: Materialize frozen skill tree
        run: >-
          python migration/full-skill-migration/migrate.py
          --source-root /tmp/rpg-source/PROJECT-INSTRUCTIONS/skills
          --factory-root .

      - name: Finalize M5 neutral package identity
        run: python migration/full-skill-migration/m5_finalize.py --factory-root .

      - name: Regenerate neutral Asset Toolkit bundle
        run: node art/tooling/blockbench/asset-toolkit/build_toolkit_bundle.js

      - name: Validate full source coverage before commit
        run: >-
          python migration/full-skill-migration/validate.py
          --source-root /tmp/rpg-source/PROJECT-INSTRUCTIONS/skills
          --factory-root .

      - name: Validate M5 naming before commit
        run: python -m unittest migration/full-skill-migration/test_m5_naming.py -v

      - name: Validate M6 Golden Sample relocation before commit
        run: python -m unittest migration/full-skill-migration/test_m6_golden_relocation.py -v

      - name: Check generated diff whitespace
        run: git diff --check

      - name: Commit materialized migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && test -z "$(git ls-files --others --exclude-standard)"; then
            echo 'No materialization changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art skills migration/provenance
          git commit -m 'feat(migration): materialize full historical skill tree'
          git push origin HEAD:feat/full-skill-migration
