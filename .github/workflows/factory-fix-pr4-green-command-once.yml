name: Factory Fix PR4 Green Command Once

on:
  push:
    branches:
      - feat/full-skill-migration
    paths:
      - '.github/workflows/factory-fix-pr4-green-command-once.yml'

permissions:
  contents: write

jobs:
  patch-command:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Factory branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct bundle write invocation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/factory-pr4-texture-compare-green-once.yml')
          text = path.read_text(encoding='utf-8')
          old = '        run: node build_toolkit_bundle.js\n'
          new = '        run: node build_toolkit_bundle.js --write\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one non-writing bundle invocation, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit command fix and remove patcher
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/factory-fix-pr4-green-command-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/factory-pr4-texture-compare-green-once.yml .github/workflows/factory-fix-pr4-green-command-once.yml
          git commit -m 'fix(ci): write regenerated Asset Toolkit bundle'
          git push origin HEAD:feat/full-skill-migration
