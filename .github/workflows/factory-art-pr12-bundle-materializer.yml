name: Factory Art PR12 Bundle Materializer

permissions:
  contents: write

on:
  push:
    branches:
      - feat/art-pr12-player-profiles
    paths:
      - '.github/workflows/factory-art-pr12-bundle-materializer.yml'

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Factory source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Provision Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate deterministic standalone bundle
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --write
      - name: Verify corrected PR12 contract against generated bundle
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.player_profiles_pr12.test.js
      - name: Verify deterministic bundle is current
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js --check
      - name: Verify only bundle changed and whitespace is clean
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "art/tooling/blockbench/asset-toolkit/asset_toolkit.js"
      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/tooling/blockbench/asset-toolkit/asset_toolkit.js
          git diff --cached --quiet && { echo 'Expected generated bundle change'; exit 1; }
          git commit -m "build(art): regenerate corrected PR12 standalone bundle"
          git push origin HEAD:feat/art-pr12-player-profiles
