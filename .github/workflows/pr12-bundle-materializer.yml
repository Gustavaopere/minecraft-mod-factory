name: PR12 Bundle Materializer

on:
  push:
    branches:
      - feat/art-pr12-player-profiles
    paths:
      - art/tooling/blockbench/asset-toolkit/core/provider-adapter/player_profiles_adapter.js
      - art/tooling/blockbench/asset-toolkit/build_toolkit_bundle.js
      - .github/workflows/pr12-bundle-materializer.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR12 branch
        uses: actions/checkout@v4
        with:
          ref: feat/art-pr12-player-profiles
          fetch-depth: 2

      - name: Provision Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate standalone bundle
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node build_toolkit_bundle.js

      - name: Verify corrected PR12 contract
        working-directory: art/tooling/blockbench/asset-toolkit
        run: node --test asset_toolkit.player_profiles_pr12.test.js

      - name: Commit bundle and remove materializer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/tooling/blockbench/asset-toolkit/asset_toolkit.js
          git rm .github/workflows/pr12-bundle-materializer.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No materialization changes produced.' >&2; exit 1; }
          git commit -m 'build(art): regenerate corrected PR12 standalone bundle'
          git push origin HEAD:feat/art-pr12-player-profiles
