name: Factory Construction C11 Complex Modded Golden

on:
  push:
    branches:
      - feat/construction-c11-complex-modded-golden
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/factory-construction-c11-complex-modded-golden.yml'
      - '.github/workflows/factory-sonar-ci.yml'
      - 'engineering/contracts/target-baseline.json'
      - 'engineering/contracts/MOD-SPEC-CONTRACT.md'
      - 'engineering/schemas/mod-spec.schema.json'
      - 'engineering/schemas/test-manifest.schema.json'
      - 'engineering/schemas/compatibility-matrix.schema.json'
      - 'engineering/templates/neoforge-mod/**'
      - 'engineering/tooling/import-physical-modlist.py'
      - 'engineering/tooling/resolve-neoforge-campaign-target.py'
      - 'engineering/tooling/scaffolder/**'
      - 'engineering/tooling/test-harness/**'
      - 'engineering/tests/test_neoforge_campaign_target.py'
      - 'engineering/tests/fixtures/i3-golden-mod-spec.json'
      - 'engineering/tests/fixtures/i4-golden-mod-spec.json'
      - 'engineering/tests/fixtures/i9-machine-mod-spec.json'
      - 'engineering/tests/golden/i3-golden-mod/**'
      - 'engineering/examples/mod-spec.example.json'
      - 'engineering/examples/test-manifest.example.json'
      - 'engineering/examples/compatibility-matrix.example.json'
      - 'skills/VERSION-AUTHORITY.md'
      - 'construction/fixtures/complex-modded-golden/**'
      - 'construction/tests/test_c11_complex_modded_golden.py'
      - 'construction/tests/test_c11_capture_path_security.py'
      - 'construction/tests/test_construction_final_physical_acceptance_gate.py'
      - 'construction/core/modpack_registry.py'
      - 'construction/runtime/neoforge-registry-probe/**'
      - 'construction/scripts/prepare_neoforge_registry_probe.py'
      - 'construction/README.md'
      - 'construction/docs/ARCHITECTURE.md'
      - 'migration/full-skill-migration/test_sonar_ci_contract.py'
      - 'docs/superpowers/specs/2026-09-12-construction-c11-complex-modded-golden-design.md'
      - 'docs/superpowers/specs/2026-09-13-construction-c11-registry-deferral-amendment.md'
      - 'docs/superpowers/plans/2026-09-12-construction-c11-complex-modded-golden.md'
      - 'docs/superpowers/plans/2026-09-13-construction-c11-registry-deferral-preflight.md'
      - 'docs/superpowers/specs/2026-09-13-construction-final-physical-acceptance-gate-design.md'
      - 'docs/superpowers/plans/2026-09-13-construction-final-physical-acceptance-gate.md'

permissions:
  contents: read

jobs:
  c11-preflight-contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with preserved upstreams
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Run NeoForge campaign target contract
        run: python3 -m unittest engineering/tests/test_neoforge_campaign_target.py -v

      - name: Run C11 deferred preflight contracts
        run: |
          python3 -m unittest \
            construction.tests.test_c11_complex_modded_golden.ConstructionC11ComplexModdedGoldenTest.test_deferred_capture_state_is_explicit_and_blocks_completion \
            construction.tests.test_c11_complex_modded_golden.ConstructionC11ComplexModdedGoldenTest.test_workflow_distinguishes_preflight_from_completion \
            construction.tests.test_c11_complex_modded_golden.ConstructionC11ComplexModdedGoldenTest.test_docs_define_deferred_c11_boundary \
            construction.tests.test_c11_complex_modded_golden.ConstructionC11ComplexModdedGoldenTest.test_pending_state_skips_completion_only_registry_assertion_in_aggregate_suites \
            construction.tests.test_c11_complex_modded_golden.ConstructionC11ComplexModdedGoldenTest.test_capture_helper_requires_every_physical_top_level_jar \
            construction.tests.test_c11_complex_modded_golden.ConstructionC11ComplexModdedGoldenTest.test_capture_helper_rejects_missing_runtime_snapshot_stably \
            construction.tests.test_c11_complex_modded_golden.ConstructionC11ComplexModdedGoldenTest.test_capture_helper_rejects_malformed_runtime_json_stably \
            construction.tests.test_c11_complex_modded_golden.ConstructionC11ComplexModdedGoldenTest.test_capture_helper_rejects_output_outside_workspace \
            construction.tests.test_c11_complex_modded_golden.ConstructionC11ComplexModdedGoldenTest.test_capture_helper_delegates_physical_sha_mismatch_to_c4 \
            construction.tests.test_c11_complex_modded_golden.ConstructionC11ComplexModdedGoldenTest.test_capture_helper_delegates_target_mismatch_to_c4 \
            construction.tests.test_c11_complex_modded_golden.ConstructionC11ComplexModdedGoldenTest.test_capture_cli_writes_canonical_revalidated_registry \
            -v
          python3 -m unittest construction/tests/test_c11_capture_path_security.py -v
          python3 -m unittest construction/tests/test_construction_final_physical_acceptance_gate.py -v

      - name: Run shared Sonar governance contract
        run: python3 migration/full-skill-migration/test_sonar_ci_contract.py

      - name: Check C11 preflight whitespace
        run: >-
          git diff --check HEAD^ HEAD --
          .github/workflows/factory-construction-c11-complex-modded-golden.yml
          .github/workflows/factory-sonar-ci.yml
          engineering/contracts/target-baseline.json
          engineering/contracts/MOD-SPEC-CONTRACT.md
          engineering/schemas/mod-spec.schema.json
          engineering/schemas/test-manifest.schema.json
          engineering/schemas/compatibility-matrix.schema.json
          engineering/templates/neoforge-mod
          engineering/tooling/resolve-neoforge-campaign-target.py
          engineering/tooling/scaffolder
          engineering/tooling/test-harness
          engineering/tests/test_neoforge_campaign_target.py
          engineering/tests/fixtures/i3-golden-mod-spec.json
          engineering/tests/fixtures/i4-golden-mod-spec.json
          engineering/tests/fixtures/i9-machine-mod-spec.json
          engineering/tests/golden/i3-golden-mod
          engineering/examples/mod-spec.example.json
          engineering/examples/test-manifest.example.json
          engineering/examples/compatibility-matrix.example.json
          skills/VERSION-AUTHORITY.md
          construction/fixtures/complex-modded-golden
          construction/tests/test_c11_complex_modded_golden.py
          construction/tests/test_c11_capture_path_security.py
          construction/tests/test_construction_final_physical_acceptance_gate.py
          construction/README.md
          construction/docs/ARCHITECTURE.md
          migration/full-skill-migration/test_sonar_ci_contract.py
          docs/superpowers/specs
          docs/superpowers/plans

  c11-preflight-probe:
    needs: c11-preflight-contracts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with preserved upstreams
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Run C4 runtime probe regressions
        run: python3 -m unittest construction/tests/test_c4_runtime_registry_probe.py -v

      - name: Materialize C4 NeoForge runtime registry probe
        run: >-
          python3 construction/scripts/prepare_neoforge_registry_probe.py
          --output .factory-ci/c11/runtime-probe

      - name: Build C4 NeoForge runtime registry probe
        run: |
          chmod +x ".factory-ci/c11/runtime-probe/gradlew"
          cd ".factory-ci/c11/runtime-probe"
          GRADLE_USER_HOME="$GITHUB_WORKSPACE/.factory-ci/c11/gradle-home" ./gradlew test build --no-daemon

      - name: Publish C11 registry probe JAR
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: c11-registry-probe
          path: .factory-ci/c11/runtime-probe/build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

  c11-completion:
    needs:
      - c11-preflight-contracts
      - c11-preflight-probe
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout with preserved upstreams
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Require final physical acceptance gate to be cleared
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          blocker = "SUPER_HYPER_URGENT_FINAL_CONSTRUCTION_PHYSICAL_ACCEPTANCE"
          state_path = Path("construction/fixtures/complex-modded-golden/capture-state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          if state.get("status") == blocker and state.get("blocks_c11_completion") is True:
              raise SystemExit(f"C11_COMPLETION_BLOCKED: {blocker}")
          PY
          if [[ ! -f construction/fixtures/complex-modded-golden/registry.json ]]; then
            echo "::error::C11_COMPLETION_BLOCKED: missing final canonical C4 registry evidence"
            exit 1
          fi
          python3 -m unittest construction/tests/test_c11_complex_modded_golden.py -v
